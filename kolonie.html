          return j.batch.length ? undefined : FAIL;
        }
        if (r === 'moving') return;
        const give = Math.min(World.bpNeed(b, j.mat), c.carry.n);
        const bp = World.bp[b];
        bp.del[j.mat] = (bp.del[j.mat] || 0) + give;
        c.carry.n -= give;
        if (c.carry.n <= 0) c.carry = null;
        if (j.last >= 0 && j.last !== b) Game.release('o' + j.last, c);
        j.last = b;
        j.batch = j.batch.filter(q => q !== b);
        j.walkKey = null;
        return;
      }
      const i = j.i, bp = World.bp[i];
      if (!bp) return FAIL;
      const def = BUILD[bp.type];
      const bx = ix(i), by = iy(i), mode = def.blocks ? 2 : 1;
      if (j.stage === 3) {
        c.activity = 'Jde stavět: ' + def.name.toLowerCase();
        const r = walk(c, j, bx, by, mode, 'o' + i);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 4;
      }
      if (j.stage === 4) {
        const far = Math.max(Math.abs(c.tx - bx), Math.abs(c.ty - by)) > 1;
        if (far || (def.blocks && c.tx === bx && c.ty === by)) { j.stage = 3; j.walkKey = null; return; }
        c.activity = 'Staví: ' + def.name.toLowerCase();
        c.face(bx, by);
        j.progress += c.work('build');
        c.workFrac = j.progress / def.work;
        if (j.progress >= def.work) {
          World.completeBlueprint(i);
          Game.onTileChanged(bx, by);
          Game.stats.built++;
          if (World.struct[i]) Animals.onBuilt(World.struct[i]);
          return DONE;
        }
      }
    },

    /**
     * Práce v dílně (pila, pec): 0 co chybí → 1 pro surovinu → 2 donést do
     * zásobníku dílny → 3 dojít → 4 vyrábět, dokud jsou suroviny a není splněn cíl.
     */
    craft(c, j) {
      const s = World.struct[j.i];
      if (!s || s.decon || !BUILD[s.type].machine) return FAIL;
      const r = Machines.recipes(BUILD[s.type].machine)[j.ri || 0], x = ix(j.i), y = iy(j.i);
      const outType = Object.keys(r.out)[0];
      const target = r.target !== undefined ? r.target : s.target;
      if (j.stage === 0) {
        let miss = null;
        for (const k in r.in) if ((s.inv[k] || 0) < r.in[k]) { miss = k; break; }
        if (!miss) j.stage = 3;
        else {
          j.mat = miss;
          if (c.carry && c.carry.type === miss) j.stage = 2;
          else {
            const src = nearestItem([miss], c);
            if (src < 0) return FAIL;
            const amt = Math.min(Machines.room(s, miss), Game.availItem(src), Config.CARRY);
            Game.reserveItem(src, amt, c);
            j.src = src; j.amt = amt; j.stage = 1;
          }
        }
      }
      if (j.stage === 1) {
        c.activity = 'Nese suroviny do dílny (' + ITEMS[j.mat].name.toLowerCase() + ')';
        const r2 = walk(c, j, ix(j.src), iy(j.src), 0, 'i' + j.src);
        if (r2 === 'fail') return FAIL;
        if (r2 === 'moving') return;
        if (!c.pickup(j.src, j.amt, j.mat)) return FAIL;
        j.stage = 2;
      }
      if (j.stage === 2) {
        const r2 = walk(c, j, x, y, 2);
        if (r2 === 'fail') return FAIL;
        if (r2 === 'moving') return;
        if (c.carry && c.carry.type === j.mat) {
          const k = Math.min(c.carry.n, Machines.room(s, j.mat));
          s.inv[j.mat] = (s.inv[j.mat] || 0) + k;
          c.carry.n -= k;
          if (c.carry.n <= 0) c.carry = null; else c.dropCarry();
        }
        j.stage = 0; j.walkKey = null;
        return;
      }
      if (j.stage === 3) {
        c.activity = 'Jde do dílny: ' + BUILD[s.type].name.toLowerCase();
        const r2 = walk(c, j, x, y, 2);
        if (r2 === 'fail') return FAIL;
        if (r2 === 'moving') return;
        j.stage = 4; j.made = 0;
      }
      if (j.stage === 4) {
        if (!Machines.hasInputs(s, r)) return j.made ? DONE : FAIL;
        c.activity = 'Vyrábí: ' + ITEMS[outType].name.toLowerCase();
        c.face(x, y);
        j.progress += c.work('craft');
        s.prog = j.progress / r.work;
        s.used = Game.tickCount;
        c.workFrac = s.prog;
        if (BUILD[s.type].machine.pollute) Pollution.add(j.i, BUILD[s.type].machine.pollute);
        if (j.progress >= r.work) {
          const out = Machines.craft(s);
          for (const k in out) World.dropItem(c.tx, c.ty, k, out[k]);
          Game.stats.crafted++;
          j.progress = 0;
          if (++j.made >= 8 || World.counts[outType] >= target) return DONE;
        }
      }
    },

    /** Lov a porážka: přiblížit se na dostřel, mířit, vystřelit (hodit oštěp). */
    hunt(c, j) {
      const a = Animals.byId(j.a);
      if (!a || a.gone || !a.hunt) return DONE;
      j.t = (j.t || 0) + 1;
      if (j.t > 2600) return FAIL;
      const d = Math.hypot(a.x - c.x, a.y - c.y);
      const range = c.bow ? 7 : 5;
      if (d > range) {
        c.activity = 'Stopuje zvěř: ' + a.def.name.toLowerCase();
        if (!c.path || (j.t % 40) === 0) {
          if (!c.pathTo(a.tx, a.ty, 1)) { c.unreach.set(j.key, TimeSys.minutes + 60); return FAIL; }
        }
        c.followPath();
        j.progress = 0;
        return;
      }
      c.path = null;
      c.activity = (a.def.wild ? 'Loví: ' : 'Poráží: ') + a.def.name.toLowerCase();
      c.face(a.tx, a.ty);
      j.progress += c.work('hunt');
      c.workFrac = j.progress / 60;
      if (j.progress >= 60) {
        j.progress = 0;
        Game.shot(c.x, c.y - 0.4, a.x, a.y, c.bow ? '#e8e2d0' : '#b98a56');
        const hit = !a.def.wild || U.chance((c.bow ? 0.6 : 0.42) + c.skills.hunt.lvl * 0.03);
        if (hit) {
          a.hp -= c.bow ? 24 : 15;
          if (a.hp <= 0 || !a.def.wild) { Animals.kill(a); return DONE; }
        }
        if (a.def.wild) a.flee(c, false);
      }
    },

    /** Stříhání ovce. */
    shear(c, j) {
      const a = Animals.byId(j.a);
      if (!a || a.gone || a.prod < 1) return DONE;
      j.t = (j.t || 0) + 1;
      if (j.t > 2000) return FAIL;
      if (Math.hypot(a.x - c.x, a.y - c.y) > 1.6) {
        c.activity = 'Jde stříhat ovci';
        if (!c.path || (j.t % 40) === 0) { if (!c.pathTo(a.tx, a.ty, 1)) return FAIL; }
        c.followPath();
        return;
      }
      c.path = null;
      a.timer = 60; a.path = null;      // ovce chvíli postojí
      c.activity = 'Stříhá ovci';
      c.face(a.tx, a.ty);
      j.progress += c.work('grow');
      c.workFrac = j.progress / 70;
      if (j.progress >= 70) {
        a.prod = 0;
        World.dropItem(c.tx, c.ty, 'wool', a.def.wool);
        return DONE;
      }
    },

    /** Vzít si výbavu (teplé oblečení, kuši). */
    equip(c, j) {
      const it = World.items[j.i];
      if (!it || it.type !== j.item || c[j.item]) return FAIL;
      c.activity = 'Jde si pro: ' + ITEMS[j.item].name.toLowerCase();
      const r = walk(c, j, ix(j.i), iy(j.i), 0, 'i' + j.i);
      if (r === 'fail') return FAIL;
      if (r === 'moving') return;
      if (!c.pickup(j.i, 1, j.item)) return FAIL;
      c.carry = null;
      c[j.item] = true;
      return DONE;
    },

    /** Výzkum u výzkumného stolu. */
    research(c, j) {
      const s = World.struct[j.i];
      if (!s || s.decon || !Research.current) return DONE;
      const x = ix(j.i), y = iy(j.i);
      if (j.stage === 0) {
        c.activity = 'Jde bádat';
        const r = walk(c, j, x, y, 2);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 1;
      }
      c.activity = 'Zkoumá: ' + TECHS[Research.current].name.toLowerCase();
      c.face(x, y);
      s.used = Game.tickCount;
      c.workFrac = Research.progress(Research.current);
      Research.add(c.work('research') * Config.RESEARCH_RATE);
      if (++j.progress > 500) return DONE;   // občas přerušit kvůli jídlu a spánku
    },

    decon(c, j) {
      const i = j.i, t = World.deconTarget(i);
      if (!t) return FAIL;
      const def = BUILD[t.type];
      const x = ix(i), y = iy(i), mode = def.blocks ? 2 : 1;
      if (j.stage === 0) {
        c.activity = 'Jde bourat: ' + def.name.toLowerCase();
        const r = walk(c, j, x, y, mode);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 1;
      }
      c.activity = 'Bourá: ' + def.name.toLowerCase();
      c.face(x, y);
      j.progress += c.work('build');
      const need = def.work * 0.6;
      c.workFrac = j.progress / need;
      if (j.progress >= need) {
        World.deconstruct(i);
        Game.onTileChanged(x, y);
        return DONE;
      }
    },

    sow(c, j) {
      const i = j.i, x = ix(i), y = iy(i);
      if (!World.canSow(i)) return FAIL;
      if (j.stage === 0) {
        c.activity = 'Jde sázet';
        const r = walk(c, j, x, y, 0);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 1;
      }
      c.activity = 'Sází brambory';
      j.progress += c.work('grow');
      c.workFrac = j.progress / 28;
      if (j.progress >= 28) {
        World.setCrop(i, 0);
        return DONE;
      }
    },

    harvest(c, j) {
      const i = j.i, x = ix(i), y = iy(i), cr = World.crops[i];
      if (!cr || cr.g < 1) return FAIL;
      if (j.stage === 0) {
        c.activity = 'Jde sklízet';
        const r = walk(c, j, x, y, 0);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 1;
      }
      c.activity = 'Sklízí úrodu';
      j.progress += c.work('grow');
      c.workFrac = j.progress / 32;
      if (j.progress >= 32) {
        World.removeCrop(i);
        const yieldN = Math.round(6 * (0.85 + c.skills.grow.lvl * 0.04));
        World.dropItem(x, y, 'food', yieldN);
        Game.stats.harvested += yieldN;
        return DONE;
      }
    },

    cook(c, j) {
      const i = j.i, s = World.struct[i];
      if (!s || s.type !== 'campfire' || s.decon) return FAIL;
      const x = ix(i), y = iy(i);
      if (j.stage === 0) {
        if (c.carry && COOKABLE.includes(c.carry.type)) { j.mat = c.carry.type; j.stage = 2; }
        else {
          // maso a vejce se kazí nejrychleji → vařit je přednostně
          let src = nearestItem(['meat'], c);
          if (src < 0) src = nearestItem(['egg', 'food'], c);
          if (src < 0) return FAIL;
          const amt = Math.min(Game.availItem(src), 4);
          Game.reserveItem(src, amt, c);
          j.src = src; j.amt = amt; j.mat = World.items[src].type; j.stage = 1;
        }
      }
      if (j.stage === 1) {
        c.activity = 'Nese suroviny k ohništi';
        const r = walk(c, j, ix(j.src), iy(j.src), 0);
        if (r === 'fail') { c.unreach.set('i' + j.src, TimeSys.minutes + 60); return FAIL; }
        if (r === 'moving') return;
        if (!c.pickup(j.src, j.amt, j.mat)) return FAIL;
        j.stage = 2;
      }
      if (j.stage === 2) {
        c.activity = 'Jde k ohništi';
        const r = walk(c, j, x, y, 2);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 3; j.made = 0;
      }
      if (j.stage === 3) {
        if (!c.carry || c.carry.type !== j.mat) return FAIL;
        c.activity = 'Vaří jídlo';
        c.face(x, y);
        j.progress += c.work('cook');
        c.workFrac = j.progress / 40;
        if (j.progress >= 40) {
          j.progress = 0;
          c.carry.n--;
          j.made++;
          // zkušený kuchař občas uvaří porci navíc
          if (U.chance(c.skills.cook.lvl * 0.02)) j.made++;
          if (c.carry.n <= 0) {
            c.carry = null;
            World.dropItem(c.tx, c.ty, 'meal', j.made);
            Game.stats.cooked += j.made;
            return DONE;
          }
        }
      }
    },

    haul(c, j) {
      const i = j.i;
      if (j.stage === 0) {
        const it = World.items[i];
        if (!it) return FAIL;
        const dest = findStockDest(it.type, c);
        if (dest < 0) { c.unreach.set(j.key, TimeSys.minutes + 20); return FAIL; }
        if (!Game.reserve('d' + dest, c)) return FAIL;
        const amt = Math.min(Game.availItem(i), Config.CARRY);
        if (amt <= 0) return FAIL;
        Game.reserveItem(i, amt, c);
        j.dest = dest; j.amt = amt; j.mat = it.type; j.stage = 1;
      }
      if (j.stage === 1) {
        c.activity = 'Nese do skladu: ' + ITEMS[j.mat].name.toLowerCase();
        const r = walk(c, j, ix(i), iy(i), 0);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        if (!c.pickup(i, j.amt, j.mat)) return FAIL;
        j.stage = 2;
      }
      if (j.stage === 2) {
        const r = walk(c, j, ix(j.dest), iy(j.dest), 0);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        if (c.carry) {
          const left = World.putItem(j.dest, c.carry.type, c.carry.n, c.carry.age || 0);
          if (left > 0) World.dropItem(c.tx, c.ty, c.carry.type, left, c.carry.age || 0);
          c.carry = null;
        }
        return DONE;
      }
    },

    /** Jídlo: dojít pro porci, vzít ji a sníst – u stolu, pokud je volná židle. */
    eat(c, j) {
      if (j.stage === 0) {
        const it = World.items[j.i];
        if (!it || (it.type !== 'meal' && it.type !== 'food' && it.type !== 'egg')) return FAIL;
        c.activity = 'Jde se najíst';
        const r = walk(c, j, ix(j.i), iy(j.i), 0, 'i' + j.i);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.food = it.type;
        if (!c.pickup(j.i, 1, it.type)) return FAIL;
        j.seat = findSeat(c);
        if (j.seat >= 0 && !Game.reserve('s' + j.seat, c)) j.seat = -1;
        j.stage = j.seat >= 0 ? 1 : 2;
      }
      if (j.stage === 1) {
        c.activity = 'Nese si jídlo ke stolu';
        const r = walk(c, j, ix(j.seat), iy(j.seat), 0, 's' + j.seat);
        if (r === 'moving') return;
        if (r === 'fail') j.seat = -1;
        j.stage = 2;
      }
      if (!c.carry || c.carry.type !== j.food) return FAIL;
      c.activity = (j.food === 'meal' ? 'Jí teplé jídlo' : 'Jí syrové potraviny') + (j.seat >= 0 ? ' u stolu' : '');
      j.progress++;
      c.workFrac = j.progress / 50;
      c.eating = true;
      if (j.progress >= 50) {
        c.carry = null;
        if (j.food === 'meal') {
          c.hunger = Math.min(100, c.hunger + 60);
          c.addThought('meal', 'Teplé jídlo', 6, 10);
        } else {
          c.hunger = Math.min(100, c.hunger + 32);
          c.addThought('raw', 'Jedl/a syrové jídlo', -6, 10);
        }
        if (j.seat >= 0) c.addThought('table', 'Jedl/a u stolu', 4, 10);
        return DONE;
      }
    },

    /** Hašení požáru – dělá ho každý bez ohledu na priority. */
    firefight(c, j) {
      const i = j.i;
      if (!Fire.burning(i)) return DONE;
      if (j.stage === 0) {
        c.activity = 'Běží hasit požár';
        const r = walk(c, j, ix(i), iy(i), 2, 'f' + i);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 1;
      }
      c.activity = 'Hasí požár';
      c.face(ix(i), iy(i));
      j.progress += c.work(null);
      c.workFrac = j.progress / 45;
      if (j.progress >= 45) { Fire.extinguish(i); return DONE; }
    },

    sleep(c, j) {
      if (j.stage === 0) {
        if (j.bed >= 0) {
          const s = World.struct[j.bed];
          if (!s || s.type !== 'bed') return FAIL;
          c.activity = 'Jde spát';
          const r = walk(c, j, ix(j.bed), iy(j.bed), 0);
          if (r === 'fail') { c.unreach.set('b' + j.bed, TimeSys.minutes + 120); return FAIL; }
          if (r === 'moving') return;
          s.owner = c.id;
        }
        j.stage = 1;
      }
      if (j.bed >= 0 && !World.struct[j.bed]) return FAIL;
      c.sleeping = true;
      c.activity = j.bed >= 0 ? 'Spí v posteli' : (j.collapse ? 'Zhroutil/a se vyčerpáním' : 'Spí na zemi');
      const rate = (j.bed >= 0 ? 100 / 7 : 100 / 9.5) * Config.HOURS_PER_TICK;
      c.energy = Math.min(100, c.energy + rate);
      const wake = (!TimeSys.isNight() && c.energy >= 97) || c.hunger < 12 || (c.energy >= 100 && TimeSys.hour >= 5 && TimeSys.hour < 22);
      if (wake) {
        if (j.bed >= 0) {
          const room = World.roomAt(j.bed);
          if (room && room.beds.length === 1) c.addThought('sleep', 'Vlastní ložnice', 9, 14);
          else if (room) c.addThought('sleep', 'Vyspal/a se pod střechou', 5, 14);
          else c.addThought('sleep', 'Postel pod širým nebem', 2, 14);
        } else c.addThought('sleep', 'Spal/a na zemi', -7, 14);
        return DONE;
      }
    },

    wander(c, j) {
      if (j.stage === 0) {
        let tx = c.tx, ty = c.ty;
        const home = World.start;
        const far = Math.hypot(c.tx - home.x, c.ty - home.y) > 18;
        for (let k = 0; k < 12; k++) {
          const bx = far ? home.x : c.tx, by = far ? home.y : c.ty;
          const x = bx + U.int(-5, 5), y = by + U.int(-5, 5);
          if (World.canWalk(x, y)) { tx = x; ty = y; break; }
        }
        j.tx = tx; j.ty = ty; j.stage = 1;
        j.wait = U.int(40, 120);
      }
      if (j.stage === 1) {
        c.activity = c.inBreak() ? 'Psychické zhroucení – bloumá' : 'Odpočívá';
        const r = walk(c, j, j.tx, j.ty, 0);
        if (r === 'fail') return FAIL;
        if (r === 'moving') return;
        j.stage = 2;
      }
      if (--j.wait <= 0) return DONE;
    },
  };

  /** Společná logika pro kácení, těžbu a sběr. */
  function gather(c, j, des, label, skill) {
    const i = j.i, o = World.obj[i];
    if (!o || o.des !== des) return FAIL;
    if (des === 'harvest' && !o.berries) return FAIL;
    const x = ix(i), y = iy(i);
    const def = OBJECTS[o.type];
    if (j.stage === 0) {
      c.activity = label;
      const r = walk(c, j, x, y, def.blocks ? 2 : 1);
      if (r === 'fail') return FAIL;
      if (r === 'moving') return;
      j.stage = 1;
    }
    c.activity = label;
    c.face(x, y);
    j.progress += c.work(skill);
    const need = def.work * (o.type === 'tree' ? (0.5 + o.size * 0.5) : 1);
    c.workFrac = j.progress / need;
    if (j.progress < need) return;
    if (o.type === 'tree') {
      World.removeObj(i);
      Fire.extinguish(i);
      Game.stats.chopped++;
      World.dropItem(x, y, 'wood', Math.round(10 * o.size + c.skills.chop.lvl * 0.15));
    } else if (o.type === 'rock') {
      World.removeObj(i);
      Game.stats.mined++;
      World.dropItem(x, y, 'stone', U.int(5, 7));
    } else if (o.type === 'ore') {
      // ložisko: ubývá zásoba, políčko zmizí až po vyčerpání
      const k = Math.min(Config.ORE_PER_MINE, o.amount);
      o.amount -= k;
      Game.stats.mined++;
      World.dropItem(c.tx, c.ty, 'ore', k);
      if (o.amount <= 0) World.removeObj(i);
    } else if (o.type === 'bush') {
      o.berries = false;
      o.regrow = Config.BUSH_REGROW_HOURS; // označení zůstává → po dorůstání se sklidí znovu
      World.dropItem(x, y, 'food', U.int(4, 6));
    }
    Game.onTileChanged(x, y);
    return DONE;
  }

  return { DONE, FAIL, drivers, findWork, findFood, hasFood, findBed, findFire, findSeat, nearestItem, anyItem, candidates };
})();

  <script>
// ===== js/sprites.js =====
'use strict';
/**
 * Sprites – veškerá pixel-art grafika generovaná kódem (žádné externí obrázky).
 */
const Sprites = (() => {
  const S = { obj: {}, items: {}, build: {}, crop: [], des: {}, icons: {} };

  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  /** Kreslení po pixelech do ImageData. */
  function paint(w, h, fn) {
    const c = canvas(w, h);
    const g = c.getContext('2d');
    const img = g.createImageData(w, h);
    const d = img.data;
    const set = (x, y, col, a) => {
      x |= 0; y |= 0;
      if (x < 0 || y < 0 || x >= w || y >= h || !col) return;
      const k = (y * w + x) * 4;
      const alpha = a !== undefined ? a : (col[3] !== undefined ? col[3] : 255);
      if (alpha < 255 && d[k + 3] > 0) {
        const t = alpha / 255;
        d[k] = d[k] * (1 - t) + col[0] * t; d[k + 1] = d[k + 1] * (1 - t) + col[1] * t; d[k + 2] = d[k + 2] * (1 - t) + col[2] * t;
        d[k + 3] = Math.max(d[k + 3], alpha);
      } else {
        d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = alpha;
      }
    };
    const get = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
    const rect = (x, y, rw, rh, col, a) => { for (let yy = y; yy < y + rh; yy++) for (let xx = x; xx < x + rw; xx++) set(xx, yy, col, a); };
    fn(set, get, rect, w, h);
    g.putImageData(img, 0, 0);
    return c;
  }

  /** Obrys kolem neprůhledných pixelů. */
  function outline(c, col = [26, 20, 16], minA = 200) {
    const g = c.getContext('2d');
    const w = c.width, h = c.height;
    const img = g.getImageData(0, 0, w, h);
    const d = img.data;
    const a = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : d[(y * w + x) * 4 + 3];
    const add = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (a(x, y) > 0) continue;
      if (a(x - 1, y) >= minA || a(x + 1, y) >= minA || a(x, y - 1) >= minA || a(x, y + 1) >= minA) add.push((y * w + x) * 4);
    }
    for (const k of add) { d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255; }
    g.putImageData(img, 0, 0);
    return c;
  }

  const H = U.hash2;
  const pickPal = (pal, v) => pal[Math.max(0, Math.min(pal.length - 1, Math.floor(v * pal.length)))];

  // ============ TERÉN (jedno velké plátno s plynulými přechody) ============
  const PAL = {
    water:   [[30, 62, 112], [36, 72, 126], [42, 82, 138], [36, 70, 124]],
    shallow: [[60, 116, 146], [68, 128, 154], [76, 140, 162], [64, 122, 150]],
    sand:    [[196, 170, 118], [208, 184, 132], [218, 196, 144], [204, 178, 126]],
    grass:   [[70, 112, 48], [80, 124, 54], [90, 136, 60], [100, 146, 66], [84, 128, 56]],
    soil:    [[72, 54, 34], [82, 62, 38], [92, 70, 44], [78, 58, 36]],
    dirt:    [[120, 94, 62], [132, 104, 70], [142, 114, 78], [126, 98, 66]],
    gravel:  [[100, 96, 90], [112, 108, 100], [124, 118, 110], [106, 102, 96]],
  };

  function buildTerrain() {
    const TS = Config.TILE, W = World.w * TS, Hh = World.h * TS;
    const c = canvas(W, Hh);
    const g = c.getContext('2d');
    const img = g.createImageData(W, Hh);
    const d = img.data;
    const seed = World.seed;
    const tAt = (x, y) => {
      x = x < 0 ? 0 : x >= World.w ? World.w - 1 : x;
      y = y < 0 ? 0 : y >= World.h ? World.h - 1 : y;
      return World.terrain[y * World.w + x];
    };
    for (let py = 0; py < Hh; py++) {
      for (let px = 0; px < W; px++) {
        // posun vzorkování → zubaté, přirozené okraje mezi terény
        const n1 = U.noise(px / 7, py / 7, seed + 11), n2 = U.noise(px / 7, py / 7, seed + 23);
        const jx = (n1 - 0.5) * 11 + (H(px, py, seed + 1) - 0.5) * 3;
        const jy = (n2 - 0.5) * 11 + (H(px, py, seed + 2) - 0.5) * 3;
        const t = tAt(Math.floor((px + jx) / TS), Math.floor((py + jy) / TS));
        const hsh = H(px, py, seed);
        const nn = U.noise(px / 9, py / 9, seed + 31);
        let col;
        switch (t) {
          case T.WATER: {
            const band = Math.sin(px * 0.18 + py * 0.07 + nn * 7);
            col = pickPal(PAL.water, nn * 0.7 + hsh * 0.3);
            if (band > 0.93) col = [64, 108, 164];
            break;
          }
          case T.SHALLOW: {
            const band = Math.sin(px * 0.2 + py * 0.05 + nn * 6);
            col = pickPal(PAL.shallow, nn * 0.7 + hsh * 0.3);
            if (band > 0.9) col = [104, 166, 182];
            if (hsh > 0.985) col = [170, 156, 112];
            break;
          }
          case T.SAND:
            col = pickPal(PAL.sand, nn * 0.6 + hsh * 0.4);
            if (hsh > 0.97) col = [168, 144, 100];
            break;
          case T.GRASS: {
            col = pickPal(PAL.grass, nn * 0.65 + hsh * 0.35);
            const b = H(px, py >> 1, seed + 7);
            if (b > 0.94) col = [112, 160, 74];
            else if (b < 0.05) col = [58, 96, 40];
            if (hsh > 0.996) col = [220, 210, 90]; // kvítek
            else if (hsh > 0.993) col = [230, 230, 240];
            break;
          }
          case T.SOIL:
            col = pickPal(PAL.soil, nn * 0.6 + hsh * 0.4);
            if (hsh > 0.93) col = H(px >> 1, py >> 1, seed + 4) > 0.5 ? [86, 126, 52] : [70, 108, 44];
            else if (hsh < 0.03) col = [60, 42, 28];
            break;
          case T.DIRT:
            col = pickPal(PAL.dirt, nn * 0.6 + hsh * 0.4);
            if (hsh > 0.98) col = [100, 132, 64];
            else if (hsh < 0.025) col = [100, 78, 52];
            break;
          default: // GRAVEL
            col = pickPal(PAL.gravel, nn * 0.55 + hsh * 0.45);
            if (hsh > 0.95) col = [144, 138, 128];
            else if (hsh < 0.04) col = [80, 76, 72];
        }
        const k = (py * W + px) * 4;
        d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    S.terrain = c;
  }

  function makeTree(seed, kind) {
    return outline(paint(20, 28, (set, get, rect) => {
      // stín
      for (let y = 23; y < 28; y++) for (let x = 3; x < 17; x++) {
        const dx = (x - 10) / 7, dy = (y - 25.5) / 2.4;
        if (dx * dx + dy * dy < 1) set(x, y, [0, 0, 0], 70);
      }
      // kmen
      for (let y = 15; y < 26; y++) {
        set(9, y, [70, 46, 28]); set(10, y, [96, 64, 38]); set(11, y, [84, 56, 32]);
      }
      set(8, 25, [70, 46, 28]); set(12, 25, [70, 46, 28]);
      if (kind === 'pine') {
        const pal = [[24, 62, 44], [34, 82, 56], [46, 102, 66], [64, 124, 78]];
        for (let tier = 0; tier < 4; tier++) {
          const top = 1 + tier * 5, bottom = top + 8;
          for (let y = top; y < bottom; y++) {
            const half = 1 + (y - top) * (1.0 + tier * 0.18);
            for (let x = Math.floor(10 - half); x <= Math.ceil(10 - 1 + half); x++) {
              const edge = Math.abs(x - 9.5) > half - 1.2;
              const lv = 0.45 + (9.5 - x) / 14 - (y - top) / 20 + (H(x, y, seed) - 0.5) * 0.3;
              set(x, y, edge ? pal[0] : pickPal(pal, lv));
            }
          }
        }
      } else {
        const hue = H(1, 2, seed);
        const base = hue < 0.33 ? [[34, 74, 34], [50, 98, 40], [70, 122, 50], [98, 150, 64], [128, 176, 80]]
          : hue < 0.66 ? [[40, 78, 30], [60, 104, 36], [84, 130, 44], [112, 156, 56], [140, 180, 70]]
          : [[36, 70, 40], [52, 94, 50], [72, 118, 58], [96, 140, 66], [124, 166, 84]];
        const blobs = [[10, 10, 7.5], [6, 12, 4.5], [14, 12, 4.5], [10, 6, 5]];
        for (let y = 0; y < 22; y++) for (let x = 0; x < 20; x++) {
          let inside = false, minEdge = 9;
          for (const [bx, by, br] of blobs) {
            const r = br + (H(x, y, seed + 9) - 0.5) * 1.2;
            const dd = Math.hypot(x - bx, y - by);
            if (dd <= r) { inside = true; minEdge = Math.min(minEdge, r - dd); }
          }
          if (!inside) continue;
          const lv = 0.55 - (x - 10) / 22 - (y - 9) / 16 + (H(x, y, seed + 3) - 0.5) * 0.35;
          let col = pickPal(base, lv);
          if (minEdge < 0.9 && y > 8) col = base[0];
          set(x, y, col);
        }
        // pár jablíček / květů
        if (hue > 0.8) for (let k = 0; k < 4; k++) set(4 + H(k, 1, seed) * 12, 5 + H(k, 2, seed) * 10, [200, 60, 50]);
      }
    }));
  }

  function makeRock(seed, ore) {
    return paint(16, 16, (set) => {
      const pal = [[92, 88, 84], [104, 100, 94], [116, 112, 104], [128, 122, 114]];
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
        const v = U.noise(x / 4 + seed, y / 4, seed) * 0.6 + H(x, y, seed) * 0.4;

      // praskliny

      if (ore) {

        for (let k = 0; k < 7; k++) {
          const cx = 2 + H(k, 5, seed) * 12, cy = 2 + H(k, 6, seed) * 12;
          for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) {

        }
      }

  }

  // ============ KOLONISTÉ ============
  function colonist(look) {
    const out = {};
    const skin = look.skin, skinD = U.shade(look.skin, 0.82);
    const hair = look.hair, hairL = U.shade(look.hair, 1.3);
    const shirt = look.shirt, shirtD = U.shade(look.shirt, 0.75), shirtL = U.shade(look.shirt, 1.18);
    const pants = look.pants, boots = [44, 34, 28];
    const eye = [30, 24, 30];
    for (const dir of ['down', 'up', 'left', 'right']) {
      out[dir] = [];
      for (let f = 0; f < 3; f++) {
        out[dir].push(outline(paint(16, 16, (set, get, rect) => {
          const side = dir === 'left' || dir === 'right';
          const flip = dir === 'left';
          const X = (x) => flip ? 15 - x : x;
          // nohy
          let lA = 0, lB = 0;
          if (f === 1) { lA = -1; lB = 0; } else if (f === 2) { lA = 0; lB = -1; }
          if (!side) {
            rect(6, 12, 2, 2 + lA, pants); set(6, 14 + lA, boots); set(7, 14 + lA, boots);
            rect(8, 12, 2, 2 + lB, pants); set(8, 14 + lB, boots); set(9, 14 + lB, boots);
          } else {
            const o1 = f === 1 ? 1 : f === 2 ? -1 : 0;
            rect(X(7 + o1) - (flip ? 1 : 0), 12, 2, 2, pants); set(X(7 + o1), 14, boots); set(X(8 + o1), 14, boots);
            rect(X(7 - o1) - (flip ? 1 : 0), 12, 2, 2, U.shade(pants, 0.85)); set(X(7 - o1), 14, boots); set(X(8 - o1), 14, boots);
          }
          // tělo
          rect(5, 8, 6, 4, shirt);
          for (let y = 8; y < 12; y++) { set(X(10), y, shirtD); set(X(5), y, side ? shirt : shirtL); }
          rect(5, 11, 6, 1, U.shade(pants, 0.7)); // opasek
          // ruce
          if (!side) {
            const sw = f === 0 ? 0 : (f === 1 ? -1 : 1);
            rect(4, 8 + Math.max(0, sw), 1, 3, shirtD); set(4, 11 + Math.max(0, sw), skin);
            rect(11, 8 + Math.max(0, -sw), 1, 3, shirtD); set(11, 11 + Math.max(0, -sw), skin);
          } else {
            const sw = f === 1 ? 1 : f === 2 ? -1 : 0;
            rect(X(8 + sw), 9, 1, 2, shirtD); set(X(8 + sw), 11, skin);
          }
          // hlava
          rect(4, 1, 8, 7, skin);
          for (let y = 1; y < 8; y++) set(X(11), y, skinD);
          // vlasy
          const style = look.style;
          if (style !== 'bald') {
            rect(4, 0, 8, 2, hair);
            rect(4, 0, 8, 1, hairL);
            if (dir === 'up') rect(4, 0, 8, 7, hair);
            else if (side) { rect(X(10) - (flip ? 0 : 0), 1, 2, 4, hair); set(X(9), 2, hair); }
            else { set(4, 2, hair); set(11, 2, hair); }
            if (style === 'long') {
              if (dir === 'up') { rect(3, 1, 10, 7, hair); rect(5, 8, 6, 1, hair); }
              else if (side) rect(X(11) - (flip ? 0 : 1), 2, 2, 7, hair);
              else { rect(3, 2, 1, 7, hair); rect(12, 2, 1, 7, hair); rect(4, 2, 1, 4, hair); rect(11, 2, 1, 4, hair); }
            } else if (style === 'bun') {
              rect(6, -1 + 1, 4, 1, hairL);
              if (dir === 'up' || side) rect(side ? X(11) - (flip ? 0 : 1) : 6, 1, 3, 3, hair);
            } else if (style === 'spiky') {
              set(5, 0, hairL); set(7, 0, hairL); set(9, 0, hairL); set(11, 1, hair);
            } else if (style === 'beard' && dir !== 'up') {
              if (side) { rect(X(5) - (flip ? 1 : 0), 5, 3, 3, hair); }
              else { rect(5, 6, 6, 2, hair); set(4, 5, hair); set(11, 5, hair); }
            }
          } else {
            set(5, 1, U.shade(skin, 1.08)); set(6, 1, U.shade(skin, 1.08));
          }
          // obličej
          if (dir === 'down') {
            set(6, 4, eye); set(9, 4, eye);
            set(6, 3, U.shade(skin, 1.05)); set(5, 5, [230, 140, 130], 120); set(10, 5, [230, 140, 130], 120);
            if (style !== 'beard') set(7, 6, skinD), set(8, 6, skinD);
          } else if (side) {
            set(X(5), 4, eye);
            set(X(3), 4, skin); // nos
          }
        })));
      }
    }
    return out;
  }

  function makeAnimals() {
    // čtyřnožec z boku; `o` = barvy a rozměry
    const quad = (o) => (f, flip) => outline(paint(16, 14, (set, get, rect) => {
      const X = (x) => flip ? 15 - x : x;
      const R = (x, y, w, h, c) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) set(X(xx), yy, c); };
      const [bx, by, bw, bh] = o.body;
      for (let y = by; y < by + bh; y++) for (let x = bx; x < bx + bw; x++) {
        const dx = (x - bx - bw / 2 + 0.5) / (bw / 2), dy = (y - by - bh / 2 + 0.5) / (bh / 2);
        if (dx * dx + dy * dy <= 1.05) set(X(x), y, dy < -0.3 ? o.light : dy > 0.4 ? o.dark : (o.fluff && H(x, y, 9) > 0.7 ? o.dark : o.col));
      }
      R(o.head[0], o.head[1], o.head[2], o.head[3], o.headCol || o.col);
      set(X(o.head[0] + 1), o.head[1] + 1, [20, 16, 16]);
      if (o.extra) o.extra(set, X, R);
      const l1 = f ? 0 : 1, l2 = f ? 1 : 0, ly = by + bh - 1, ll = o.leg;
      R(bx + 1, ly, 1, ll - l1, o.dark); R(bx + 3, ly, 1, ll - l2, o.dark);
      R(bx + bw - 4, ly, 1, ll - l2, o.dark); R(bx + bw - 2, ly, 1, ll - l1, o.dark);
    }));
    const mk = (fn) => ({ left: [fn(0, false), fn(1, false)], right: [fn(0, true), fn(1, true)] });
    const boar = quad({ body: [3, 4, 10, 6], head: [1, 6, 3, 3], col: [96, 72, 56], dark: [70, 52, 40], light: [124, 96, 76], leg: 3,
      extra: (set, X) => { for (let x = 4; x < 11; x += 2) set(X(x), 3, [70, 52, 40]); set(X(0), 7, [200, 150, 140]); set(X(1), 9, [236, 230, 214]); } });
    const deer = quad({ body: [4, 4, 9, 5], head: [1, 2, 3, 3], col: [168, 118, 70], dark: [124, 84, 48], light: [198, 150, 98], leg: 5,
      extra: (set, X, R) => { R(3, 4, 2, 2, [168, 118, 70]); set(X(2), 0, [226, 214, 190]); set(X(3), 1, [226, 214, 190]); set(X(1), 1, [226, 214, 190]); set(X(13), 5, [240, 236, 226]); } });
    const sheep = quad({ body: [3, 3, 10, 7], head: [1, 5, 3, 3], col: [236, 234, 226], dark: [200, 198, 190], light: [252, 250, 244], headCol: [70, 62, 58], leg: 3, fluff: true });
    const chicken = (f, flip) => outline(paint(10, 10, (set, get, rect) => {

      for (let y = 3; y < 8; y++) for (let x = 2; x < 8; x++) if (Math.hypot(x - 4.5, (y - 5) * 1.2) < 3) set(X(x), y, y < 5 ? [250, 246, 236] : [222, 214, 196]);
      set(X(2), 2, [250, 246, 236]); set(X(2), 3, [250, 246, 236]); set(X(1), 3, [236, 170, 60]); set(X(2), 1, [210, 50, 50]);
      set(X(8), 3, [222, 214, 196]); set(X(8), 4, [222, 214, 196]);
      set(X(4), 8 + (f ? 0 : 0), [236, 170, 60]); if (!f) set(X(5), 8, [236, 170, 60]); else set(X(3), 8, [236, 170, 60]);
    }));
    S.animals = { boar: mk(boar), deer: mk(deer), sheep: mk(sheep), chicken: mk(chicken) };

// ===== js/colonist.js =====
'use strict';
/**
 * Colonist – kolonista: potřeby (hlad, energie, nálada), dovednosti, priority, AI a pohyb.
 */
class Colonist {
  constructor(id, x, y, opts) {
    this.id = id;
    this.gender = opts.gender;
    this.first = opts.first;
    this.last = opts.last;
    this.name = opts.first + ' ' + opts.last;
    this.look = opts.look;
    this.trait = opts.trait;
    this.age = opts.age;
    this.sprites = Sprites.colonist(this.look);
    this.portrait = Sprites.portrait(this.sprites);

    this.x = x + 0.5; this.y = y + 0.5;
    this.dir = 'down'; this.animT = 0; this.moving = false;

    this.skills = {};
    for (const k in SKILLS) this.skills[k] = { lvl: opts.skills[k], xp: 0 };
    this.priorities = {};
    for (const wt of WORK_TYPES) {
      if (!wt.skill) { this.priorities[wt.id] = 3; continue; }
      const l = this.skills[wt.skill].lvl;
      this.priorities[wt.id] = l >= 8 ? 1 : l >= 4 ? 2 : l >= 2 ? 3 : 4;
    }

    this.hunger = U.range(70, 90);
    this.energy = U.range(75, 95);
    this.health = 100;
    this.dead = false;
    this.warmth = 100;       // tělesné teplo 0..100
    this.coat = false;       // má teplé oblečení
    this.bow = false;        // má kuši
    this.mood = 60;
    this.moodTarget = 60;
    this.thoughts = [];

    this.job = null;
    this.path = null; this.pathI = 0; this.dest = null;
    this.carry = null;
    this.activity = 'Rozhlíží se';
    this.thinkCd = U.int(1, 10);
    this.unreach = new Map();
    this.resKeys = [];
    this.itemRes = [];
    this.sleeping = false;
    this.eating = false;
    this.workFrac = -1;
    this.working = false;
    this.breakUntil = 0;
    this.tickN = U.int(0, 29);
  }

  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }
  inBreak() { return this.breakUntil > TimeSys.minutes; }

  // ---------- Dovednosti a práce ----------
  skillFactor(skill) { return 0.55 + this.skills[skill].lvl * 0.075; }
  moodFactor() { return this.mood < 25 ? 0.8 : this.mood > 75 ? 1.12 : 1; }
  work(skill) {
    this.working = true;
    let f = (skill ? this.skillFactor(skill) : 1) * this.moodFactor() * (this.trait.work || 1);
    if (this.hunger < 5) f *= 0.7;
    if (skill) this.gainXp(skill, 0.07);
    return f;
  }
  xpNeed(lvl) { return 50 + lvl * 18; }
  gainXp(skill, amount) {
    const s = this.skills[skill];
    if (s.lvl >= 20) return;
    s.xp += amount * (this.trait.learn || 1);
    while (s.xp >= this.xpNeed(s.lvl) && s.lvl < 20) {
      s.xp -= this.xpNeed(s.lvl);
      s.lvl++;
      UI.toast(`${this.first} se zlepšil/a: ${SKILLS[skill]} → ${s.lvl}`, 'good');
    }
  }

  // ---------- Myšlenky a nálada ----------
  addThought(id, label, val, hours) {
    this.thoughts = this.thoughts.filter(t => t.id !== id);
    this.thoughts.push({ id, label, val, until: TimeSys.minutes + hours * 60 });
  }
  moodFactors() {
    const out = [{ label: 'Základ', val: 50 }];
    if (this.trait.mood) out.push({ label: this.trait.name, val: this.trait.mood });
    for (const t of this.thoughts) out.push({ label: t.label, val: t.val });
    if (this.hunger < 5) out.push({ label: 'Hladoví', val: -20 });
    else if (this.hunger < 25) out.push({ label: 'Má hlad', val: -8 });
    if (this.energy < 10) out.push({ label: 'Vyčerpání', val: -14 });
    else if (this.energy < 25) out.push({ label: 'Únava', val: -6 });
    const here = World.idx(this.tx, this.ty);
    const roofed = World.isRoofed(here);
    const temp = World.tempAt(here);
    if (this.health < 40) out.push({ label: 'Podlomené zdraví', val: -8 });
    if (Weather.rain > 0.3 && !roofed) out.push({ label: temp < 0 ? 'Sněží mu/jí za krk' : 'Moknutí v dešti', val: -4 });
    if (this.warmth < 20) out.push({ label: 'Podchlazení', val: -12 });
    else if (this.warmth < 55) out.push({ label: 'Prochladl/a', val: -6 });
    else if (roofed && TimeSys.temp() < 6 && temp > 8) out.push({ label: 'Teplo domova', val: 3 });
    if (this.coat && TimeSys.temp() < 4) out.push({ label: 'Teplé oblečení', val: 2 });
    if (World.floor[here]) out.push({ label: 'Pěkné prostředí', val: 2 });
    if (TimeSys.daylight() < 0.4 && Game.nearLight(this.tx, this.ty)) out.push({ label: 'Teplo a světlo ohně', val: 3 });
    if (Weather.cur === 'clear' && TimeSys.daylight() > 0.8) out.push({ label: 'Krásný den', val: 2 });
    return out;
  }
  updateMood(hours) {
    const now = TimeSys.minutes;
    this.thoughts = this.thoughts.filter(t => t.until > now);
    this.moodTarget = U.clamp(this.moodFactors().reduce((s, f) => s + f.val, 0), 0, 100);
    const r = 8 * hours;
    this.mood += U.clamp(this.moodTarget - this.mood, -r, r);
    // psychické zhroucení
    if (this.mood < 18 && !this.inBreak() && U.chance(0.3 * hours)) {
      this.breakUntil = now + 60 * 3;
      if (this.job) this.endJob();
      UI.toast(`${this.first} má psychické zhroucení! Na chvíli odmítá pracovat.`, 'warn');
    }
  }

  // ---------- Zdraví ----------
  /** Dlouhé hladovění a vyčerpání ubírají zdraví; sytý a odpočatý kolonista se léčí. */
  updateHealth(hours) {
    let d = 0, cause = '';
    // tělesné teplo: bez teplého oblečení venku v mrazu ubývá, v teple se vrací
    const amb = World.tempAt(World.idx(this.tx, this.ty));
    const comfort = this.coat ? -14 : 3;
    if (amb < comfort) this.warmth = Math.max(0, this.warmth - (comfort - amb) * 0.9 * hours);
    else this.warmth = Math.min(100, this.warmth + (6 + (amb - comfort)) * 1.2 * hours);
    if (this.warmth < 20) { d -= 3 * hours; cause = 'podchlazením'; }
    if (this.hunger <= 0) { d -= 4.5 * hours; cause = 'hladem'; }
    if (this.energy <= 0) { d -= 2 * hours; cause = cause || 'vyčerpáním'; }
    if (d === 0 && this.hunger > 30 && this.energy > 15) d = (this.sleeping ? 3 : 1.5) * hours;
    if (d < 0 && this.health >= 50 && this.health + d < 50) Game.alert(`${this.first} je ve vážném stavu – umírá ${cause}!`, 'warn', this.tx, this.ty);
    this.health = U.clamp(this.health + d, 0, 100);
    if (this.health <= 0) Game.killColonist(this, cause || 'vyčerpáním');
  }

  // ---------- Pohyb ----------
  speed() {
    let s = 0.105 * (this.trait.move || 1);
    if (this.energy < 10) s *= 0.8;
    if (this.hunger < 5) s *= 0.85;
    if (this.health < 40) s *= 0.8;
    if (this.carry) s *= 0.92;
    return s;
  }
  pathTo(x, y, mode) {
    const p = Pathfinder.find(this.tx, this.ty, x, y, mode);
    if (!p) { this.path = null; return false; }
    this.path = p; this.pathI = 0; this.dest = { x, y, mode };
    return true;
  }
  followPath() {
    if (!this.path) return 'fail';
    if (this.pathI >= this.path.length) {
      // dosednout do středu políčka
      const cx = this.tx + 0.5, cy = this.ty + 0.5;
      const d = Math.hypot(cx - this.x, cy - this.y);
      if (d > 0.02) {
        const sp = Math.min(d, this.speed());
        this.x += (cx - this.x) / d * sp; this.y += (cy - this.y) / d * sp;
        this.moving = true;
        if (d > sp) return 'moving';
      }
      this.path = null;
      return 'arrived';
    }
    const ni = this.path[this.pathI];
    if (!World.walk[ni]) {
      // cesta se zablokovala – přepočítat
      if (!this.pathTo(this.dest.x, this.dest.y, this.dest.mode)) return 'fail';
      return 'moving';
    }
    const nx = (ni % World.w) + 0.5, ny = Math.floor(ni / World.w) + 0.5;
    const dx = nx - this.x, dy = ny - this.y;
    const d = Math.hypot(dx, dy);
    const ci = World.idx(this.tx, this.ty);
    const sp = this.speed() / ((World.cost[ni] + World.cost[ci]) * 0.5);
    if (d <= sp) { this.x = nx; this.y = ny; this.pathI++; }
    else { this.x += dx / d * sp; this.y += dy / d * sp; }
    if (Math.abs(dx) > Math.abs(dy)) this.dir = dx > 0 ? 'right' : 'left';
    else if (Math.abs(dy) > 0.01) this.dir = dy > 0 ? 'down' : 'up';
    this.moving = true;
    this.animT += sp;
    if (this.pathI >= this.path.length) return this.followPath();
    return 'moving';
  }
  face(x, y) {
    const dx = x + 0.5 - this.x, dy = y + 0.5 - this.y;
    if (Math.abs(dx) > Math.abs(dy)) this.dir = dx > 0 ? 'right' : 'left';
    else if (Math.abs(dy) > 0.01) this.dir = dy > 0 ? 'down' : 'up';
  }

  // ---------- Předměty ----------
  pickup(i, want, type) {
    Game.releaseItemRes(this, i);
    const it = World.items[i];
    if (!it || it.type !== type) return false;
    if (this.carry && this.carry.type !== type) this.dropCarry();
    const have = this.carry ? this.carry.n : 0;
    const age = it.age || 0;
    const k = World.takeItem(i, Math.min(want, Config.CARRY - have));
    if (k <= 0) return false;
    if (this.carry) { this.carry.age = (this.carry.age * have + age * k) / (have + k); this.carry.n += k; }
    else this.carry = { type, n: k, age };
    return true;
  }
  dropCarry() {
    if (!this.carry) return;
    World.dropItem(this.tx, this.ty, this.carry.type, this.carry.n, this.carry.age || 0);
    this.carry = null;
  }

  // ---------- Úkoly ----------
  startJob(job) {
    this.job = job;
    job.stage = 0; job.progress = 0; job.walkKey = null;
    if (job.key) Game.reserve(job.key, this);
    if (job.type === 'eat' || job.type === 'equip') Game.reserveItem(job.i, 1, this);
    if (job.type === 'sleep' && job.bed >= 0) Game.reserve('b' + job.bed, this);
  }
  endJob() {
    Game.releaseAll(this);
    this.dropCarry();
    this.job = null;
    this.path = null;
    this.sleeping = false;
    this.workFrac = -1;
  }

  think() {
    const night = TimeSys.isNight();
    if (this.inBreak()) { this.startJob({ type: 'wander' }); return; }
    // hašení požáru má přednost před vším kromě holého přežití
    if (Fire.tiles.size && this.hunger > 12 && this.energy > 8) {
      const f = Jobs.findFire(this);
      if (f >= 0) { this.startJob({ type: 'firefight', i: f, key: 'f' + f }); return; }
    }
    if (this.hunger < 30) {
      const f = Jobs.findFood(this);
      if (f >= 0) { this.startJob({ type: 'eat', i: f, key: 'e' + f + '_' + this.id }); return; }
      Game.notifyOnce('nofood', 'Kolonisté nemají co jíst! Sbírejte bobule nebo založte pole.', 'warn', 180);
    }
    if (this.energy < 25 || (night && this.energy < 92)) {
      this.startJob({ type: 'sleep', bed: Jobs.findBed(this) });
      return;
    }
    // výbava: teplé oblečení a kuše, pokud jsou ve skladu
    const gear = !this.coat && Jobs.anyItem('coat') ? 'coat' : !this.bow && Jobs.anyItem('bow') ? 'bow' : null;
    if (gear) {
      const gi = Jobs.nearestItem([gear], this);
      if (gi >= 0) { this.startJob({ type: 'equip', i: gi, item: gear }); return; }
    }
    const job = Jobs.findWork(this);
    if (job) { this.startJob(job); return; }
    this.startJob({ type: 'wander' });
  }

  tick() {
    const h = Config.HOURS_PER_TICK;
    this.moving = false;
    this.working = false;
    this.eating = false;
    // potřeby
    this.hunger = Math.max(0, this.hunger - (100 / 20) * h * (this.trait.hunger || 1) * (this.sleeping ? 0.5 : 1));
    if (!this.sleeping) this.energy = Math.max(0, this.energy - (100 / 21) * h);
    if (++this.tickN >= 30) { this.tickN = 0; this.updateMood(30 * h); this.updateHealth(30 * h); if (this.dead) return; }

    // přerušení kvůli naléhavým potřebám
    if (this.job) {
      const t = this.job.type;
      if (t !== 'eat' && t !== 'sleep' && this.hunger < 12 && this.tickN === 0 && Jobs.findFood(this) >= 0) this.endJob();
      else if (t !== 'sleep' && this.energy <= 1) {
        this.endJob();
        this.startJob({ type: 'sleep', bed: -1, collapse: true });
        UI.toast(`${this.first} se zhroutil/a vyčerpáním!`, 'warn');
      } else if (t === 'wander' && !this.inBreak() && this.job.stage === 2 && this.job.wait > 20 && --this.thinkCd <= 0) {
        // během odpočinku se občas podívat po práci
        this.thinkCd = 20;
        if (Fire.tiles.size || Jobs.findWork(this) || this.hunger < 30 || this.energy < 25 || (TimeSys.isNight() && this.energy < 92)) this.endJob();
      }
    }
    if (!this.job) {
      if (--this.thinkCd <= 0) { this.thinkCd = 6; this.think(); }
    }
    if (this.job) {
      const r = Jobs.drivers[this.job.type](this, this.job);
      if (r === Jobs.DONE) { this.endJob(); this.thinkCd = 1; }
      else if (r === Jobs.FAIL) { this.endJob(); this.thinkCd = 4; }
    }
    if (!this.working && !this.eating) this.workFrac = -1;
  }
}

const LOOKS = {
  skins: [[241, 200, 160], [224, 172, 128], [198, 140, 98], [150, 100, 66], [245, 214, 180]],
  hairs: [[60, 40, 26], [30, 24, 20], [164, 104, 50], [214, 178, 96], [120, 70, 40], [190, 80, 40], [90, 90, 96]],
  shirts: [[180, 60, 56], [58, 108, 170], [70, 140, 80], [196, 150, 52], [130, 80, 160], [60, 150, 150], [200, 110, 60], [150, 150, 160]],
  pants: [[60, 64, 90], [80, 64, 48], [50, 54, 60], [96, 84, 64]],
};

/** Vytvoří náhodného kolonistu. `opts` může vnutit pohlaví, specializaci, rys a barvu trička. */
function makeColonist(id, x, y, usedFirst, opts = {}) {
  const gender = opts.gender || (U.chance(0.5) ? 'm' : 'f');
  let first, guard = 0;
  do { first = U.pick(NAMES[gender].first); } while (usedFirst.has(first) && ++guard < 50);
  usedFirst.add(first);
  const last = U.pick(NAMES[gender].last);
  const keys = Object.keys(SKILLS);
  const skills = {};
  for (const s of keys) skills[s] = U.int(0, 5);
  skills[opts.special || U.pick(keys)] = U.int(8, 12);
  skills[U.pick(keys)] += U.int(1, 3);
  const look = {
    skin: U.pick(LOOKS.skins),
    hair: U.pick(LOOKS.hairs),
    shirt: opts.shirt || U.pick(LOOKS.shirts),
    pants: U.pick(LOOKS.pants),
    style: gender === 'f' ? U.pick(['long', 'long', 'bun', 'short']) : U.pick(['short', 'short', 'spiky', 'bald', 'beard']),
  };
  return new Colonist(id, x, y, { gender, first, last, look, skills, trait: opts.trait || U.pick(TRAITS), age: U.int(19, 52) });
}

/** Vytvoří náhodnou startovní skupinu kolonistů (každý má jinou specializaci). */
function createColonists(start) {
  const out = [];
  const usedFirst = new Set();
  const skillKeys = U.shuffle(Object.keys(SKILLS));
  const traits = U.shuffle(TRAITS.slice());
  const shirts = U.shuffle(LOOKS.shirts.slice());
  const offsets = [[-1, 0], [1, 0], [0, 1], [2, 1]];
  for (let k = 0; k < 4; k++) {
    const gender = k % 2 === 0 ? (U.chance(0.5) ? 'm' : 'f') : (out[k - 1].gender === 'm' ? 'f' : 'm');
    const [ox, oy] = offsets[k];
    const p = World.canWalk(start.x + ox, start.y + oy) ? { x: start.x + ox, y: start.y + oy } : World.nearestWalkable(start.x, start.y);
    out.push(makeColonist(k, p.x, p.y, usedFirst, { gender, special: skillKeys[k], trait: traits[k], shirt: shirts[k] }));
  }
  return out;
}

// ===== js/animals.js =====
'use strict';
/**
 * Animals – zvěř a hospodářská zvířata.
 *  - jeleni: divoká zvěř, bloumá po mapě, dá se lovit,
 *  - divočáci: při nájezdu žerou úrodu na polích; bdělý kolonista je zaplaší,
 *  - slepice a ovce: žijí u kurníku / ovčína na zóně Pastvina, dávají vejce a vlnu.
 */
class Animal {
  constructor(type, x, y) {
    this.id = Animals.nextId++;
    this.type = type;
    this.def = ANIMALS[type];
    this.x = x + 0.5; this.y = y + 0.5;
    this.dir = 'left';
    this.state = 'wander';    // wander | raid | eat | flee
    this.path = null; this.pathI = 0;
    this.timer = U.int(20, 200);
    this.target = -1;
    this.leaveAt = 0;
    this.animT = 0;
    this.hp = this.def.hp;
    this.hunt = false;        // označeno k lovu / porážce
    this.home = -1;           // index kurníku / ovčína
    this.prod = U.rand();     // postup snášky / růstu vlny 0..1
    this.gone = false;
  }
  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }

  goTo(x, y, mode = 0) {
    const p = Pathfinder.find(this.tx, this.ty, x, y, mode);
    this.path = p; this.pathI = 0;
    return !!p;
  }
  /** Krok po cestě; vrací true po dojití. */
  step(speed) {
    if (!this.path || this.pathI >= this.path.length) return true;
    const ni = this.path[this.pathI];
    if (!World.walk[ni]) { this.path = null; return true; }
    const nx = (ni % World.w) + 0.5, ny = Math.floor(ni / World.w) + 0.5;
    const dx = nx - this.x, dy = ny - this.y, d = Math.hypot(dx, dy);
    const sp = speed / World.cost[ni];
    if (d <= sp) { this.x = nx; this.y = ny; this.pathI++; }
    else { this.x += dx / d * sp; this.y += dy / d * sp; }
    if (Math.abs(dx) > 0.01) this.dir = dx > 0 ? 'right' : 'left';
    this.animT += sp;
    return false;
  }
  /** Bdělý kolonista nablízku? */
  scared(r) {
    for (const c of Game.colonists) {
      if (!c.sleeping && Math.hypot(c.x - this.x, c.y - this.y) < r) return c;
    }
    return null;
  }
  /** Úprk pryč od kolonisty / kolonie. `leave` = zmizet z mapy po doběhnutí. */
  flee(from, leave) {
    this.state = 'flee';
    this.leaving = !!leave;
    const s = from || World.start;
    const ang = Math.atan2(this.y - (s.y + 0.5), this.x - (s.x + 0.5)) + U.range(-0.6, 0.6);
    for (let r = leave ? 26 : 10; r > 3; r -= 3) {
      const x = Math.round(this.x + Math.cos(ang) * r), y = Math.round(this.y + Math.sin(ang) * r);
      if (World.canWalk(x, y) && this.goTo(x, y)) return;
    }
    if (leave) this.gone = true; else { this.state = 'wander'; this.timer = 60; }
  }
  nearestCrop() {
    let best = -1, bd = Infinity;
    for (const i of World.cropSet) {
      const d = Math.abs((i % World.w) - this.tx) + Math.abs(((i / World.w) | 0) - this.ty);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }
  /** Náhodný cíl potulky; hospodářská zvířata se drží pastviny u svého domova. */
  wanderTarget() {
    const live = !this.def.wild;
    for (let k = 0; k < 10; k++) {
      let bx = this.tx, by = this.ty, r = 5;
      if (live && this.home >= 0) { bx = this.home % World.w; by = (this.home / World.w) | 0; r = 6; }
      const x = bx + U.int(-r, r), y = by + U.int(-r, r);
      if (!World.canWalk(x, y)) continue;
      const i = World.idx(x, y);
      if (live && Animals.hasPasture(this.home) && World.zone[i] !== 3) continue;
      if (live && !Animals.hasPasture(this.home) && Math.max(Math.abs(x - bx), Math.abs(y - by)) > 2) continue;
      if (World.terrain[i] === T.SHALLOW) continue;
      return this.goTo(x, y);
    }
    return false;
  }

  tick() {
    const d = this.def;
    if (this.state === 'flee') {
      if (this.step(d.speed * 1.5)) { if (this.leaving) this.gone = true; else { this.state = 'wander'; this.timer = 150; } }
      return;
    }
    if (d.wild) {
      const c = this.scared(d.shy);
      if (c) { this.flee(c, this.type === 'boar' && this.state !== 'wander'); return; }
    }
    if (this.state === 'raid' || this.state === 'eat') {
      if (TimeSys.minutes > this.leaveAt) { this.flee(null, true); return; }
      if (this.state === 'raid') {
        if (this.target < 0 || !World.crops[this.target]) {
          this.target = this.nearestCrop();
          if (this.target < 0 || !this.goTo(this.target % World.w, (this.target / World.w) | 0)) { this.flee(null, true); return; }
        }
        if (this.step(d.speed * 0.8)) { this.state = 'eat'; this.timer = 420; }
      } else if (--this.timer <= 0) {
        if (World.crops[this.target]) { World.removeCrop(this.target); Game.stats.cropsEaten++; }
        this.target = -1;
        this.state = 'raid';
      }
      return;
    }
    // potulka
    if (this.path && this.pathI < this.path.length) { this.step(d.speed * 0.5); return; }
    if (--this.timer <= 0) {
      this.timer = U.int(120, 400);
      this.wanderTarget();
    }
  }
}

const Animals = {
  list: [],
  nextId: 1,
  pastureCache: new Map(),
  reset() { this.list = []; this.nextId = 1; this.pastureCache.clear(); },

  tick() {
    if (!this.list.length) return;
    for (const a of this.list) a.tick();
    if (this.list.some(a => a.gone)) this.list = this.list.filter(a => !a.gone);
  },
  at(x, y) { return this.list.filter(a => a.tx === x && a.ty === y); },
  byId(id) { return this.list.find(a => a.id === id); },
  count(type) { let n = 0; for (const a of this.list) if (a.type === type) n++; return n; },

  /** Počet políček pastviny v okolí domova (kurníku / ovčína). */
  pastureTiles(home) {
    if (home < 0) return 0;
    const hx = home % World.w, hy = (home / World.w) | 0;
    let n = 0;
    for (let y = hy - 7; y <= hy + 7; y++) for (let x = hx - 7; x <= hx + 7; x++) {
      if (World.inb(x, y) && World.zone[World.idx(x, y)] === 3) n++;
    }
    return n;
  },
  hasPasture(home) { return this.pastureTiles(home) >= 4; },
  herd(home) { return this.list.filter(a => a.home === home); },
  /** Jak dobře je stádo živené: 1 = dost pastviny (3 políčka na kus), jinak úměrně méně. */
  feed(home) {
    const n = this.herd(home).length;
    if (!n) return 1;
    return U.clamp(this.pastureTiles(home) / (n * 3), 0.25, 1) * (TimeSys.season === 3 ? 0.5 : 1);
  },

  /** Jednou za herní hodinu: snáška, vlna, množení, přírůstek divoké zvěře. */
  hourly() {
    const feedOf = new Map();
    for (const a of this.list) {
      if (a.def.wild || a.home < 0) continue;
      if (!World.struct[a.home] || !BUILD[World.struct[a.home].type].livestock) { a.home = -1; continue; }
      if (!feedOf.has(a.home)) feedOf.set(a.home, this.feed(a.home));
      const f = feedOf.get(a.home);
      if (a.def.eggHours) {
        a.prod += f / a.def.eggHours;
        if (a.prod >= 1) { a.prod = 0; World.dropItem(a.tx, a.ty, 'egg', 1); Game.stats.eggs = (Game.stats.eggs || 0) + 1; }
      } else if (a.def.woolHours && a.prod < 1) a.prod = Math.min(1, a.prod + f / a.def.woolHours);
    }
    // množení u domovů
    for (const type of ['coop', 'sheepfold']) for (const i of World.structBy[type] || []) {
      const s = World.struct[i], L = BUILD[type].livestock;
      s.breed = (s.breed || 0) + (feedOf.get(i) || this.feed(i));
      const herd = this.herd(i);
      if (s.breed >= 60 && herd.length >= 2 && herd.length < L.cap) { s.breed = 0; this.spawnLivestock(i, 1); }
      else if (herd.length < 2 && s.breed >= 96) { s.breed = 0; this.spawnLivestock(i, 1); }   // zatoulaný kus se vrátí
    }
    // divoká zvěř: jeleni se objevují dál od kolonie
    if (this.count('deer') < 9 && U.chance(0.12)) {
      for (let k = 0; k < 30; k++) {
        const x = U.int(3, World.w - 4), y = U.int(3, World.h - 4), i = World.idx(x, y);
        if (!World.walk[i] || World.terrain[i] === T.SHALLOW || Math.hypot(x - World.start.x, y - World.start.y) < 22) continue;
        const n = U.int(2, 3);
        for (let q = 0; q < n; q++) { const p = World.canWalk(x + q, y) ? { x: x + q, y } : { x, y }; this.list.push(new Animal('deer', p.x, p.y)); }
        break;
      }
    }
  },
  spawnLivestock(home, n) {
    const L = BUILD[World.struct[home].type].livestock;
    const p = World.nearestWalkable(home % World.w, (home / World.w) | 0);
    for (let k = 0; k < n; k++) { const a = new Animal(L.type, p.x, p.y); a.home = home; this.list.push(a); }
  },
  /** Po dostavbě kurníku / ovčína přijdou první zvířata. */
  onBuilt(s) {
    const L = BUILD[s.type].livestock;
    if (L) { this.spawnLivestock(s.i, L.start); Game.alert(`${BUILD[s.type].name}: přišla první zvířata. Vyznač kolem zónu Pastvina.`, 'good', s.i % World.w, (s.i / World.w) | 0); }
  },

  /** Nájezd divočáků na pole. Vrací true, pokud se podařilo zvěř vysadit. */
  boarRaid() {
    if (World.cropSet.size < 6) return false;
    const crops = [...World.cropSet];
    const c = crops[Math.floor(U.rand() * crops.length)];
    const cx = c % World.w, cy = (c / World.w) | 0;
    let n = 0;
    const want = U.int(2, 3);
    for (let k = 0; k < 60 && n < want; k++) {
      const ang = U.rand() * Math.PI * 2, r = U.range(16, 24);
      const x = Math.round(cx + Math.cos(ang) * r), y = Math.round(cy + Math.sin(ang) * r);
      if (!World.canWalk(x, y) || !Pathfinder.find(x, y, cx, cy, 1)) continue;
      const a = new Animal('boar', x, y);
      a.state = 'raid'; a.leaveAt = TimeSys.minutes + 60 * 6;
      this.list.push(a);
      n++;
    }
    if (n) Game.alert('Divočáci se ženou na pole! Kolonista poblíž je zaplaší, lovec je může skolit.', 'warn', cx, cy);
    return n > 0;
  },
  /** Zabité zvíře: maso a kůže na zem. */
  kill(a) {
    a.gone = true;
    if (a.def.meat) World.dropItem(a.tx, a.ty, 'meat', a.def.meat);
    if (a.def.leather) World.dropItem(a.tx, a.ty, 'leather', a.def.leather);
    Game.stats.hunted = (Game.stats.hunted || 0) + 1;
  },

  pack() { return { nextId: this.nextId, list: this.list.map(a => ({ id: a.id, type: a.type, x: a.x, y: a.y, state: a.state === 'flee' ? 'wander' : a.state, leaveAt: a.leaveAt, hp: a.hp, hunt: a.hunt, home: a.home, prod: +a.prod.toFixed(3) })) }; },
  unpack(d) {
    this.reset();
    const arr = Array.isArray(d) ? d : (d && d.list) || [];
    for (const q of arr) {
      if (!ANIMALS[q.type]) continue;
      const a = new Animal(q.type, Math.floor(q.x), Math.floor(q.y));
      if (q.id) a.id = q.id;
      a.x = q.x; a.y = q.y;
      a.state = q.state || (q.type === 'boar' ? 'raid' : 'wander');
      a.leaveAt = q.leaveAt || 0;
      if (q.hp !== undefined) a.hp = q.hp;
      a.hunt = !!q.hunt; a.home = q.home !== undefined ? q.home : -1;
      if (q.prod !== undefined) a.prod = q.prod;
      this.list.push(a);
    }
    if (d && d.nextId) this.nextId = d.nextId;
    else this.nextId = Math.max(0, ...this.list.map(a => a.id)) + 1;
  },
};

// ===== js/events.js =====
'use strict';
/**
 * Events – náhodné události: příchod nového kolonisty, nájezd zvěře na pole.
 * (Požár po blesku spouští Weather.strike.) Kontroluje se jednou za herní hodinu.
 */
const Events = {
  nextJoin: 0,
  nextRaid: 0,

  reset() {
    this.nextJoin = TimeSys.minutes + 60 * 24 * U.range(3, 5);
    this.nextRaid = TimeSys.minutes + 60 * 24 * U.range(2, 3.5);
  },
  hourly() {
    const now = TimeSys.minutes;
    if (now >= this.nextJoin) {
      this.nextJoin = now + 60 * 24 * U.range(6, 10);
      if (Game.colonists.length < Config.MAX_COLONISTS && TimeSys.daylight() > 0.5) this.wanderer();
      else this.nextJoin = now + 60 * 6;
    }
    if (now >= this.nextRaid) {
      // zvěř chodí na pole za soumraku a v noci, ne v zimě
      if (TimeSys.season !== 3 && TimeSys.daylight() < 0.6 && Animals.boarRaid()) this.nextRaid = now + 60 * 24 * U.range(2.5, 5);
      else this.nextRaid = now + 60 * 3;
    }
  },
  /** K osadě se přidá poutník. */
  wanderer() {
    const s = World.start;
    let pos = null;
    for (let k = 0; k < 80 && !pos; k++) {
      const ang = U.rand() * Math.PI * 2, r = U.range(14, 22);
      const x = Math.round(s.x + Math.cos(ang) * r), y = Math.round(s.y + Math.sin(ang) * r);
      if (World.canWalk(x, y) && Pathfinder.find(x, y, s.x, s.y, 1)) pos = { x, y };
    }
    if (!pos) return;
    const used = new Set(Game.colonists.map(c => c.first));
    const c = makeColonist(Game.nextId++, pos.x, pos.y, used);
    Game.colonists.push(c);
    Game.stats.joined++;
    UI.buildColonistBar();
    Game.alert(`${c.name} (${c.trait.name.toLowerCase()}) se přidává ke kolonii!`, 'good', pos.x, pos.y);
  },
  pack() { return { nextJoin: this.nextJoin, nextRaid: this.nextRaid }; },
  unpack(d) { if (d) { this.nextJoin = d.nextJoin; this.nextRaid = d.nextRaid; } else this.reset(); },
};

// ===== js/camera.js =====
'use strict';
/**
 * Camera – pozice (střed ve světových pixelech) a přiblížení.
 */
const Camera = {
  x: 0, y: 0, zoom: Config.ZOOM_DEFAULT,
  vw: 800, vh: 600,
  follow: null,

  resize(w, h) { this.vw = w; this.vh = h; this.clamp(); },
  centerOn(wx, wy) { this.x = wx; this.y = wy; this.clamp(); },
  centerTile(tx, ty) { this.centerOn((tx + 0.5) * Config.TILE, (ty + 0.5) * Config.TILE); },
  screenToWorld(sx, sy) {
    return { x: (sx - this.vw / 2) / this.zoom + this.x, y: (sy - this.vh / 2) / this.zoom + this.y };
  },
  screenToTile(sx, sy) {
    const p = this.screenToWorld(sx, sy);
    return { x: Math.floor(p.x / Config.TILE), y: Math.floor(p.y / Config.TILE) };
  },
  worldToScreen(wx, wy) {
    return { x: (wx - this.x) * this.zoom + this.vw / 2, y: (wy - this.y) * this.zoom + this.vh / 2 };
  },
  pan(dxScreen, dyScreen) {
    this.x -= dxScreen / this.zoom;
    this.y -= dyScreen / this.zoom;
    this.follow = null;
    this.clamp();
  },
  setZoom(z, sx = this.vw / 2, sy = this.vh / 2) {
    const before = this.screenToWorld(sx, sy);
    this.zoom = U.clamp(z, this.minZoom(), Config.ZOOM_MAX);
    const after = this.screenToWorld(sx, sy);
    this.x += before.x - after.x;
    this.y += before.y - after.y;
    this.clamp();
  },
  minZoom() {
    // nedovolit oddálit tak, aby byla mapa menší než obrazovka
    const mw = World.w * Config.TILE, mh = World.h * Config.TILE;
    return Math.max(Config.ZOOM_MIN * 0.6, this.vw / mw, this.vh / mh, 0.5);
  },
  clamp() {
    if (!World.w) return;
    const mw = World.w * Config.TILE, mh = World.h * Config.TILE;
    const hw = this.vw / 2 / this.zoom, hh = this.vh / 2 / this.zoom;
    this.x = hw * 2 >= mw ? mw / 2 : U.clamp(this.x, hw, mw - hw);
    this.y = hh * 2 >= mh ? mh / 2 : U.clamp(this.y, hh - 60 / this.zoom, mh - hh + 140 / this.zoom);
  },
  update() {
    if (this.follow) {
      const c = this.follow;
      const tx = c.x * Config.TILE, ty = c.y * Config.TILE;
      this.x += (tx - this.x) * 0.12;
      this.y += (ty - this.y) * 0.12;
      this.clamp();
    }
  },
};

// ===== js/tools.js =====
'use strict';
/**
 * Tools – nástroje hráče (označování, stavění, zóny) a jejich aplikace na výběr políček.
 */
const Tools = (() => {
  const notBlockedTerrain = (i) => {
    const t = World.terrain[i];
    return t !== T.WATER && t !== T.SHALLOW;
  };

  // Každé `apply(i)` vrací funkci, která změnu na políčku vrátí zpět (tlačítko Zpět).
  const desTool = (des) => (i) => {
    const prev = World.obj[i].des;
    World.designate(i, des);
    return () => { const o = World.obj[i]; if (o && o.des === des) World.designate(i, prev); };
  };
  const setDecon = (i, on) => {
    const s = World.struct[i];
    if (s) { s.decon = on; i = s.i; } else if (World.floor[i]) World.floor[i].decon = on;
    if (on) World.deconSet.add(i); else World.deconSet.delete(i);
  };
  const isDecon = (i) => !!((World.struct[i] && World.struct[i].decon) || (!World.struct[i] && World.floor[i] && World.floor[i].decon));
  const zoneTool = (z) => (i) => {
    const prev = World.zone[i];
    World.zone[i] = z;
    let chopped = false;
    const o = World.obj[i];
    if (z === 2 && o && o.type === 'tree' && !o.des) { World.designate(i, 'chop'); chopped = true; }
    return () => {
      World.zone[i] = prev;
      const q = World.obj[i];
      if (chopped && q && q.des === 'chop') World.designate(i, null);
    };
  };

  const defs = {
    select: { name: 'Výběr', mode: 'none', hint: 'Klepni na kolonistu nebo políčko. Tažením posouváš mapu, dvěma prsty přibližuješ.' },
    chop: {
      name: 'Kácet', mode: 'rect', hint: 'Táhni prstem přes les – stromy se označí ke kácení.',
      valid: i => { const o = World.obj[i]; return !!o && o.type === 'tree' && o.des !== 'chop'; },
      apply: desTool('chop'),
    },
    mine: {
      name: 'Těžit', mode: 'rect', hint: 'Táhni přes skály a železnou rudu – označí se k těžbě.',
      valid: i => { const o = World.obj[i]; return !!o && (o.type === 'rock' || o.type === 'ore') && o.des !== 'mine'; },
      apply: desTool('mine'),
    },
    harvest: {
      name: 'Sbírat', mode: 'rect', hint: 'Táhni přes keře s bobulemi – kolonisté je budou sklízet.',
      valid: i => { const o = World.obj[i]; return !!o && o.type === 'bush' && o.des !== 'harvest'; },
      apply: desTool('harvest'),
    },
    decon: {
      name: 'Zbourat', mode: 'rect', hint: 'Táhni přes stavby nebo podlahy, které chceš zbourat (vrátí se část materiálu).',
      valid: i => !!((World.struct[i] && !World.struct[i].decon) || (!World.struct[i] && World.floor[i] && !World.floor[i].decon)),
      apply: i => { setDecon(i, true); return () => { if (isDecon(i)) setDecon(i, false); }; },
    },
    cancel: {
      name: 'Zrušit', mode: 'rect', hint: 'Táhni pro zrušení označení, plánů staveb a bourání.',
      valid: i => !!(World.bp[i] || (World.obj[i] && World.obj[i].des) || isDecon(i)),
      apply: i => {
        const bp = World.bp[i];
        const bpType = bp ? bp.type : null, bpAt = bp ? bp.i : i, bpDir = bp ? bp.dir : 0;
        const des = World.obj[i] ? World.obj[i].des : null;
        const decon = isDecon(i);
        if (bpType) World.cancelBlueprint(i);
        if (des) World.designate(i, null);
        if (decon) setDecon(i, false);
        return () => {
          if (bpType && defs[bpType].valid(bpAt, bpDir)) World.placeBlueprint(bpAt, bpType, bpDir);
          if (des && World.obj[i] && !World.obj[i].des) World.designate(i, des);
          if (decon && (World.struct[i] || World.floor[i])) setDecon(i, true);
        };
      },
    },
    zone_stock: {
      name: 'Sklad', mode: 'rect', hint: 'Táhni pro vytvoření skladu. Kolonisté sem nosí suroviny.',
      valid: i => World.zone[i] !== 1 && notBlockedTerrain(i) && !(World.obj[i] && OBJECTS[World.obj[i].type].blocks),
      apply: zoneTool(1),
      after: () => World.rebuildZones(),
    },
    zone_farm: {
      name: 'Pole', mode: 'rect', hint: 'Táhni přes trávu nebo úrodnou půdu – vznikne pole s bramborami. Stromy na něm se pokácí.',
      valid: i => World.zone[i] !== 2 && TERRAIN[World.terrain[i]].fert > 0 && !World.struct[i] && !World.floor[i] &&
        !(World.obj[i] && (World.obj[i].type === 'rock' || World.obj[i].type === 'ore')),
      apply: zoneTool(2),
      after: () => World.rebuildZones(),
    },
    zone_pasture: {
      name: 'Pastvina', mode: 'rect', hint: 'Táhni kolem kurníku nebo ovčína. Zvířata se drží na pastvině; počítej 3 políčka na kus.',
      valid: i => World.zone[i] !== 3 && notBlockedTerrain(i) && !World.struct[i] && !(World.obj[i] && OBJECTS[World.obj[i].type].blocks),
      apply: zoneTool(3),
      after: () => World.rebuildZones(),
    },
    hunt: {
      name: 'Lovit', mode: 'rect', hint: 'Táhni přes zvěř (nebo vlastní zvířata k porážce). Jednotlivý kus označíš i klepnutím na něj nástrojem Výběr.',
      valid: i => Animals.at(i % World.w, (i / World.w) | 0).some(a => !a.hunt),
      apply: i => {
        const marked = Animals.at(i % World.w, (i / World.w) | 0).filter(a => !a.hunt);
        for (const a of marked) a.hunt = true;
        return () => { for (const a of marked) a.hunt = false; };
      },
    },
    zone_clear: {
      name: 'Smazat zónu', mode: 'rect', hint: 'Táhni pro odstranění skladu, pole nebo pastviny.',
      valid: i => World.zone[i] !== 0,
      apply: zoneTool(0),
      after: () => World.rebuildZones(),
    },
  };

  // stavební nástroje z definic BUILD
  for (const k in BUILD) {
    const b = BUILD[k];
    const turns = !!(b.rot || b.size);
    const isBeltTool = !!(b.machine && b.machine.belt);
    const tileOk = (t) => {
      if (World.bp[t] || World.crops[t]) return false;
      if (b.onWater ? World.terrain[t] !== T.SHALLOW : !notBlockedTerrain(t)) return false;
      const o = World.obj[t];
      if (b.onOre ? !(o && o.type === 'ore') : !!o) return false;
      return b.layer === 'floor' ? !World.floor[t] : !World.struct[t];
    };
    defs[k] = {
      name: b.name, mode: b.mode, hint: b.hint, build: k, rot: !!b.rot, tech: b.tech,
      valid: (i, dir = Game.buildDir) => {
        if (!Research.unlocked(k)) return false;
        // přetažením přes hotový pás se jen změní jeho směr
        if (isBeltTool && World.isBelt(i)) return World.struct[i].dir !== dir && !World.struct[i].decon;
        const tiles = World.footprint(i, k, turns ? dir : 0);
        if (!tiles) return false;
        for (const t of tiles) if (!tileOk(t)) return false;
        return true;
      },
      apply: (i, dir = Game.buildDir) => {
        if (isBeltTool && World.isBelt(i)) {
          const s = World.struct[i], prev = s.dir;
          s.dir = dir;
          return () => { if (World.struct[i] === s) s.dir = prev; };
        }
        World.placeBlueprint(i, k, turns ? dir : 0);
        return () => { if (World.bp[i] && World.bp[i].type === k) World.cancelBlueprint(i); };
      },
    };
  }

  /** Seznam políček pro tah od (x0,y0) do (x1,y1) podle režimu nástroje. */
  function tilesFor(tool, x0, y0, x1, y1) {
    const d = defs[tool];
    if (!d || d.mode === 'none') return [];
    const out = [];
    const clampX = v => U.clamp(v, 0, World.w - 1), clampY = v => U.clamp(v, 0, World.h - 1);
    if (d.mode === 'single') {
      if (World.inb(x1, y1)) out.push(World.idx(x1, y1));
      return out;
    }
    if (d.mode === 'line') {
      // rovná čára po delší ose tahu, v pořadí tahu (pásy)
      const horiz = Math.abs(x1 - x0) >= Math.abs(y1 - y0);
      const len = horiz ? Math.abs(x1 - x0) : Math.abs(y1 - y0);
      const sx = Math.sign(x1 - x0), sy = Math.sign(y1 - y0);
      for (let k = 0; k <= len; k++) {
        const x = horiz ? x0 + sx * k : x0, y = horiz ? y0 : y0 + sy * k;
        if (World.inb(x, y)) out.push(World.idx(x, y));
      }
      return out;
    }
    let ax = clampX(Math.min(x0, x1)), bx = clampX(Math.max(x0, x1));
    let ay = clampY(Math.min(y0, y1)), by = clampY(Math.max(y0, y1));
    if (d.mode === 'perimeter') {
      if (bx - ax >= 1 && by - ay >= 1) {
        for (let x = ax; x <= bx; x++) { out.push(World.idx(x, ay)); out.push(World.idx(x, by)); }
        for (let y = ay + 1; y < by; y++) { out.push(World.idx(ax, y)); out.push(World.idx(bx, y)); }
        return out;
      }
    }
    for (let y = ay; y <= by; y++) for (let x = ax; x <= bx; x++) out.push(World.idx(x, y));
    return out;
  }

  const undoStack = [];
  const UNDO_MAX = 30;

  /** Směr stavby pro daný tah: čára (pás) míří ve směru tahu, jinak platí zvolené otočení. */
  function dirFor(tool, x0, y0, x1, y1) {
    const d = defs[tool];
    if (d && d.mode === 'line' && (x0 !== x1 || y0 !== y1)) {
      if (Math.abs(x1 - x0) >= Math.abs(y1 - y0)) return x1 > x0 ? 0 : 2;
      return y1 > y0 ? 1 : 3;
    }
    return Game.buildDir;
  }
  function countValid(tool, tiles, dir) {
    const d = defs[tool];
    let n = 0;
    if (d && d.valid) for (const i of tiles) if (d.valid(i, dir)) n++;
    return n;
  }
  /** Které suroviny chybí na `n` kusů stavby (názvy malými písmeny). */
  function lacking(tool, n) {
    const d = defs[tool], lack = [];
    if (!d || !d.build) return lack;
    const cost = BUILD[d.build].cost, have = World.counts;
    for (const m in cost) if (have[m] < cost[m] * n) lack.push(ITEMS[m].name.toLowerCase());
    return lack;
  }

  function apply(tool, tiles, dir = Game.buildDir) {
    const d = defs[tool];
    if (!d || !d.apply) return 0;
    if (d.tech && !Research.has(d.tech)) { UI.toast(`${d.name}: nejdřív vyzkoumej „${TECHS[d.tech].name}“.`, 'warn'); return 0; }
    const undos = [];
    for (const i of tiles) if (d.valid(i, dir)) undos.push(d.apply(i, dir));
    const n = undos.length;
    if (d.after) d.after();
    if (n > 0) {
      undoStack.push({ name: d.name, n, undos, after: d.after });
      if (undoStack.length > UNDO_MAX) undoStack.shift();
      if (d.build) {
        const lack = lacking(tool, n);
        UI.toast(`Naplánováno: ${d.name} ×${n}` + (lack.length ? ` – chybí ${lack.join(', ')}!` : ''), lack.length ? 'warn' : 'info');
      }
      UI.updateUndo();
    }
    return n;
  }

  /** Vrátí poslední akci hráče (označení, plán stavby, zónu…). */
  function undo() {
    const a = undoStack.pop();
    if (!a) return false;
    for (let k = a.undos.length - 1; k >= 0; k--) a.undos[k]();
    if (a.after) a.after();
    UI.toast(`Vráceno zpět: ${a.name} ×${a.n}`, 'info');
    UI.updateUndo();
    return true;
  }

  function costText(tool, n = 1) {
    const d = defs[tool];
    if (!d || !d.build) return '';
    const cost = BUILD[d.build].cost;
    return Object.keys(cost).map(m => `${cost[m] * n} ${ITEMS[m].name.toLowerCase()}`).join(', ');
  }

  return { defs, tilesFor, apply, costText, countValid, lacking, undo, undoStack, dirFor };
})();
