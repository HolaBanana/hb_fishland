  <script>
// ===== js/input.js =====
'use strict';
/**
 * Input – dotykové ovládání a myš:
 *  - 1 prst / levé tlačítko: s nástrojem "Výběr" posun mapy a klepnutí = výběr,
 *                            s jiným nástrojem tažení = výběr oblasti
 *  - 2 prsty: posun + zoom (pinch)
 *  - pravé / prostřední tlačítko: posun, kolečko: zoom
 *  - klávesy: mezerník pauza, 1–4 rychlost, WASD/šipky posun, Esc zrušit, Enter potvrdit, Ctrl+Z zpět
 */
const Input = {
  pointers: new Map(),
  gesture: null,          // {type:'pending'|'pan'|'drag'|'pinch'|'dead', ...}
  drag: null,             // aktuální výběr oblasti {x0,y0,x1,y1}
  hover: null,            // políčko pod kurzorem (myš)
  keys: new Set(),

  init(cv) {
    this.cv = cv;
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.move(e));
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => this.up(e, true));
    cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') this.hover = null; });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      const f = Math.exp(-e.deltaY * 0.0015);
      Camera.setZoom(Camera.zoom * f, e.clientX, e.clientY);
    }, { passive: false });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => this.key(e, true));
    window.addEventListener('keyup', e => this.key(e, false));
    // zabránit nativnímu zoomu stránky na iOS
    document.addEventListener('gesturestart', e => e.preventDefault());
  },

  down(e) {
    this.cv.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
    if (this.pointers.size === 1) {
      const pan = e.pointerType === 'mouse' && (e.button === 1 || e.button === 2);
      this.gesture = { type: pan ? 'pan' : 'pending', sx: e.clientX, sy: e.clientY, t: performance.now() };
    } else if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      this.drag = null;
      this.gesture = {
        type: 'pinch',
        d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        z0: Camera.zoom,
        mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2,
      };
    }
  },

  move(e) {
    if (e.pointerType === 'mouse') this.hover = Camera.screenToTile(e.clientX, e.clientY);
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    const px = p.x, py = p.y;
    p.x = e.clientX; p.y = e.clientY;
    const g = this.gesture;
    if (!g) return;
    if (g.type === 'pinch' && this.pointers.size >= 2) {
      const [a, b] = [...this.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      Camera.pan(mx - g.mx, my - g.my);
      Camera.setZoom(g.z0 * d / g.d0, mx, my);
      g.mx = mx; g.my = my;
      return;
    }
    if (g.type === 'pending') {
      if (Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > 8) {
        if (Game.tool === 'select') g.type = 'pan';
        else {
          g.type = 'drag';
          const t = Camera.screenToTile(g.sx, g.sy);
          this.drag = { x0: t.x, y0: t.y, x1: t.x, y1: t.y };
        }
      }
    }
    if (g.type === 'pan') Camera.pan(e.clientX - px, e.clientY - py);
    if (g.type === 'drag') {
      const t = Camera.screenToTile(e.clientX, e.clientY);
      this.drag.x1 = t.x; this.drag.y1 = t.y;
      this.edgeScroll(e.clientX, e.clientY);
    }
  },

  /** Při tažení výběru u okraje obrazovky posouvat kameru. */
  edgeScroll(x, y) {
    const m = 30, s = 6;
    let dx = 0, dy = 0;
    if (x < m) dx = s; else if (x > Camera.vw - m) dx = -s;
    if (y < m + 40) dy = s; else if (y > Camera.vh - m - 120) dy = -s;
    if (dx || dy) Camera.pan(dx, dy);
  },

  up(e, cancelled) {
    const g = this.gesture;
    this.pointers.delete(e.pointerId);
    if (!g) return;
    if (g.type === 'pinch') {
      // po pinchi ignorovat zbývající prst, dokud se nezvednou všechny
      if (this.pointers.size > 0) { this.gesture = { type: 'dead' }; return; }
    }
    if (this.pointers.size > 0) return;
    if (!cancelled) {
      if (g.type === 'pending') this.tap(e.clientX, e.clientY, e.pointerType);
      else if (g.type === 'drag' && this.drag) this.commit(this.drag, e.pointerType);
    }
    this.drag = null;
    this.gesture = null;
  },

  /**
   * Dokončený výběr nástrojem. Na dotyku se neprovede hned – zobrazí se náhled
   * s cenou a tlačítky Potvrdit / Zrušit. Myší se provádí okamžitě (lze vrátit Zpět).
   */
  commit(d, pointerType) {
    const sel = { tool: Game.tool, x0: d.x0, y0: d.y0, x1: d.x1, y1: d.y1 };
    sel.dir = Tools.dirFor(sel.tool, sel.x0, sel.y0, sel.x1, sel.y1);
    if (pointerType === 'mouse') {
      Game.setPending(null);
      Tools.apply(sel.tool, Tools.tilesFor(sel.tool, sel.x0, sel.y0, sel.x1, sel.y1), sel.dir);
    } else Game.setPending(sel);
  },

  tap(sx, sy, pointerType) {
    const t = Camera.screenToTile(sx, sy);
    if (Game.tool !== 'select') {
      this.commit({ x0: t.x, y0: t.y, x1: t.x, y1: t.y }, pointerType);
      return;
    }
    // výběr kolonisty (podle světové pozice, s tolerancí)
    const w = Camera.screenToWorld(sx, sy);
    let best = null, bd = 0.9;
    for (const c of Game.colonists) {
      const d = Math.hypot(w.x / Config.TILE - c.x, w.y / Config.TILE - (c.y - 0.35));
      if (d < bd) { bd = d; best = c; }
    }
    let an = null, ad = 0.8;
    for (const a of Animals.list) {
      const d = Math.hypot(w.x / Config.TILE - a.x, w.y / Config.TILE - (a.y - 0.2));
      if (d < ad) { ad = d; an = a; }
    }
    if (best) Game.select({ type: 'colonist', c: best });
    else if (an) Game.select({ type: 'animal', a: an });
    else if (World.inb(t.x, t.y)) Game.select({ type: 'tile', x: t.x, y: t.y });
    else Game.select(null);
  },

  key(e, down) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    const k = e.key.toLowerCase();
    if (down) {
      this.keys.add(k);
      if (k === ' ') { e.preventDefault(); Game.togglePause(); }
      else if (k === '1' || k === '2' || k === '3' || k === '4') Game.setSpeed(+k);
      else if (k === 'escape') {
        if (Game.pending) Game.setPending(null);
        else if (Game.tool !== 'select') UI.setTool('select');
        else Game.select(null);
      }
      else if (k === 'enter') Game.confirmPending();
      else if (k === 'r') Game.rotate();
      else if (k === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); Tools.undo(); }
      else if (k === '+' || k === '=') Camera.setZoom(Camera.zoom * 1.2);
      else if (k === '-') Camera.setZoom(Camera.zoom / 1.2);
    } else this.keys.delete(k);
  },

  update(dt) {
    const s = 600 * dt;
    let dx = 0, dy = 0;
    if (this.keys.has('a') || this.keys.has('arrowleft')) dx += s;
    if (this.keys.has('d') || this.keys.has('arrowright')) dx -= s;
    if (this.keys.has('w') || this.keys.has('arrowup')) dy += s;
    if (this.keys.has('s') || this.keys.has('arrowdown')) dy -= s;
    if (dx || dy) Camera.pan(dx, dy);
  },
};

  <script>
// ===== js/renderer.js =====
'use strict';
/**
 * Renderer – vykreslování mapy, objektů, kolonistů, osvětlení (den/noc) a počasí.
 * Kreslí se v pixelech zařízení se zaokrouhlením na společnou mřížku → bez švů mezi políčky.
 */
const Renderer = {
  init(cv) {
    this.cv = cv;
    this.ctx = cv.getContext('2d');
    this.light = document.createElement('canvas');
    this.lctx = this.light.getContext('2d');
    this.time = 0;
    this.rain = [];
    this.splash = [];
    this.clouds = [];
    for (let k = 0; k < 14; k++) {
      this.clouds.push({ x: Math.random() * World.w * 16, y: Math.random() * World.h * 16, r: 90 + Math.random() * 130, s: 0.6 + Math.random() * 0.6 });
    }
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    this.cv.width = Math.round(w * this.dpr);
    this.cv.height = Math.round(h * this.dpr);
    this.cv.style.width = w + 'px';
    this.cv.style.height = h + 'px';
    this.light.width = Math.ceil(this.cv.width / 4);
    this.light.height = Math.ceil(this.cv.height / 4);
    Camera.resize(w, h);
  },

  // --- převody světových pixelů na pixely zařízení ---
  X(wx) { return Math.round(this.ox + wx * this.z); },
  Y(wy) { return Math.round(this.oy + wy * this.z); },
  img(im, wx, wy, ww, wh) {
    const x0 = this.X(wx), y0 = this.Y(wy);
    this.ctx.drawImage(im, x0, y0, this.X(wx + ww) - x0, this.Y(wy + wh) - y0);
  },
  /** Obrázek otočený o dir×90° (vejde se do stejného obdélníku; u lichého směru se prohodí rozměry). */
  imgRot(im, wx, wy, ww, wh, dir) {
    if (!dir) { this.img(im, wx, wy, ww, wh); return; }
    const ctx = this.ctx, x0 = this.X(wx), y0 = this.Y(wy), w = this.X(wx + ww) - x0, h = this.Y(wy + wh) - y0;
    ctx.save();
    ctx.translate(x0 + w / 2, y0 + h / 2);
    ctx.rotate(dir * Math.PI / 2);
    if (dir & 1) ctx.drawImage(im, -h / 2, -w / 2, h, w); else ctx.drawImage(im, -w / 2, -h / 2, w, h);
    ctx.restore();
  },
  /** Rozměr stavby ve světových pixelech podle otočení. */
  sizeOf(type, dir) {
    const sz = BUILD[type].size, TS = Config.TILE;
    if (!sz) return [TS, TS];
    return dir & 1 ? [sz[1] * TS, sz[0] * TS] : [sz[0] * TS, sz[1] * TS];
  },
  /** Sprite stavby včetně otočení (pás podle směru, větší stavby o 90°). */
  buildSprite(type, wx, wy, dir) {
    const def = BUILD[type], [fw, fh] = this.sizeOf(type, dir);
    if (def.machine && def.machine.belt) {
      this.imgRot(Sprites.build.belt, wx, wy, fw, fh, dir);
      this.imgRot(Sprites.beltArrow[Game.speed > 0 ? Math.floor(this.time * 6) % 3 : 0], wx, wy, fw, fh, dir);
    } else if (def.size) this.imgRot(Sprites.build[type], wx, wy, fw, fh, dir & 1);
    else this.img(Sprites.build[type], wx, wy, fw, fh);
    if (def.rot && def.machine && !def.machine.belt) this.imgRot(Sprites.arrow, wx + 4, wy + 4, 8, 8, dir);
  },
  rect(wx, wy, ww, wh, col) {
    const x0 = this.X(wx), y0 = this.Y(wy);
    this.ctx.fillStyle = col;
    this.ctx.fillRect(x0, y0, this.X(wx + ww) - x0, this.Y(wy + wh) - y0);
  },

  draw(dt) {
    const ctx = this.ctx, TS = Config.TILE;
    this.time += dt;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, this.cv.width, this.cv.height);

    this.z = Camera.zoom * this.dpr;
    this.ox = Math.round(this.cv.width / 2 - Camera.x * this.z);
    this.oy = Math.round(this.cv.height / 2 - Camera.y * this.z);
    const tz = TS * this.z;
    const tx0 = Math.max(0, Math.floor(-this.ox / tz) - 1);
    const ty0 = Math.max(0, Math.floor(-this.oy / tz) - 1);
    const tx1 = Math.min(World.w - 1, Math.ceil((this.cv.width - this.ox) / tz));
    const ty1 = Math.min(World.h - 1, Math.ceil((this.cv.height - this.oy) / tz));
    this.view = { tx0, ty0, tx1, ty1 };

    // 1) terén
    const sx = tx0 * TS, sy = ty0 * TS, sw = (tx1 - tx0 + 1) * TS, sh = (ty1 - ty0 + 1) * TS;
    const dx0 = this.X(sx), dy0 = this.Y(sy);
    ctx.drawImage(Sprites.terrain, sx, sy, sw, sh, dx0, dy0, this.X(sx + sw) - dx0, this.Y(sy + sh) - dy0);

    // sněhová pokrývka (jen venku – podlahy a místnosti se kreslí přes ni)
    if (Weather.snow > 0.02) {
      ctx.fillStyle = `rgba(236,242,250,${Weather.snow * 0.5})`;
      ctx.fillRect(dx0, dy0, this.X(sx + sw) - dx0, this.Y(sy + sh) - dy0);
    }
    this.drawGround(tx0, ty0, tx1, ty1);
    this.drawRows(tx0, ty0, tx1, ty1);
    this.drawOverlays(tx0, ty0, tx1, ty1);
    this.drawClouds();
    this.drawLighting();
    this.drawWeather(dt);
    this.drawLabels();
    this.drawPreview();
  },

  // ---------- Vrstva země: vodní lesk, zóny, podlahy, pole, předměty ----------
  drawGround(tx0, ty0, tx1, ty1) {
    const ctx = this.ctx, TS = Config.TILE, W = World.w, t = this.time;
    const showGrid = Game.tool !== 'select';
    for (let y = ty0; y <= ty1; y++) {
      for (let x = tx0; x <= tx1; x++) {
        const i = y * W + x, wx = x * TS, wy = y * TS;
        const ter = World.terrain[i];
        if ((ter === T.WATER || ter === T.SHALLOW) && Camera.zoom > 1.4) {
          const h = U.hash2(x, y, 3);
          const a = Math.sin(t * 1.6 + h * 12);
          if (a > 0.6) this.rect(wx + 2 + h * 9, wy + 3 + (h * 37 % 9), 4, 1, `rgba(200,230,255,${(a - 0.6) * 0.8})`);
        }
        const z = World.zone[i];
        if (z === 2) {
          if (!World.crops[i]) this.rect(wx, wy, TS, TS, 'rgba(120,200,80,0.16)');
        } else if (z === 3) this.rect(wx, wy, TS, TS, 'rgba(200,230,140,0.13)');
        const fl = World.floor[i];
        if (fl) this.img(Sprites.build[fl.type], wx, wy, TS, TS);
        if (z === 1) this.rect(wx, wy, TS, TS, 'rgba(240,200,90,0.16)');
        const cr = World.crops[i];
        if (cr) {
          this.img(Sprites.tilled, wx, wy, TS, TS);
          const st = cr.g >= 1 ? 3 : cr.g > 0.6 ? 2 : cr.g > 0.25 ? 1 : 0;
          this.img(Sprites.crop[st], wx, wy, TS, TS);
        }
        const bp = World.bp[i];
        if (bp && BUILD[bp.type].layer === 'floor') this.drawBlueprint(bp, wx, wy);
        const st = World.struct[i];
        if (st && BUILD[st.type].machine && BUILD[st.type].machine.belt) {
          this.buildSprite(st.type, wx, wy, st.dir);
          if (st.decon) this.img(Sprites.des.decon, wx + 4, wy + 4, 8, 8);
        }
        if (showGrid) {
          this.rect(wx, wy, TS, 0.5 / Camera.zoom * 1.2, 'rgba(255,255,255,0.07)');
          this.rect(wx, wy, 0.5 / Camera.zoom * 1.2, TS, 'rgba(255,255,255,0.07)');
        }
      }
    }
    // okraje zón
    for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
      const i = y * W + x, z = World.zone[i];
      if (!z) continue;
      const col = z === 1 ? 'rgba(250,210,100,0.75)' : z === 2 ? 'rgba(140,220,100,0.6)' : 'rgba(230,240,170,0.6)';
      const wx = x * TS, wy = y * TS, th = 1;
      if (y === 0 || World.zone[i - W] !== z) this.rect(wx, wy, TS, th, col);
      if (y === World.h - 1 || World.zone[i + W] !== z) this.rect(wx, wy + TS - th, TS, th, col);
      if (x === 0 || World.zone[i - 1] !== z) this.rect(wx, wy, th, TS, col);
      if (x === World.w - 1 || World.zone[i + 1] !== z) this.rect(wx + TS - th, wy, th, TS, col);
    }
    // předměty
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    const fs = Math.round(U.clamp(5.5 * this.z, 9, 19 * this.dpr));
    ctx.font = `${fs}px VT323, monospace`;
    for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
      const it = World.items[y * W + x];
      if (!it) continue;
      let wx = x * TS, wy = y * TS;
      const bs = World.struct[y * W + x];
      if (bs && BUILD[bs.type].machine && BUILD[bs.type].machine.belt) {
        // hromádka na pásu plynule klouže ve směru pásu
        const ph = Game.speed > 0 ? (Game.tickCount % Config.BELT_PERIOD) / Config.BELT_PERIOD - 0.5 : 0;
        this.img(Sprites.items[it.type], wx + 3 + DIRS4[bs.dir][0] * ph * TS, wy + 2 + DIRS4[bs.dir][1] * ph * TS, 10, 10);
        continue;
      }
      if (bs && BUILD[bs.type].storage) continue;   // obsah truhly není vidět
      this.img(Sprites.items[it.type], wx + 1, wy, 14, 14);
      if (Camera.zoom >= 1.6) {
        const s = String(it.n);
        const px = this.X(wx + TS - 0.5), py = this.Y(wy + TS + 0.5);
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillText(s, px + 1, py + 1);
        ctx.fillStyle = '#fff';
        ctx.fillText(s, px, py);
      }
    }
  },

  drawBlueprint(bp, wx, wy) {
    const TS = Config.TILE, ctx = this.ctx;
    const [fw, fh] = this.sizeOf(bp.type, bp.dir || 0);
    ctx.globalAlpha = 0.45;
    this.buildSprite(bp.type, wx, wy, bp.dir || 0);
    ctx.globalAlpha = 1;
    this.rect(wx, wy, fw, fh, 'rgba(80,160,255,0.28)');
    const x0 = this.X(wx), y0 = this.Y(wy);
    ctx.strokeStyle = 'rgba(140,200,255,0.9)';
    ctx.lineWidth = Math.max(1, this.z * 0.6);
    ctx.setLineDash([this.z * 2, this.z * 2]);
    ctx.strokeRect(x0 + 1, y0 + 1, this.X(wx + fw) - x0 - 2, this.Y(wy + fh) - y0 - 2);
    ctx.setLineDash([]);
    // dodaný materiál
    const cost = BUILD[bp.type].cost;
    let tot = 0, del = 0;
    for (const m in cost) { tot += cost[m]; del += Math.min(cost[m], bp.del[m] || 0); }
    if (del < tot) {
      this.rect(wx + 2, wy + TS - 3, 12, 2, 'rgba(0,0,0,0.6)');
      this.rect(wx + 2, wy + TS - 3, 12 * del / tot, 2, '#8fd0ff');
    }
  },

  // ---------- Řádkové vykreslení (správné překrývání stromů, zdí, kolonistů) ----------
  drawRows(tx0, ty0, tx1, ty1) {
    const TS = Config.TILE, W = World.w;
    const byRow = new Map();
    for (const c of Game.colonists) {
      const r = Math.floor(c.y);
      if (!byRow.has(r)) byRow.set(r, []);
      byRow.get(r).push(c);
    }
    const yEnd = Math.min(World.h - 1, ty1 + 2);
    for (let y = ty0; y <= yEnd; y++) {
      for (let x = tx0; x <= tx1; x++) {
        const i = y * W + x, wx = x * TS, wy = y * TS;
        const o = World.obj[i];
        if (o) this.drawObj(o, i, x, y, wx, wy);
        const s = World.struct[i];
        if (s && s.i === i && !(BUILD[s.type].machine && BUILD[s.type].machine.belt)) this.drawStruct(s, i, x, y, wx, wy);
        const bp = World.bp[i];
        if (bp && bp.i === i && BUILD[bp.type].layer === 'struct') this.drawBlueprint(bp, wx, wy);
      }
      for (const a of Animals.list) if (Math.floor(a.y) === y) this.drawAnimal(a);
      const cs = byRow.get(y);
      if (cs) { cs.sort((a, b) => a.y - b.y); for (const c of cs) this.drawColonist(c); }
    }
    // stopy výstřelů
    if (Game.shots.length) {
      const ctx = this.ctx;
      ctx.lineWidth = Math.max(1, this.z * 0.6);
      for (const s of Game.shots) {
        ctx.strokeStyle = s.col || '#fff';
        ctx.globalAlpha = Math.min(1, s.t / 5);
        ctx.beginPath(); ctx.moveTo(this.X(s.x0 * TS), this.Y(s.y0 * TS)); ctx.lineTo(this.X(s.x1 * TS), this.Y(s.y1 * TS)); ctx.stroke();
        s.t--;
      }
      ctx.globalAlpha = 1;
      Game.shots = Game.shots.filter(s => s.t > 0);
    }
    // plameny požárů
    for (const i of Fire.tiles.keys()) {
      const x = i % W, y = (i / W) | 0;
      if (x < tx0 || x > tx1 || y < ty0 || y > ty1) continue;
      this.drawFlame(x * TS + 5, y * TS + 12); this.drawFlame(x * TS + 11, y * TS + 9); this.drawFlame(x * TS + 8, y * TS + 14);
    }
  },

  drawAnimal(a) {
    const TS = Config.TILE, ctx = this.ctx;
    const spr = Sprites.animals[a.type];
    if (!spr) return;
    const wx = a.x * TS, wy = a.y * TS;
    const moving = a.path && a.pathI < a.path.length;
    const f = moving ? Math.floor(a.animT * 4) % 2 : (a.state === 'eat' && Math.sin(this.time * 6) > 0 ? 1 : 0);
    const im = spr[a.dir === 'right' ? 'right' : 'left'][f];
    const w = im.width, h = im.height;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(this.X(wx), this.Y(wy + 4), w * 0.38 * this.z, 1.8 * this.z, 0, 0, Math.PI * 2);
    ctx.fill();
    this.img(im, wx - w / 2, wy + 5 - h, w, h);
    if (a.hunt) this.img(Sprites.icons.hunt, wx - 4, wy - h - 4, 8, 8);
    else if (a.type === 'sheep' && a.prod >= 1) this.rect(wx - 1, wy - h + 2, 2, 2, '#ffd35a');
    if (Game.selected && Game.selected.a === a) {
      ctx.strokeStyle = '#ffe36e'; ctx.lineWidth = Math.max(1.5, this.z * 0.7);
      ctx.beginPath(); ctx.ellipse(this.X(wx), this.Y(wy + 4), (w * 0.5 + 1) * this.z, 3 * this.z, 0, 0, Math.PI * 2); ctx.stroke();
    }
  },

  drawObj(o, i, x, y, wx, wy) {
    const TS = Config.TILE, v = World.variant[i];
    if (o.type === 'tree') {
      const spr = Sprites.trees[v % Sprites.trees.length];
      const sc = o.size;
      const w = 20 * sc, h = 28 * sc;
      // lehké pohupování ve větru
      this.img(spr, wx + 8 - w / 2, wy + TS + 2 - h, w, h);
    } else if (o.type === 'bush') {
      this.img(o.berries ? Sprites.bush : Sprites.bushEmpty, wx, wy, TS, TS);
    } else {
      const arr = o.type === 'ore' ? Sprites.ores : Sprites.rocks;
      this.img(arr[v % arr.length], wx, wy, TS, TS);
      const isRock = (xx, yy) => { if (!World.inb(xx, yy)) return true; const q = World.obj[yy * World.w + xx]; return !!q && (q.type === 'rock' || q.type === 'ore'); };
      if (!isRock(x, y - 1)) { this.rect(wx, wy, TS, 2, 'rgba(200,196,188,0.55)'); }
      if (!isRock(x, y + 1)) { this.rect(wx, wy + TS - 4, TS, 4, 'rgba(40,36,34,0.55)'); this.rect(wx, wy + TS, TS, 3, 'rgba(0,0,0,0.25)'); }
      if (!isRock(x - 1, y)) this.rect(wx, wy, 1.5, TS, 'rgba(60,56,52,0.6)');
      if (!isRock(x + 1, y)) this.rect(wx + TS - 1.5, wy, 1.5, TS, 'rgba(40,36,34,0.6)');
    }
  },

  drawStruct(s, i, x, y, wx, wy) {
    const TS = Config.TILE, def = BUILD[s.type];
    if (def.wall) {
      this.img(Sprites.build[s.type], wx, wy, TS, TS);
      const isWall = (xx, yy) => { if (!World.inb(xx, yy)) return false; const q = World.struct[yy * World.w + xx]; return !!q && (BUILD[q.type].wall || BUILD[q.type].door); };
      if (!isWall(x, y + 1)) { this.rect(wx, wy + TS - 4, TS, 4, 'rgba(0,0,0,0.35)'); this.rect(wx, wy + TS, TS, 3, 'rgba(0,0,0,0.22)'); }
      if (!isWall(x, y - 1)) this.rect(wx, wy, TS, 1.5, 'rgba(255,255,255,0.25)');
      if (!isWall(x - 1, y)) this.rect(wx, wy, 1, TS, 'rgba(0,0,0,0.3)');
      if (!isWall(x + 1, y)) this.rect(wx + TS - 1, wy, 1, TS, 'rgba(0,0,0,0.3)');
    } else if (s.type === 'door') {
      const open = Game.colonists.some(c => Math.abs(c.x - (x + 0.5)) < 1 && Math.abs(c.y - (y + 0.5)) < 1);
      this.img(open ? Sprites.build.door_open : Sprites.build.door, wx, wy, TS, TS);
    } else if (s.type === 'campfire') {
      this.img(Sprites.build.campfire, wx, wy, TS, TS);
      this.drawFlame(wx + 8, wy + 9);
    } else if (def.machine) {
      this.drawMachine(s, def, wx, wy);
    } else {
      this.img(Sprites.build[s.type], wx, wy, TS, TS);
    }
    if (s.decon) this.img(Sprites.des.decon, wx + 4, wy + 4, 8, 8);
  },

  /** Dílny, stroje a zdroje energie: animace chodu, šipka výstupu, stavové ikony. */
  drawMachine(s, def, wx, wy) {
    const m = def.machine, ctx = this.ctx, t = this.time;
    const run = Game.speed > 0;
    const active = run && (s.on || (s.used !== undefined && Game.tickCount - s.used < 6));
    const shake = active && (m.recipe || m.drill) && Math.sin(t * 45) > 0 ? 0.5 : 0;
    this.buildSprite(s.type, wx, wy + shake, s.dir);
    const [fw, fh] = this.sizeOf(s.type, s.dir);
    if (m.gen === 'water') {
      // lopatky kola
      const out = Power.output(s) > 0 && run;
      const a0 = out ? t * 1.6 : 0.3;
      for (let k = 0; k < 8; k++) {
        const a = a0 + k * Math.PI / 4;
        const px = wx + 8 + Math.cos(a) * 6, py = wy + 7 + Math.sin(a) * 6;
        this.rect(px - 1.2, py - 1.2, 2.4, 2.4, k & 1 ? '#b98a56' : '#8a5a30');
        this.rect(wx + 8 + Math.cos(a) * 3 - 0.5, wy + 7 + Math.sin(a) * 3 - 0.5, 1, 1, '#6e4626');
      }
      this.rect(wx + 7, wy + 6, 2, 2, '#3c3e46');
    } else if (m.gen === 'wind') {
      const sp = run ? Power.output(s) / m.supply : 0;
      s.spin = (s.spin || 0) + sp * 0.12;
      const cx = this.X(wx + 16), cy = this.Y(wy + 10), L = 14 * this.z;
      ctx.lineCap = 'butt';
      for (let k = 0; k < 4; k++) {
        const a = s.spin + k * Math.PI / 2;
        ctx.strokeStyle = '#e8dcc0'; ctx.lineWidth = 3.2 * this.z;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 2 * this.z, cy + Math.sin(a) * 2 * this.z); ctx.lineTo(cx + Math.cos(a) * L, cy + Math.sin(a) * L); ctx.stroke();
        ctx.strokeStyle = '#6e4626'; ctx.lineWidth = 0.9 * this.z;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * L, cy + Math.sin(a) * L); ctx.stroke();
      }
      this.rect(wx + 15, wy + 9, 2, 2, '#3c3e46');
    }
    // kouř z komínů
    if (active && (s.type === 'furnace' || s.type === 'autofurnace' || s.type === 'boiler')) {
      const cx = s.type === 'boiler' ? wx + 23 : wx + 8;
      for (let k = 0; k < 4; k++) {
        const p = (t * 0.5 + k / 4) % 1;
        this.rect(cx + Math.sin(k * 3 + t) * 2 + p * 4, wy - 2 - p * 14, 2 + p * 2, 2 + p * 2, `rgba(90,90,96,${0.5 * (1 - p)})`);
      }
    }
    // postup výroby
    if (s.prog > 0 && (m.recipe || m.drill) && (active || s.prog < 1)) {
      this.rect(wx + 2, wy + fh - 3, fw - 4, 2, 'rgba(0,0,0,0.6)');
      this.rect(wx + 2, wy + fh - 3, (fw - 4) * U.clamp(s.prog, 0, 1), 2, '#7ee07e');
    }
    // stavové ikony
    let icon = null, col = '#ff6b5e';
    if (s.broken) icon = '🔧';
    else if (m.power && s.want && !s.on) icon = '⚡';
    else if (m.gen === 'boiler' && !(s.burn > 0) && !(s.inv.wood >= 1)) { icon = '!'; col = '#ffb347'; }
    if (icon && Math.sin(t * 5) > -0.3) {
      ctx.font = `bold ${Math.round(9 * this.z)}px VT323, monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const x = this.X(wx + fw / 2), y = this.Y(wy + fh / 2 - 2);
      ctx.fillStyle = 'rgba(0,0,0,0.75)';
      ctx.fillRect(x - 5 * this.z, y - 5 * this.z, 10 * this.z, 10 * this.z);
      ctx.fillStyle = col;
      ctx.fillText(icon, x, y);
    }
  },

  drawFlame(cx, cy) {
    const t = this.time * 9;
    const cols = ['#ff5a1f', '#ff9a2e', '#ffd257', '#fff3b0'];
    for (let k = 0; k < 7; k++) {
      const off = (k - 3) * 1.1;
      const hgt = 3 + Math.abs(Math.sin(t * 0.7 + k * 1.7)) * 4 * (1 - Math.abs(k - 3) / 4.5);
      this.rect(cx + off - 0.5, cy - hgt, 1.2, hgt, cols[0]);
      this.rect(cx + off * 0.7 - 0.5, cy - hgt * 0.7, 1, hgt * 0.7, cols[1]);
      if (Math.abs(k - 3) < 2) this.rect(cx + off * 0.5 - 0.5, cy - hgt * 0.45, 1, hgt * 0.45, cols[2]);
    }
    this.rect(cx - 0.5, cy - 2, 1, 1.5, cols[3]);
    // jiskry
    for (let k = 0; k < 3; k++) {
      const p = (this.time * 0.8 + k / 3) % 1;
      this.rect(cx + Math.sin(k * 5 + this.time * 3) * 3, cy - 6 - p * 12, 0.8, 0.8, `rgba(255,200,90,${1 - p})`);
    }
  },

  drawColonist(c) {
    const TS = Config.TILE, ctx = this.ctx;
    const wx = c.x * TS, wy = c.y * TS;
    const sel = Game.selected && Game.selected.c === c;
    // stín
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(this.X(wx), this.Y(wy + 4), 5 * this.z, 2 * this.z, 0, 0, Math.PI * 2);
    ctx.fill();
    if (sel) {
      ctx.strokeStyle = '#ffe36e';
      ctx.lineWidth = Math.max(1.5, this.z * 0.7);
      ctx.beginPath();
      ctx.ellipse(this.X(wx), this.Y(wy + 4), 7 * this.z, 3.2 * this.z, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (c.sleeping) {
      const x0 = this.X(wx), y0 = this.Y(wy + 1);
      ctx.save();
      ctx.translate(x0, y0);
      ctx.rotate(-Math.PI / 2);
      const s = Math.round(16 * this.z);
      ctx.drawImage(c.sprites.down[0], -s / 2, -s / 2, s, s);
      ctx.restore();
      // blanket na posteli
      const i = World.idx(c.tx, c.ty);
      if (World.struct[i] && World.struct[i].type === 'bed') this.rect(c.tx * TS + 2, c.ty * TS + 7, 12, 8, 'rgba(62,98,168,0.95)');
      const p = (this.time * 0.6) % 1;
      ctx.fillStyle = `rgba(255,255,255,${1 - p})`;
      ctx.font = `${Math.round(5 * this.z)}px VT323, monospace`;
      ctx.textAlign = 'left';
      ctx.fillText('z', this.X(wx + 3 + p * 4), this.Y(wy - 6 - p * 8));
      ctx.fillText('Z', this.X(wx + 6 + p * 5), this.Y(wy - 11 - p * 9));
      return;
    }
    let frame = 0, bob = 0;
    if (c.moving) { frame = 1 + (Math.floor(c.animT * 3.2) % 2); bob = frame === 1 ? -0.5 : 0; }
    const working = c.working && !c.moving;
    if (working) bob = Math.sin(this.time * 14) > 0 ? -0.6 : 0;
    this.img(c.sprites[c.dir][frame], wx - 8, wy - 12 + bob, 16, 16);
    if (working) {
      const sw = Math.sin(this.time * 14);
      const hx = c.dir === 'left' ? wx - 7 : c.dir === 'right' ? wx + 4 : wx + 3;
      this.rect(hx, wy - 5 - sw * 2, 1.2, 4, '#8a5a30');
      this.rect(hx - 1, wy - 6 - sw * 2, 3, 1.5, '#c9ccd4');
    }
    if (c.carry) this.img(Sprites.items[c.carry.type], wx - 4, wy - 17, 8, 8);
    if (c.workFrac >= 0 && (c.working || c.eating)) {
      this.rect(wx - 7, wy - 16 - (c.carry ? 6 : 0), 14, 2.2, 'rgba(0,0,0,0.65)');
      this.rect(wx - 6.5, wy - 15.6 - (c.carry ? 6 : 0), 13 * U.clamp(c.workFrac, 0, 1), 1.4, c.eating ? '#ffb347' : '#7ee07e');
    }
    if (c.inBreak()) {
      ctx.fillStyle = '#ff6060';
      ctx.font = `bold ${Math.round(7 * this.z)}px VT323, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('!', this.X(wx), this.Y(wy - 15));
    }
  },

  // ---------- Označení, výběr ----------
  drawOverlays(tx0, ty0, tx1, ty1) {
    const TS = Config.TILE;
    for (const i of World.desSet) {
      const x = i % World.w, y = (i / World.w) | 0;
      if (x < tx0 || x > tx1 || y < ty0 || y > ty1) continue;
      const o = World.obj[i];
      if (!o || !o.des) continue;
      const wx = x * TS, wy = y * TS;
      if (o.des === 'harvest' && !o.berries) { this.ctx.globalAlpha = 0.4; }
      this.rect(wx + 4, wy + 4, 8, 8, 'rgba(0,0,0,0.35)');
      this.img(Sprites.des[o.des], wx + 3.5, wy + 3.5, 9, 9);
      this.ctx.globalAlpha = 1;
    }
    for (const i of World.deconSet) {
      const x = i % World.w, y = (i / World.w) | 0;
      if (World.floor[i] && World.floor[i].decon && !World.struct[i]) this.img(Sprites.des.decon, x * TS + 4, y * TS + 4, 8, 8);
    }
    const s = Game.selected;
    if (s && s.type === 'tile') {
      const ctx = this.ctx, x0 = this.X(s.x * TS), y0 = this.Y(s.y * TS);
      ctx.strokeStyle = '#ffe36e';
      ctx.lineWidth = Math.max(2, this.z * 0.8);
      ctx.strokeRect(x0, y0, this.X((s.x + 1) * TS) - x0, this.Y((s.y + 1) * TS) - y0);
    }
  },

  // ---------- Náhled tažení nástroje ----------
  drawPreview() {
    const tool = Game.tool;
    if (tool === 'select') return;
    const d = Tools.defs[tool];
    let tiles = null;
    // tažený výběr, nebo výběr čekající na potvrzení
    const sel = Input.drag || (Game.pending && Game.pending.tool === tool ? Game.pending : null);
    if (sel) tiles = Tools.tilesFor(tool, sel.x0, sel.y0, sel.x1, sel.y1);
    else if (Input.hover && World.inb(Input.hover.x, Input.hover.y)) tiles = [World.idx(Input.hover.x, Input.hover.y)];
    if (!tiles) return;
    const TS = Config.TILE, ctx = this.ctx;
    let ok = 0;
    const dir = sel ? (sel.dir !== undefined ? sel.dir : Tools.dirFor(tool, sel.x0, sel.y0, sel.x1, sel.y1)) : Game.buildDir;
    for (const i of tiles) {
      const x = i % World.w, y = (i / World.w) | 0, wx = x * TS, wy = y * TS;
      const valid = d.valid(i, dir);
      if (valid) ok++;
      let fw = TS, fh = TS;
      if (d.build) {
        [fw, fh] = this.sizeOf(d.build, dir);
        if (valid) {
          ctx.globalAlpha = 0.6;
          this.buildSprite(d.build, wx, wy, dir);
          ctx.globalAlpha = 1;
        }
      }
      this.rect(wx, wy, fw, fh, valid ? 'rgba(120,230,140,0.30)' : 'rgba(255,80,80,0.25)');
    }
    if (sel) {
      const dr = sel;
      const ax = Math.min(dr.x0, dr.x1), ay = Math.min(dr.y0, dr.y1), bx = Math.max(dr.x0, dr.x1), by = Math.max(dr.y0, dr.y1);
      const x0 = this.X(ax * TS), y0 = this.Y(ay * TS);
      ctx.strokeStyle = Input.drag ? 'rgba(255,255,255,0.85)' : '#ffd35a';
      ctx.lineWidth = 2 * this.dpr;
      ctx.strokeRect(x0, y0, this.X((bx + 1) * TS) - x0, this.Y((by + 1) * TS) - y0);
      const label = `${bx - ax + 1}×${by - ay + 1}  ✔ ${ok}` + (d.build ? `  (${Tools.costText(tool, ok)})` : '');
      ctx.font = `${Math.round(18 * this.dpr)}px VT323, monospace`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(20,16,12,0.85)';
      ctx.fillRect(x0, y0 - 22 * this.dpr, tw + 10 * this.dpr, 20 * this.dpr);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, x0 + 5 * this.dpr, y0 - 4 * this.dpr);
    }
  },

  // ---------- Stíny mraků ----------
  drawClouds() {
    const a = Weather.cloud * 0.16;
    if (a < 0.01) return;
    const ctx = this.ctx, mw = World.w * 16, mh = World.h * 16;
    for (const c of this.clouds) {
      c.x += Weather.wind * c.s * 0.25 * Game.speed;
      c.y += 0.05 * c.s * Game.speed;
      if (c.x > mw + c.r) c.x = -c.r; if (c.x < -c.r) c.x = mw + c.r;
      if (c.y > mh + c.r) c.y = -c.r;
      const x = this.X(c.x), y = this.Y(c.y), r = c.r * this.z;
      if (x + r < 0 || y + r < 0 || x - r > this.cv.width || y - r > this.cv.height) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(10,14,30,${a})`);
      g.addColorStop(1, 'rgba(10,14,30,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  },

  // ---------- Den a noc ----------
  lightSources() {
    const out = [];
    for (const i of World.lights) {
      const s = World.struct[i];
      const def = s && BUILD[s.type];
      if (def && def.light) out.push({ x: (i % World.w) + 0.5, y: ((i / World.w) | 0) + 0.5, r: def.light, fire: s.type === 'campfire' });
    }
    for (const i of Fire.tiles.keys()) out.push({ x: (i % World.w) + 0.5, y: ((i / World.w) | 0) + 0.5, r: 4.5, fire: true });
    return out;
  },
  drawLighting() {
    const ctx = this.ctx, W = this.cv.width, Hh = this.cv.height;
    const day = TimeSys.daylight();
    const dark = U.clamp((1 - day) * 0.87 + Weather.cloud * 0.1 + Weather.rain * 0.08, 0, 0.88);
    const dusk = TimeSys.dusk();
    if (dusk > 0.01) {
      ctx.fillStyle = `rgba(255,120,40,${0.13 * dusk})`;
      ctx.fillRect(0, 0, W, Hh);
    }
    if (dark < 0.02) return;
    const L = this.lctx, lw = this.light.width, lh = this.light.height, k = lw / W;
    L.globalCompositeOperation = 'source-over';
    L.clearRect(0, 0, lw, lh);
    L.fillStyle = `rgba(6,10,32,${dark})`;
    L.fillRect(0, 0, lw, lh);
    L.globalCompositeOperation = 'destination-out';
    const TS = Config.TILE;
    const lights = this.lightSources();
    for (const l of lights) {
      const flick = l.fire ? 1 + Math.sin(this.time * 7 + l.x) * 0.04 + Math.sin(this.time * 13) * 0.03 : 1;
      const x = this.X(l.x * TS) * k, y = this.Y(l.y * TS) * k, r = l.r * TS * this.z * k * flick;
      const g = L.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.5, 'rgba(0,0,0,0.75)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      L.fillStyle = g;
      L.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (const c of Game.colonists) {
      const x = this.X(c.x * TS) * k, y = this.Y(c.y * TS) * k, r = 2.2 * TS * this.z * k;
      const g = L.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,0.45)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      L.fillStyle = g;
      L.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.light, 0, 0, W, Hh);
    ctx.imageSmoothingEnabled = false;
    // teplá záře ohně
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lights) {
      const x = this.X(l.x * TS), y = this.Y(l.y * TS), r = l.r * 0.8 * TS * this.z;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const a = (l.fire ? 0.28 : 0.18) * dark;
      g.addColorStop(0, l.fire ? `rgba(255,150,50,${a})` : `rgba(255,220,140,${a})`);
      g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  },

  // ---------- Počasí ----------
  drawWeather(dt) {
    const ctx = this.ctx, W = this.cv.width, Hh = this.cv.height;
    const simDt = dt * Math.max(Game.speed, 0.05);
    const want = Math.floor(Weather.rain * (W * Hh) / (this.dpr * this.dpr) / 2600);
    while (this.rain.length < want) this.rain.push(this.newDrop(true));
    if (this.rain.length > want) this.rain.length = want;
    const snowing = TimeSys.temp() < 0;
    if (this.rain.length && snowing) {
      // sníh: pomalé bílé vločky
      ctx.fillStyle = 'rgba(245,248,255,0.85)';
      const sz = Math.max(2, 2 * this.dpr);
      for (const d of this.rain) {
        d.y += d.v * 0.16 * simDt * this.dpr;
        d.x += (Weather.wind * 60 + Math.sin(d.y * 0.02 + d.l) * 20) * simDt * this.dpr;
        if (d.y > this.cv.height + 10) { Object.assign(d, this.newDrop(false)); }
        ctx.fillRect(d.x, d.y, sz, sz);
      }
    } else if (this.rain.length) {
      const wind = Weather.wind * 0.35;
      ctx.strokeStyle = 'rgba(180,200,240,0.5)';
      ctx.lineWidth = Math.max(1, this.dpr);
      ctx.beginPath();
      for (const d of this.rain) {
        d.y += d.v * simDt * this.dpr;
        d.x += d.v * wind * simDt * this.dpr;
        if (d.y > d.end) {
          if (this.splash.length < 200) this.splash.push({ x: d.x, y: d.y, t: 0 });
          Object.assign(d, this.newDrop(false));
        }
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - d.l * wind, d.y - d.l);
      }
      ctx.stroke();
    }
    if (this.splash.length) {
      ctx.fillStyle = 'rgba(200,220,255,0.55)';
      for (const s of this.splash) {
        s.t += simDt * 6;
        const r = s.t * 3 * this.dpr;
        ctx.fillRect(s.x - r, s.y, 1 * this.dpr, 1 * this.dpr);
        ctx.fillRect(s.x + r, s.y, 1 * this.dpr, 1 * this.dpr);
      }
      this.splash = this.splash.filter(s => s.t < 1);
    }
    if (Weather.rain > 0.05) {
      ctx.fillStyle = `rgba(60,70,90,${Weather.rain * 0.12})`;
      ctx.fillRect(0, 0, W, Hh);
    }
    if (Weather.fog > 0.02) {
      ctx.fillStyle = `rgba(200,206,214,${Weather.fog * 0.28})`;
      ctx.fillRect(0, 0, W, Hh);
      for (let k = 0; k < 5; k++) {
        const x = ((this.time * 12 * (k + 1) + k * 400) % (W + 800)) - 400, y = (Hh / 5) * k + Hh / 10;
        const r = 380 * this.dpr;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(220,226,232,${Weather.fog * 0.25})`);
        g.addColorStop(1, 'rgba(220,226,232,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }
    if (Weather.flash > 0) {
      ctx.fillStyle = `rgba(235,240,255,${Weather.flash * 0.55})`;
      ctx.fillRect(0, 0, W, Hh);
    }
  },
  newDrop(anyY) {
    const W = this.cv.width, Hh = this.cv.height;
    const y = anyY ? Math.random() * Hh : -20;
    const R = Math.random;   // vykreslování nesmí spotřebovávat herní náhodu
    return { x: R() * (W + 200) - 100, y, v: 700 + R() * 300, l: (8 + R() * 6) * this.dpr, end: y + 80 + R() * (Hh - 80) };
  },

  // ---------- Jmenovky ----------
  drawLabels() {
    const ctx = this.ctx, TS = Config.TILE;
    const show = Camera.zoom >= 1.7;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `${Math.round(15 * this.dpr)}px VT323, monospace`;
    for (const c of Game.colonists) {
      const sel = Game.selected && Game.selected.c === c;
      if (!show && !sel) continue;
      const x = this.X(c.x * TS), y = this.Y(c.y * TS + 5);
      const t = c.first;
      const w = ctx.measureText(t).width + 8 * this.dpr;
      ctx.fillStyle = sel ? 'rgba(80,60,10,0.85)' : 'rgba(15,12,10,0.65)';
      ctx.fillRect(x - w / 2, y, w, 15 * this.dpr);
      ctx.fillStyle = sel ? '#ffe36e' : '#f0e8d8';
      ctx.fillText(t, x, y + 1 * this.dpr);
    }
  },
};

</script>
  <script>
// ===== js/ui.js =====
'use strict';
/**
 * UI – DOM rozhraní: horní lišta (čas, počasí, zásoby, rychlost), panel kolonistů,
 * informační panel, spodní dotykové menu nástrojů, okno priorit a notifikace.
 */
const UI = {
  TABS: [
    { id: 'orders', label: 'Příkazy', icon: 'chop', tools: ['select', 'chop', 'mine', 'harvest', 'hunt', 'decon', 'cancel'] },
    { id: 'build', label: 'Stavba', icon: 'wall_wood', tools: ['wall_wood', 'wall_stone', 'door', 'floor_wood', 'floor_stone', 'bed', 'campfire', 'table', 'chair', 'chest', 'lamp'] },
    { id: 'prod', label: 'Výroba', icon: 'belt', tools: ['saw', 'furnace', 'tailor', 'research', 'belt', 'drill', 'autosaw', 'autofurnace', 'pole', 'waterwheel', 'windmill', 'boiler'],
      actions: [{ icon: 'research_btn', label: 'Výzkum', run: () => UI.openResearch() }, { icon: 'power_btn', label: 'Energie', run: () => UI.openPower() }] },
    { id: 'zones', label: 'Zóny', icon: 'zone_farm', tools: ['zone_stock', 'zone_farm', 'zone_pasture', 'coop', 'sheepfold', 'zone_clear'] },
    { id: 'work', label: 'Práce', icon: 'priorities', action: () => UI.openPriorities() },
    { id: 'menu', label: 'Menu', icon: 'menu', action: () => UI.openMenu() },
  ],
  tab: 'orders',
  icons: {},
  toastQ: [],

  $(id) { return document.getElementById(id); },
  el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  },
  icon(name) {
    if (!this.icons[name]) {
      const src = Sprites.icons[name] || Sprites.items[name] || Sprites.build[name];
      this.icons[name] = src ? Sprites.toURL(src, 3) : '';
    }
    return this.icons[name];
  },
  imgTag(name, cls = 'pix') { return `<img class="${cls}" src="${this.icon(name)}" alt="">`; },

  init() {
    // zásoby
    const res = this.$('resources');
    res.innerHTML = '';
    for (const k of ITEM_ORDER) {
      const chip = this.el('div', 'res', `${this.imgTag(k)}<span id="res-${k}">0</span>`);
      chip.title = ITEMS[k].name;
      if (!ITEM_BASIC.includes(k)) chip.classList.add('hidden');
      res.appendChild(chip);
    }
    const pw = this.el('div', 'res hidden', `${this.imgTag('power_btn')}<span id="res-power">0/0</span>`);
    pw.title = 'Energie: výroba / spotřeba';
    pw.onclick = () => this.openPower();
    res.appendChild(pw);
    const rs = this.el('div', 'res hidden', `${this.imgTag('research_btn')}<span id="res-research">0%</span>`);
    rs.title = 'Probíhající výzkum';
    rs.onclick = () => this.openResearch();
    res.appendChild(rs);
    // rychlost
    const sp = this.$('speed');
    sp.innerHTML = '';
    Config.SPEEDS.forEach((s) => {
      const b = this.el('button', 'spd', s === 0 ? '❚❚' : s + '×');
      b.title = s === 0 ? 'Pauza (mezerník)' : `Rychlost ${s}× (klávesa ${s})`;
      b.dataset.speed = s;
      b.onclick = () => Game.setSpeed(s);
      sp.appendChild(b);
    });
    this.buildColonistBar();
    this.buildTabs();
    this.setTab('orders');
    this.updateSpeed();
    this.$('hintClose').onclick = () => this.setTool('select');
    this.$('rotBtn').onclick = () => Game.rotate();
    this.$('confirmOk').onclick = () => Game.confirmPending();
    this.$('confirmNo').onclick = () => Game.setPending(null);
    this.$('undoBtn').onclick = () => Tools.undo();
    this.$('importFile').onchange = (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (f) Save.importFile(f, d => Main.boot(d), msg => this.toast(msg, 'warn'));
    };
    this.ready = true;
    this.updateUndo();
    this.update();
  },

  /** Po načtení jiné hry / nové kolonii obnovit části rozhraní závislé na stavu. */
  reset() {
    this.buildColonistBar();
    this.setTool('select');
    this.updateSpeed();
    this.updateUndo();
    this.updateInfo(true);
    this.update();
  },

  // ---------- Spodní menu ----------
  buildTabs() {
    const row = this.$('tabRow');
    row.innerHTML = '';
    for (const t of this.TABS) {
      const b = this.el('button', 'tab', `${this.imgTag(t.icon)}<span>${t.label}</span>`);
      b.dataset.tab = t.id;
      b.onclick = () => t.action ? t.action() : this.setTab(t.id);
      row.appendChild(b);
    }
  },
  setTab(id) {
    this.tab = id;
    for (const b of this.$('tabRow').children) b.classList.toggle('active', b.dataset.tab === id);
    const tab = this.TABS.find(t => t.id === id);
    const row = this.$('toolRow');
    row.innerHTML = '';
    for (const a of tab.actions || []) {
      const b = this.el('button', 'tool act', `${this.imgTag(a.icon)}<span class="tname">${a.label}</span>`);
      b.onclick = a.run;
      row.appendChild(b);
    }
    for (const tool of tab.tools) {
      const d = Tools.defs[tool];
      const locked = d.tech && !Research.has(d.tech);
      const cost = Tools.costText(tool);
      const b = this.el('button', 'tool' + (locked ? ' locked' : ''), `${this.imgTag(tool)}<span class="tname">${d.name}</span>` +
        (locked ? `<span class="tcost">🔒 ${TECHS[d.tech].name}</span>` : cost ? `<span class="tcost">${cost}</span>` : ''));
      b.dataset.tool = tool;
      b.onclick = () => {
        if (d.tech && !Research.has(d.tech)) { this.toast(`${d.name}: nejdřív vyzkoumej „${TECHS[d.tech].name}“ (Výroba → Výzkum).`, 'warn'); return; }
        this.setTool(Game.tool === tool && tool !== 'select' ? 'select' : tool);
      };
      row.appendChild(b);
    }
    this.markTool();
  },
  setTool(tool) {
    Game.tool = tool;
    Game.pending = null;
    Input.drag = null;
    this.markTool();
    if (tool !== 'select') {
      const d = Tools.defs[tool];
      this.$('hintText').innerHTML = `<b>${d.name}</b> – ${d.hint || ''}` + (d.build ? ` <i>Cena: ${Tools.costText(tool)}</i>` : '');
    }
    this.updateRotate();
    this.updateConfirm();
  },
  /** Tlačítko otočení stavby v nápovědě nástroje. */
  updateRotate() {
    const d = Tools.defs[Game.tool], b = this.$('rotBtn');
    b.classList.toggle('hidden', !(d && d.rot));
    b.textContent = '⟳ ' + ['→', '↓', '←', '↑'][Game.buildDir];
  },

  /** Lišta s potvrzením výběru (dotyk): náhled, počet políček, cena, Potvrdit / Zrušit. */
  updateConfirm() {
    const p = Game.pending;
    this.$('confirmBar').classList.toggle('hidden', !p);
    this.$('toolHint').classList.toggle('hidden', !!p || Game.tool === 'select');
    if (!p) return;
    const d = Tools.defs[p.tool];
    const n = Tools.countValid(p.tool, Tools.tilesFor(p.tool, p.x0, p.y0, p.x1, p.y1), p.dir);
    let t = `<b>${d.name}</b> `;
    if (n === 0) t += '– tady není co provést.';
    else {
      t += `×${n}`;
      if (d.build) {
        const lack = Tools.lacking(p.tool, n);
        t += ` · <i>${Tools.costText(p.tool, n)}</i>` + (lack.length ? ` <em>chybí ${lack.join(', ')}</em>` : '');
      }
    }
    this.$('confirmText').innerHTML = t;
    this.$('confirmOk').disabled = n === 0;
  },
  updateUndo() {
    const st = Tools.undoStack, b = this.$('undoBtn');
    b.classList.toggle('hidden', st.length === 0);
    if (st.length) b.title = `Vrátit: ${st[st.length - 1].name} ×${st[st.length - 1].n}`;
  },
  markTool() {
    for (const b of this.$('toolRow').children) b.classList.toggle('active', b.dataset.tool === Game.tool);
  },

  updateSpeed() {
    for (const b of this.$('speed').children) b.classList.toggle('active', +b.dataset.speed === Game.speed);
    document.body.classList.toggle('paused', Game.speed === 0);
  },

  // ---------- Kolonisté ----------
  buildColonistBar() {
    const bar = this.$('colonistBar');
    bar.innerHTML = '';
    for (const c of Game.colonists) {
      const card = this.el('div', 'ccard');
      card.innerHTML = `<img class="pix portrait" src="${Sprites.toURL(c.portrait, 4)}" alt="">
        <div class="cinfo"><div class="cname">${c.first}</div>
        <div class="mini"><i class="b-health"></i></div><div class="mini"><i class="b-food"></i></div><div class="mini"><i class="b-energy"></i></div><div class="mini"><i class="b-mood"></i></div></div>`;
      card.onclick = () => {
        if (Game.selected && Game.selected.c === c) Camera.follow = Camera.follow === c ? null : c;
        Game.select({ type: 'colonist', c });
        Camera.centerOn(c.x * Config.TILE, c.y * Config.TILE);
      };
      c.card = card;
      bar.appendChild(card);
    }
  },
  updateColonistBar() {
    for (const c of Game.colonists) {
      const card = c.card;
      if (!card) continue;
      card.querySelector('.b-health').style.width = c.health + '%';
      card.querySelector('.b-food').style.width = c.hunger + '%';
      card.querySelector('.b-energy').style.width = c.energy + '%';
      const m = card.querySelector('.b-mood');
      m.style.width = c.mood + '%';
      m.style.background = this.moodColor(c.mood);
      card.classList.toggle('sel', !!(Game.selected && Game.selected.c === c));
      card.classList.toggle('alert', c.hunger < 15 || c.energy < 10 || c.health < 50 || c.inBreak());
      card.title = `${c.name} – ${c.activity}`;
    }
  },
  moodColor(m) { return m < 25 ? '#e5534b' : m < 45 ? '#e3a23b' : m < 70 ? '#cfd65a' : '#6fd36f'; },
  moodLabel(m) { return m < 15 ? 'Na pokraji zhroucení' : m < 30 ? 'Nešťastný/á' : m < 45 ? 'Ve stresu' : m < 60 ? 'V pohodě' : m < 80 ? 'Spokojený/á' : 'Šťastný/á'; },

  // ---------- Informační panel ----------
  updateInfo(force) {
    const p = this.$('infoPanel');
    const s = Game.selected;
    if (!s) { p.classList.add('hidden'); return; }
    p.classList.remove('hidden');
    if (s.type === 'colonist') this.colonistInfo(p, s.c, force);
    else if (s.type === 'animal') this.animalInfo(p, s.a);
    else this.tileInfo(p, s.x, s.y);
  },
  bar(label, val, color) {
    return `<div class="stat"><span>${label}</span><div class="bar"><i style="width:${U.clamp(val, 0, 100)}%;background:${color}"></i></div><b>${Math.round(val)}</b></div>`;
  },
  colonistInfo(p, c, force) {
    p.onpointerdown = null;
    if (force || p.dataset.kind !== 'c' + c.id) {
      p.dataset.kind = 'c' + c.id;
      p.innerHTML = `<div class="phead"><img class="pix portrait" src="${Sprites.toURL(c.portrait, 4)}" alt="">
        <div><div class="ptitle">${c.name}</div><div class="psub">${c.age} let · ${c.trait.name} <small>(${c.trait.desc})</small></div></div>
        <button class="x" id="infoClose">✕</button></div>
        <div class="pact" id="pAct"></div>
        <div id="pNeeds"></div>
        <div class="psec">Dovednosti</div><div id="pSkills"></div>
        <div class="psec">Nálada – vlivy</div><div id="pThoughts" class="thoughts"></div>
        <div class="pbtns"><button id="pFollow">Sledovat</button><button id="pPrio">Priority práce</button></div>`;
      this.$('infoClose').onclick = () => Game.select(null);
      this.$('pFollow').onclick = () => { Camera.follow = Camera.follow === c ? null : c; };
      this.$('pPrio').onclick = () => this.openPriorities();
    }
    this.$('pAct').textContent = (c.carry ? `[${ITEMS[c.carry.type].name} ×${c.carry.n}] ` : '') + c.activity + (c.coat || c.bow ? ' · výbava: ' + [c.coat && 'oblečení', c.bow && 'kuše'].filter(Boolean).join(', ') : '');
    this.$('pFollow').textContent = Camera.follow === c ? 'Nesledovat' : 'Sledovat';
    this.$('pNeeds').innerHTML =
      this.bar('Zdraví', c.health, c.health < 40 ? '#e5534b' : '#d9534f') +
      this.bar('Sytost', c.hunger, '#e3a23b') +
      this.bar('Energie', c.energy, '#58a6ff') +
      (c.warmth < 99 ? this.bar('Teplo', c.warmth, '#ff8a4c') : '') +
      this.bar('Nálada', c.mood, this.moodColor(c.mood)) +
      `<div class="moodl">${this.moodLabel(c.mood)}</div>`;
    let sk = '';
    for (const k in SKILLS) {
      const s = c.skills[k];
      const pct = s.xp / c.xpNeed(s.lvl) * 100;
      sk += `<div class="skill"><span>${SKILLS[k]}</span><div class="sbar"><i style="width:${s.lvl / 20 * 100}%"></i><u style="width:${pct}%"></u></div><b>${s.lvl}</b></div>`;
    }
    this.$('pSkills').innerHTML = sk;
    this.$('pThoughts').innerHTML = c.moodFactors().map(f =>
      `<div class="th ${f.val >= 0 ? 'pos' : 'neg'}"><span>${f.label}</span><b>${f.val > 0 ? '+' : ''}${f.val}</b></div>`).join('');
  },
  animalInfo(p, a) {
    if (a.gone) { Game.select(null); return; }
    const d = a.def, key = 'a' + a.id + ':' + a.hunt + ':' + (Game.tickCount / 30 | 0);
    if (p.dataset.kind === key) return;
    p.dataset.kind = key;
    const rows = [['Druh', d.wild ? 'divoká zvěř' : 'hospodářské zvíře'], ['Zdraví', `${Math.max(0, Math.round(a.hp))} / ${d.hp}`], ['Dá', `${d.meat} masa` + (d.leather ? `, ${d.leather} kůže` : '')]];
    if (d.eggHours) rows.push(['Snáška', Math.round(a.prod * 100) + ' %']);
    if (d.woolHours) rows.push(['Vlna', a.prod >= 1 ? 'připravena ke stříhání' : Math.round(a.prod * 100) + ' %']);
    if (!d.wild) rows.push(['Pastvina', a.home < 0 ? 'bez domova' : `${Animals.pastureTiles(a.home)} políček pro ${Animals.herd(a.home).length} ks` + (TimeSys.season === 3 ? ' – v zimě je produkce poloviční' : Animals.feed(a.home) < 1 ? ' – málo, produkce je nižší' : '')]);
    p.innerHTML = `<div class="phead"><div><div class="ptitle">${d.name}</div></div><button class="x" id="infoClose">✕</button></div>
      <table class="ttab">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
      <div class="pbtns"><button data-act="hunt">${a.hunt ? 'Zrušit ' + (d.wild ? 'lov' : 'porážku') : (d.wild ? 'Ulovit' : 'Porazit')}</button></div>`;
    this.$('infoClose').onclick = () => Game.select(null);
    p.onpointerdown = (e) => {
      if (e.target.closest && e.target.closest('[data-act="hunt"]')) { a.hunt = !a.hunt; p.dataset.kind = ''; this.animalInfo(p, a); }
    };
  },
  tileInfo(p, x, y) {
    // panel s filtrem se nepřekresluje při každé aktualizaci (klepnutí by se ztrácela)
    const mach = World.struct[World.idx(x, y)] && BUILD[World.struct[World.idx(x, y)].type].machine;
    const key = 't' + x + ',' + y + ':' + World.itemVer + ':' + (mach ? Game.tickCount / 20 | 0 : TimeSys.minutes / 30 | 0);
    if (p.dataset.kind === key) return;
    p.dataset.kind = key;
    const i = World.idx(x, y);
    const ter = TERRAIN[World.terrain[i]];
    const rows = [];
    rows.push(['Terén', ter.name]);
    if (ter.fert > 0) rows.push(['Úrodnost', Math.round(ter.fert * 100) + ' %']);
    const o = World.obj[i];
    if (o) {
      let t = OBJECTS[o.type].name;
      if (o.type === 'bush') t += o.berries ? ' (zralé bobule)' : ' (dorůstá)';
      if (o.type === 'tree') t += ` (${Math.round(o.size * 100)} %)`;
      if (o.des) t += ' – ' + { chop: 'ke kácení', mine: 'k těžbě', harvest: 'ke sběru' }[o.des];
      rows.push(['Objekt', t]);
    }
    const st = World.struct[i];
    if (st) rows.push(['Stavba', BUILD[st.type].name + (st.decon ? ' (k bourání)' : '')]);
    let machineHtml = '';
    if (st && BUILD[st.type].machine) {
      const m = BUILD[st.type].machine;
      const list = (o) => Object.keys(o || {}).filter(k => o[k] >= 1).map(k => `${ITEMS[k].name} ${Math.floor(o[k])}`).join(', ') || '–';
      rows.push(['Stav', Machines.status(st) || '–']);
      if (m.recipe) {
        rows.push(['Recept', Object.keys(m.recipe.in).map(k => `${m.recipe.in[k]} ${ITEMS[k].name.toLowerCase()}`).join(' + ') + ' → ' + Object.keys(m.recipe.out).map(k => `${m.recipe.out[k]} ${ITEMS[k].name.toLowerCase()}`).join(', ')]);
        rows.push(['Zásobník', list(st.inv)]);
      }
      if (m.fuel) rows.push(['Palivo', list(st.inv) + (st.burn > 0 ? ` (hoří ještě ${Math.ceil(st.burn)} min)` : '')]);
      if (m.recipe || m.drill) rows.push(['Výstup', list(st.out)]);
      if (m.drill && World.obj[st.i]) rows.push(['Ložisko', `zbývá ${World.obj[st.i].amount} ks rudy`]);
      const net = Power.netOf.get(st.i);
      if (m.power) rows.push(['Energie', net ? `odběr ${m.power} ⚡, síť ${net.supply}/${net.demand} ⚡` : `potřebuje ${m.power} ⚡ – není v dosahu zdroje ani sloupu`]);
      else if (m.gen || m.pole) rows.push(['Síť', net ? `výroba ${net.supply} ⚡, spotřeba ${net.demand} ⚡, strojů ${net.users.length}` : '–']);
      if (m.manual && m.recipe) {
        const outType = Object.keys(m.recipe.out)[0];
        machineHtml = `<div class="psec">Vyrábět, dokud je ve skladu méně než</div>
          <div class="target"><button data-act="t-10">−10</button><b>${st.target} × ${ITEMS[outType].name.toLowerCase()}</b><button data-act="t10">+10</button></div>
          <div class="mnote">Teď máš ${World.counts[outType]}. Kolonisté s prací Řemeslo sem sami nosí suroviny.</div>`;
      }
    }
    if (World.floor[i]) rows.push(['Podlaha', BUILD[World.floor[i].type].name]);
    const bp = World.bp[i];
    if (bp) {
      const cost = BUILD[bp.type].cost;
      rows.push(['Plán', BUILD[bp.type].name]);
      rows.push(['Materiál', Object.keys(cost).map(m => `${ITEMS[m].name} ${bp.del[m] || 0}/${cost[m]}`).join(', ')]);
    }
    const cr = World.crops[i];
    if (cr) rows.push(['Brambory', cr.g >= 1 ? 'zralé ke sklizni' : `roste ${Math.round(cr.g * 100)} %`]);
    const it = World.items[i];
    if (it) {
      const fr = World.freshness(i);
      rows.push(['Předmět', `${ITEMS[it.type].name} ×${it.n}` + (fr >= 0 ? ` – čerstvost ${Math.round(fr * 100)} %` : '')]);
    }
    if (World.zone[i]) rows.push(['Zóna', ['', 'Sklad', 'Pole', 'Pastvina'][World.zone[i]]]);
    const room = World.roomAt(i);
    if (room) rows.push(['Místnost', `pod střechou, ${room.tiles.length} políček` + (room.beds.length === 1 ? ', ložnice' : '') + (room.heat ? ', vytápěná' : '')]);
    else if (World.isRoofed(i)) rows.push(['Střecha', 'ano']);
    rows.push(['Teplota', Math.round(World.tempAt(i)) + ' °C']);
    if (Fire.burning(i)) rows.push(['Požár', 'hoří!']);
    // filtr skladu / truhly
    let filterHtml = '';
    if (World.isStock(i)) {
      const f = World.filter[i];
      filterHtml = `<div class="psec">Co se sem smí ukládat</div><div class="filters">` + ITEM_KEYS.map(k =>
        `<button class="fbtn ${World.allowed(i, k) ? 'on' : ''}" data-k="${k}">${this.imgTag(k)}<span>${ITEMS[k].name}</span></button>`).join('') +
        `</div><div class="pbtns"><button id="fAll">Vše</button><button id="fNone">Nic</button></div>
        <div class="mnote">${World.isChest(i) ? 'Platí pro tuto truhlu.' : 'Platí pro celý souvislý sklad.'} Co sem nepatří, kolonisté odnesou jinam.</div>`;
    }
    p.innerHTML = `<div class="phead"><div><div class="ptitle">${World.isChest(i) ? 'Truhla' : st && BUILD[st.type].machine ? BUILD[st.type].name : World.zone[i] === 1 ? 'Sklad' : 'Políčko'} ${x}, ${y}</div></div><button class="x" id="infoClose">✕</button></div>
      <table class="ttab">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>${machineHtml}${filterHtml}`;
    this.$('infoClose').onclick = () => Game.select(null);
    // reaguje už na stisk – panel se průběžně překresluje a klepnutí by se mohlo ztratit
    p.onpointerdown = (e) => {
      const act = e.target.closest && e.target.closest('[data-act]');
      if (!act) return;
      const cur = World.struct[i];
      if (cur && cur.target !== undefined) {
        cur.target = U.clamp(cur.target + (act.dataset.act === 't10' ? 10 : -10), 0, 500);
        p.dataset.kind = '';
        this.tileInfo(p, x, y);
      }
    };
    if (filterHtml) {
      const region = World.stockRegion(i);
      const cur = () => (World.filter[i] & FILTER_CUSTOM) ? World.filter[i] : (FILTER_CUSTOM | (FILTER_CUSTOM - 1));
      const apply = (mask) => { World.setFilter(region, mask); this.tileInfo(p, x, y); };
      p.querySelectorAll('.fbtn').forEach(b => b.onclick = () => apply(cur() ^ ITEM_BIT[b.dataset.k]));
      this.$('fAll').onclick = () => apply(0);
      this.$('fNone').onclick = () => apply(FILTER_CUSTOM);
    }
  },

  // ---------- Okno priorit ----------
  openPriorities() {
    const m = this.$('modal');
    const render = () => {
      let h = `<div class="mbox wide"><div class="mhead"><b>Priority práce</b><button class="x" id="mClose">✕</button></div>
        <p class="mnote">Klepnutím měníš prioritu: <b class="p1">1</b> nejvyšší … <b class="p4">4</b> nejnižší, <b class="p0">–</b> nedělá. Číslo pod prioritou = úroveň dovednosti.</p>
        <div class="ptable"><table><tr><th></th>${WORK_TYPES.map(w => `<th><span class="full">${w.name}</span><span class="short">${w.short}</span></th>`).join('')}</tr>`;
      for (const c of Game.colonists) {
        h += `<tr><td class="pname"><img class="pix portrait sm" src="${Sprites.toURL(c.portrait, 3)}" alt="">${c.first}</td>`;
        for (const w of WORK_TYPES) {
          const v = c.priorities[w.id];
          const lvl = w.skill ? c.skills[w.skill].lvl : '';
          h += `<td><button class="prio p${v}" data-c="${c.id}" data-w="${w.id}">${v || '–'}</button><small>${lvl}</small></td>`;
        }
        h += '</tr>';
      }
      h += '</table></div></div>';
      m.innerHTML = h;
      m.classList.remove('hidden');
      this.$('mClose').onclick = () => m.classList.add('hidden');
      m.querySelectorAll('.prio').forEach(b => b.onclick = () => {
        const c = Game.colonistById(+b.dataset.c);
        const v = c.priorities[b.dataset.w];
        c.priorities[b.dataset.w] = v === 0 ? 1 : v >= 4 ? 0 : v + 1;
        render();
      });
    };
    m.onclick = (e) => { if (e.target === m) m.classList.add('hidden'); };
    render();
  },

  openMenu() {
    const m = this.$('modal');
    const render = () => {
      m.innerHTML = `<div class="mbox"><div class="mhead"><b>Menu</b><button class="x" id="mClose">✕</button></div>
        <div class="menu">
          <button id="mBack">Pokračovat ve hře</button>
          <button id="mSave">Uložit nyní</button>
          <button id="mExport">Exportovat hru do souboru</button>
          <button id="mImport">Importovat hru ze souboru</button>
          <button id="mAuto">Zrychlit čas, když všichni spí: <b class="${Game.autoFast ? 'on' : 'off'}">${Game.autoFast ? 'ZAP' : 'VYP'}</b></button>
          <button id="mHelp">Nápověda a ovládání</button>
          <button id="mNew">Nová kolonie (nová mapa)</button>
        </div><p class="mnote">Hra se ukládá automaticky každou herní hodinu do tohoto prohlížeče. Semínko mapy: ${Game.seed}</p></div>`;
      m.classList.remove('hidden');
      const close = () => m.classList.add('hidden');
      this.$('mClose').onclick = close;
      this.$('mBack').onclick = close;
      this.$('mSave').onclick = () => {
        close();
        if (Save.store()) this.toast('Hra uložena.', 'good');
        else this.toast('Uložení do prohlížeče selhalo – použij export do souboru.', 'warn');
      };
      this.$('mExport').onclick = () => { close(); Save.exportFile(); this.toast('Uložená hra se stahuje jako soubor.', 'good'); };
      this.$('mImport').onclick = () => { close(); this.$('importFile').click(); };
      this.$('mAuto').onclick = () => { Game.setAutoFast(!Game.autoFast); render(); };
      this.$('mHelp').onclick = () => this.openHelp();
      this.$('mNew').onclick = () => {
        if (confirm('Opravdu začít novou kolonii? Současná uložená hra bude přepsána.')) { Save.clear(); Main.boot(null); }
      };
    };
    m.onclick = (e) => { if (e.target === m) m.classList.add('hidden'); };
    render();
  },

  /** Úvodní dotaz: pokračovat z uložené hry, nebo začít znovu. */
  askContinue(saved) {
    const m = this.$('modal');
    const when = new Date(saved.savedAt).toLocaleString('cs-CZ', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });

      <p>Nalezena uložená hra: <b class="on">${saved.label}</b><br><span class="mnote">${saved.colonists.map(c => c.first).join(', ')} · uloženo ${when}</span></p>

      </div></div>`;

    this.$('mCont').onclick = () => Main.boot(saved);

  openHelp(first) {
    const m = this.$('modal');
    m.innerHTML = `<div class="mbox help"><div class="mhead"><b>${first ? 'Vítej v kolonii!' : 'Nápověda'}</b><button class="x" id="mClose">✕</button></div>
      <div class="hbody">
      <p>Čtyři kolonisté ztroskotali v divočině. Postarej se, aby měli <b>jídlo</b>, <b>postele</b> a <b>střechu nad hlavou</b>. Kolonisté si práci berou sami podle svých <b>priorit</b> a dovedností – ty jen plánuješ.</p>
      <h4>Ovládání</h4>
      <ul>
        <li><b>Posun mapy:</b> táhni jedním prstem (s nástrojem Výběr) / pravé tlačítko myši / WASD.</li>
        <li><b>Zoom:</b> roztáhni dva prsty / kolečko myši.</li>
        <li><b>Výběr oblasti:</b> zvol nástroj ve spodním menu a táhni prstem přes mapu.</li>
        <li><b>Výběr kolonisty:</b> klepni na něj nebo na jeho kartu nahoře. Druhé klepnutí na kartu = sledování kamerou.</li>
        <li><b>Potvrzení:</b> po tažení prstem se ukáže náhled s cenou – potvrď ✔, nebo zruš ✕. Poslední akci vrátíš tlačítkem <b>↶ Zpět</b>.</li>
        <li><b>Čas:</b> ❚❚ pauza, 1× až 4× (klávesy mezerník, 1–4). V Menu lze zapnout zrychlení, když všichni spí.</li>
        <li><b>Ukládání:</b> automaticky každou herní hodinu; v Menu je export a import do souboru.</li>
      </ul>
      <h4>Jak začít</h4>
      <ol>
        <li><b>Příkazy → Kácet</b>: označ pár stromů – dřevo je potřeba na všechno. Kácení má vlastní prioritu i dovednost (Dřevorubectví).</li>
        <li><b>Stavba → Ohniště</b>: na něm se vaří teplé jídlo (lepší nálada).</li>
        <li><b>Zóny → Pole</b>: na úrodné půdě (tmavá hlína) rostou brambory rychleji.</li>
        <li><b>Stavba → Postel</b> pro každého kolonistu, kolem postav <b>zdi</b> a <b>dveře</b>.</li>
        <li><b>Příkazy → Těžit</b> skálu (kámen) a ložiska železné rudy (oranžové žilky).</li>
        <li><b>Výroba</b>: postav Pilu a Pec (prkna a železné pláty) a Výzkumný stůl – od třetího dne se vyplatí první stroje.</li>
      </ol>
      <h4>Automatizace</h4>
      <ul>
        <li><b>Dílny</b> (Výroba): pila řeže dřevo na prkna, pec taví rudu na železné pláty. Obsluhují je kolonisté s prací Řemeslo.</li>
        <li><b>Ložiska rudy</b> mají zásobu ${Config.ORE_AMOUNT} kusů – těžbou nezmizí hned.</li>
        <li><b>Výzkum</b>: postav výzkumný stůl a ve Výroba → Výzkum vyber technologii. Dokončení stromu je cíl hry.</li>
        <li><b>Stroje</b>: vrták, automatická pila a pec s podavačem berou suroviny ze sousedních políček nebo z pásu a výrobky kladou ve směru šipky. Směr otočíš tlačítkem ⟳ v nápovědě nástroje.</li>
        <li><b>Pásy</b>: táhni prstem ve směru, kterým mají vozit. Zatáčka = další pás jiným směrem.</li>
        <li><b>Energie</b>: vodní kolo (na mělké vodě), větrník a kotel na dřevo. Stroje musí být v dosahu zdroje nebo sloupu; přehled je ve Výroba → Energie.</li>
      </ul>
      <h4>Přežití</h4>
      <ul>
        <li><b>Zdraví:</b> dlouhé hladovění a vyčerpání ubírají zdraví a kolonista může zemřít. Když zemřou všichni, hra končí.</li>
        <li><b>Roční období:</b> jaro, léto, podzim a zima po ${Config.SEASON_DAYS} dnech. V zimě plodiny nerostou a keře neplodí – udělej zásoby.</li>
        <li><b>Kažení:</b> syrové potraviny se kazí rychleji než uvařené; pod střechou, v truhle a v chladu vydrží déle.</li>
        <li><b>Místnosti:</b> prostor uzavřený zdmi a dveřmi je pod střechou – neprší tam a ohniště ho vytopí. Vlastní ložnice (místnost s jednou postelí) zlepšuje náladu.</li>
        <li><b>Nábytek:</b> stůl se židlí vedle něj zlepší náladu při jídle. Klepnutím na sklad nebo truhlu nastavíš, co se tam smí ukládat.</li>
        <li><b>Události:</b> poutníci se přidávají ke kolonii, divočáci žerou pole (bdělý kolonista je zaplaší) a blesk může zapálit les – oheň se šíří po stromech a dřevěných stavbách.</li>
      </ul>
      <p>Hlídej ukazatele <b>zdraví</b>, <b>sytosti</b>, <b>energie</b> a <b>nálady</b>. Velmi nešťastný kolonista se může psychicky zhroutit a přestat pracovat.</p>
      </div><div class="menu"><button id="mBack">${first ? 'Začít hrát' : 'Zavřít'}</button></div></div>`;
    m.classList.remove('hidden');
    const close = () => m.classList.add('hidden');
    this.$('mClose').onclick = close;
    this.$('mBack').onclick = close;
    m.onclick = (e) => { if (e.target === m) close(); };
  },

  // ---------- Výzkum ----------
  openResearch() {
    const m = this.$('modal');
    const render = () => {
      const hasTable = World.structBy.research && World.structBy.research.size;
      let h = `<div class="mbox wide"><div class="mhead"><b>Výzkum</b><button class="x" id="mClose">✕</button></div>

          <div class="tn">${done ? '✔ ' : cur ? '▶ ' : avail ? '' : '🔒 '}${t.name}<small>${done ? 'hotovo' : Math.floor(pr * t.cost) + ' / ' + t.cost}</small></div>
          <div class="td">${t.desc}${!done && !avail ? ' <i>Vyžaduje: ' + t.req.filter(r => !Research.done.has(r)).map(r => TECHS[r].name).join(', ') + '</i>' : ''}</div>

      }
      h += '</div></div>';
      m.innerHTML = h;
      m.classList.remove('hidden');
      this.$('mClose').onclick = () => m.classList.add('hidden');

    };
    m.onclick = (e) => { if (e.target === m) m.classList.add('hidden'); };
    render();
  },

  // ---------- Přehled energie ----------
  openPower() {
    const m = this.$('modal');
    if (Power.dirty) Power.rebuild();
    let h = `<div class="mbox wide"><div class="mhead"><b>Energie</b><button class="x" id="mClose">✕</button></div>
      <p class="mnote">Celkem výroba <b class="on">${Power.supply} ⚡</b>, spotřeba <b class="${Power.demand > Power.supply ? 'p1' : 'on'}">${Power.demand} ⚡</b>. Zdroje a sloupy se propojí do ${Config.POWER_LINK} políček, stroj musí být do ${Config.POWER_REACH} políček od zdroje nebo sloupu. Při nedostatku běží stroje pomaleji, bez energie stojí.</p>`;

        <tr><td>Postavené stavby</td><td>${st.built}</td></tr>
        <tr><td>Pokácené stromy</td><td>${st.chopped}</td></tr>
        <tr><td>Vytěžené skály</td><td>${st.mined}</td></tr>

  // ---------- Notifikace ----------

    const box = this.$('toasts');
    if (!box) return;
    const t = this.el('div', 'toast ' + kind, msg);
    box.appendChild(t);
    while (box.children.length > 4) box.removeChild(box.firstChild);
    setTimeout(() => t.classList.add('out'), 4200);
    setTimeout(() => t.remove(), 4800);

  // ---------- Pravidelná aktualizace ----------

    this.$('dayLabel').textContent = `Den ${TimeSys.day}`;
    this.$('timeLabel').textContent = TimeSys.timeStr();
    const d = TimeSys.daylight();
    this.$('sunIcon').textContent = d > 0.5 ? '☀️' : d > 0.05 ? '🌅' : '🌙';
    const wd = Weather.def;
    const temp = TimeSys.temp();
    this.$('weatherLabel').textContent = `${Weather.cur === 'clear' && d < 0.3 ? '✨' : (temp < 0 && wd.snowName ? '🌨️' : wd.icon)} ${temp < 0 && wd.snowName ? wd.snowName : wd.name}`;
    const sl = this.$('seasonLabel');
    sl.textContent = `${TimeSys.seasonName} ${Math.round(temp)}°C`;
    sl.className = 's' + TimeSys.season;
    const counts = World.countItems();
    for (const k of ITEM_ORDER) {
      const e = this.$('res-' + k);
      e.textContent = counts[k];
      // pokročilé suroviny se ukážou, až je kolonie poprvé získá
      if (counts[k] > 0) e.parentNode.classList.remove('hidden');
    }
    const pw = this.$('res-power');
    pw.parentNode.classList.toggle('hidden', !Power.nets.length);
    pw.textContent = `${Power.supply}/${Power.demand}`;
    pw.parentNode.classList.toggle('low', Power.demand > Power.supply);
    const rs = this.$('res-research');
    rs.parentNode.classList.toggle('hidden', !Research.current);
    if (Research.current) rs.textContent = Math.floor(Research.progress(Research.current) * 100) + '%';
    this.updateColonistBar();
    if (Game.selected) this.updateInfo(false);
  },
};

  <script>
// ===== js/save.js =====
'use strict';
/**
 * Save – ukládání a načítání hry.
 *  - automaticky do localStorage jednou za herní hodinu (a při opuštění stránky),
 *  - export / import do souboru JSON.
 * Mapa se neukládá celá: ze semínka se vygeneruje znovu a uloží se jen změny světa
 * (pokácené stromy, vytěžené skály, označení, stavby, plány, předměty, pole, zóny),
 * kolonisté, čas a počasí.
 */
const Save = {
  KEY: 'kolonie.save.v1',
  VERSION: 1,
  lastError: null,

  // ---------- Serializace ----------
  serialize() {
    const W = World, n = W.n;
    const CODE = { tree: 1, rock: 2, ore: 3, bush: 4 };
    const objRemoved = [], objSet = [];
    for (let i = 0; i < n; i++) {
      const o = W.obj[i], base = W.baseType[i];
      if (!o) { if (base) objRemoved.push(i); continue; }
      // nezměněné objekty se neukládají (stromy dorůstají podle uplynulého času)
      const same = CODE[o.type] === base && !o.des && (o.type !== 'bush' || o.berries) && (o.type !== 'ore' || o.amount === Config.ORE_AMOUNT);
      if (!same) objSet.push([i, o]);
    }
    const struct = [], floor = [], items = [], crops = [], bp = [], stock = [], farm = [], pasture = [];
    for (const i of W.structSet) {
      const s = W.struct[i];
      const row = [i, s.type, s.decon ? 1 : 0, s.owner, s.dir || 0];
      // stav stroje: zásobníky, postup, cíl výroby, hoření, opotřebení
      const st = {};
      let any = false;
      for (const k of ['inv', 'out', 'prog', 'target', 'burn', 'wear', 'broken', 'breed', 'filter', 'unload', 'hp', 'rr']) if (s[k] !== undefined) { st[k] = s[k]; any = true; }
      if (any) row.push(st);
      struct.push(row);
    }
    for (let i = 0; i < n; i++) {
      const f = W.floor[i];
      if (f) floor.push([i, f.type, f.decon ? 1 : 0]);
      if (W.zone[i] === 1) stock.push(i); else if (W.zone[i] === 2) farm.push(i); else if (W.zone[i] === 3) pasture.push(i);
    }
    for (const i of W.itemSet) { const it = W.items[i]; items.push([i, it.type, it.n, +(it.age || 0).toFixed(2)]); }
    const filter = [];
    for (const i of W.stockTiles) if (W.filter[i]) filter.push([i, W.filter[i]]);
    for (const i of W.cropSet) crops.push([i, +W.crops[i].g.toFixed(4)]);
    for (const i of W.bpSet) bp.push([i, W.bp[i].type, W.bp[i].del, W.bp[i].dir || 0]);
    // pořadí množin závisí na historii → seřadit, ať je uložení deterministické
    for (const arr of [struct, items, crops, bp]) arr.sort((p, q) => p[0] - q[0]);

    return {
      v: this.VERSION,
      seed: Game.seed,
      savedAt: Date.now(),
      label: `Den ${TimeSys.day}, ${TimeSys.timeStr()}`,
      time: { minutes: TimeSys.minutes, lastHour: TimeSys.lastHour },
      weather: { cur: Weather.cur, until: Weather.until, rain: Weather.rain, cloud: Weather.cloud, fog: Weather.fog, wind: Weather.wind, snow: Weather.snow },
      rng: U.getState(),
      tick: Game.tickCount,
      speed: Game.lastSpeed,
      cam: { x: Camera.x, y: Camera.y, zoom: Camera.zoom },
      world: { objRemoved, objSet, struct, floor, items, crops, bp, stock, farm, pasture, filter },
      fire: [...Fire.tiles].map(([i, f]) => [i, +f.t.toFixed(2)]),
      animals: Animals.pack(),
      events: Events.pack(),
      stats: Game.stats,
      nextId: Game.nextId,
      research: Research.pack(),
      colonists: Game.colonists.map(c => this.packColonist(c)),
    };
  },

  packColonist(c) {
    const skills = {};
    for (const k in c.skills) skills[k] = [c.skills[k].lvl, +c.skills[k].xp.toFixed(2)];
    return {
      id: c.id, gender: c.gender, first: c.first, last: c.last, look: c.look, trait: c.trait.id, age: c.age,
      x: c.x, y: c.y, dir: c.dir, skills, priorities: c.priorities,
      hunger: c.hunger, energy: c.energy, mood: c.mood, health: c.health, thoughts: c.thoughts,
      carry: c.carry, breakUntil: c.breakUntil, warmth: c.warmth, coat: c.coat, bow: c.bow,
    };
  },
  unpackColonist(d) {
    const lv = {};
    for (const k in SKILLS) lv[k] = d.skills[k] ? d.skills[k][0] : 0;
    const c = new Colonist(d.id, 0, 0, {
      gender: d.gender, first: d.first, last: d.last, look: d.look, skills: lv,
      trait: TRAITS.find(t => t.id === d.trait) || TRAITS[0], age: d.age,
    });
    for (const k in SKILLS) if (d.skills[k]) c.skills[k].xp = d.skills[k][1];
    for (const w of WORK_TYPES) if (d.priorities[w.id] !== undefined) c.priorities[w.id] = d.priorities[w.id];
    c.x = d.x; c.y = d.y; c.dir = d.dir || 'down';
    c.hunger = d.hunger; c.energy = d.energy; c.mood = d.mood; c.moodTarget = d.mood;
    c.health = d.health !== undefined ? d.health : 100;
    c.thoughts = d.thoughts || [];
    c.carry = d.carry || null;
    c.breakUntil = d.breakUntil || 0;
    c.warmth = d.warmth !== undefined ? d.warmth : 100;
    c.coat = !!d.coat; c.bow = !!d.bow;
    if (!World.canWalk(c.tx, c.ty)) { const p = World.nearestWalkable(c.tx, c.ty); c.x = p.x + 0.5; c.y = p.y + 0.5; }
    return c;
  },

  /** Obnoví stav do čerstvě vygenerovaného světa se stejným semínkem. */
  apply(d) {
    const W = World, n = W.n, w = d.world;
    TimeSys.minutes = d.time.minutes; TimeSys.lastHour = d.time.lastHour;
    const hours = Math.max(0, (d.time.minutes - 7 * 60) / 60);

    // objekty: výchozí stav + dorůst stromů + uložené změny
    for (let i = 0; i < n; i++) {
      const o = W.obj[i];
      if (o && o.type === 'tree') o.size = Math.min(1, W.baseSize[i] + hours * Config.TREE_GROW_PER_HOUR);
    }
    for (const i of w.objRemoved) W.obj[i] = null;
    for (const [i, o] of w.objSet) { if (o.type === 'ore' && o.amount === undefined) o.amount = Config.ORE_AMOUNT; W.obj[i] = o; }

    // ostatní vrstvy se nahrazují celé
    W.items.fill(null); W.struct.fill(null); W.floor.fill(null); W.crops.fill(null); W.bp.fill(null); W.zone.fill(0);
    for (const [i, type, decon, owner, dir, st] of w.struct) { if (BUILD[type]) W.makeStruct(i, type, dir || 0, Object.assign({ decon: !!decon, owner }, st)); }
    for (const [i, type, decon] of w.floor) W.floor[i] = { type, decon: !!decon };
    for (const [i, type, k, age] of w.items) if (ITEMS[type]) W.items[i] = { type, n: k, age: age || 0 };
    W.filter.fill(0);
    for (const [i, m] of w.filter || []) W.filter[i] = m;
    for (const [i, g] of w.crops) W.crops[i] = { g };
    for (const [i, type, del, dir] of w.bp) { if (BUILD[type]) { W.placeBlueprint(i, type, dir || 0); W.bp[i].del = del || {}; } }
    for (const i of w.stock) W.zone[i] = 1;
    for (const i of w.farm) W.zone[i] = 2;
    for (const i of w.pasture || []) W.zone[i] = 3;
    W.rebuildIndex();

    Game.res.clear(); Game.itemRes.clear();
    for (const k in Game.resType) Game.resType[k] = 0;
    Game.colonists = d.colonists.map(c => this.unpackColonist(c));
    Game.nextId = d.nextId !== undefined ? d.nextId : Math.max(-1, ...Game.colonists.map(c => c.id)) + 1;
    if (d.stats) Game.stats = Object.assign(Game.stats, d.stats);
    Fire.reset();
    for (const [i, t] of d.fire || []) Fire.tiles.set(i, { t });
    Animals.unpack(d.animals);
    Events.unpack(d.events);
    Research.unpack(d.research);
    Power.reset();
    Game.tickCount = d.tick || 0;
    Game.lastSpeed = d.speed || 1;
    Object.assign(Weather, d.weather);
    if (d.cam) { Camera.zoom = d.cam.zoom; Camera.centerOn(d.cam.x, d.cam.y); }
    U.setState(d.rng);
  },

  // ---------- localStorage ----------
  valid(d) {
    return !!d && d.v === this.VERSION && Number.isFinite(d.seed) && d.world && Array.isArray(d.colonists) && d.time;
  },
  store() {
    if (Game.over || !Game.colonists.length) return false;
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.serialize()));
      this.lastError = null;
      return true;
    } catch (e) {
      this.lastError = e;
      return false;
    }
  },
  /** Automatické uložení (jednou za herní hodinu). */
  auto() {
    if (!this.store() && this.lastError) Game.notifyOnce('savefail', 'Hru se nepodařilo automaticky uložit (úložiště prohlížeče není dostupné). Použij export do souboru.', 'warn', 24 * 60);
  },
  /** Vrátí uloženou hru, nebo null. */
  peek() {
    try {
      const d = JSON.parse(localStorage.getItem(this.KEY));
      return this.valid(d) ? d : null;
    } catch (e) { return null; }
  },
  clear() { try { localStorage.removeItem(this.KEY); } catch (e) { /* nic */ } },

  // ---------- Soubor ----------
  exportFile() {
    const d = this.serialize();
    const blob = new Blob([JSON.stringify(d)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `kolonie-den${TimeSys.day}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  /** Načte soubor s uloženou hrou a předá data do `onLoad`. */
  importFile(file, onLoad, onError) {
    const r = new FileReader();
    r.onerror = () => onError('Soubor se nepodařilo přečíst.');
    r.onload = () => {
      let d = null;
      try { d = JSON.parse(r.result); } catch (e) { /* neplatný JSON */ }
      if (!this.valid(d)) { onError('Tohle není platná uložená hra Kolonie.'); return; }
      onLoad(d);
    };
    r.readAsText(file);
  },
};
