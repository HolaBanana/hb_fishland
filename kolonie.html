  <script>
// ===== js/colonist.js =====
'use strict';
/**
 * Colonist – kolonista: potřeby (hlad, energie, nálada), dovednosti, priority, AI a pohyb.
 */
class Colonist {
  constructor(id, x, y, opts) {
    this.id = id;
    this.gender = opts.gender;
    this.first = opts.first;
    this.last = opts.last;
    this.name = opts.first + ' ' + opts.last;
    this.look = opts.look;
    this.trait = opts.trait;
    this.age = opts.age;
    this.sprites = Sprites.colonist(this.look);
    this.portrait = Sprites.portrait(this.sprites);

    this.x = x + 0.5; this.y = y + 0.5;
    this.dir = 'down'; this.animT = 0; this.moving = false;

    this.skills = {};
    for (const k in SKILLS) this.skills[k] = { lvl: opts.skills[k], xp: 0 };
    this.priorities = {};
    for (const wt of WORK_TYPES) {
      if (!wt.skill) { this.priorities[wt.id] = 3; continue; }
      const l = this.skills[wt.skill].lvl;
      this.priorities[wt.id] = l >= 8 ? 1 : l >= 4 ? 2 : l >= 2 ? 3 : 4;
    }

    this.hunger = U.range(70, 90);
    this.energy = U.range(75, 95);
    this.mood = 60;
    this.moodTarget = 60;
    this.thoughts = [];

    this.job = null;
    this.path = null; this.pathI = 0; this.dest = null;
    this.carry = null;
    this.activity = 'Rozhlíží se';
    this.thinkCd = U.int(1, 10);
    this.unreach = new Map();
    this.resKeys = [];
    this.itemRes = [];
    this.sleeping = false;
    this.eating = false;
    this.workFrac = -1;
    this.working = false;
    this.breakUntil = 0;
    this.tickN = U.int(0, 29);
  }

  get tx() { return Math.floor(this.x); }
  get ty() { return Math.floor(this.y); }
  inBreak() { return this.breakUntil > TimeSys.minutes; }

  // ---------- Dovednosti a práce ----------
  skillFactor(skill) { return 0.55 + this.skills[skill].lvl * 0.075; }
  moodFactor() { return this.mood < 25 ? 0.8 : this.mood > 75 ? 1.12 : 1; }
  work(skill) {
    this.working = true;
    let f = (skill ? this.skillFactor(skill) : 1) * this.moodFactor() * (this.trait.work || 1);
    if (this.hunger < 5) f *= 0.7;
    if (skill) this.gainXp(skill, 0.07);
    return f;
  }
  xpNeed(lvl) { return 50 + lvl * 18; }
  gainXp(skill, amount) {
    const s = this.skills[skill];
    if (s.lvl >= 20) return;
    s.xp += amount * (this.trait.learn || 1);
    while (s.xp >= this.xpNeed(s.lvl) && s.lvl < 20) {
      s.xp -= this.xpNeed(s.lvl);
      s.lvl++;
      UI.toast(`${this.first} se zlepšil/a: ${SKILLS[skill]} → ${s.lvl}`, 'good');
    }
  }

  // ---------- Myšlenky a nálada ----------
  addThought(id, label, val, hours) {
    this.thoughts = this.thoughts.filter(t => t.id !== id);
    this.thoughts.push({ id, label, val, until: TimeSys.minutes + hours * 60 });
  }
  moodFactors() {
    const out = [{ label: 'Základ', val: 50 }];
    if (this.trait.mood) out.push({ label: this.trait.name, val: this.trait.mood });
    for (const t of this.thoughts) out.push({ label: t.label, val: t.val });
    if (this.hunger < 5) out.push({ label: 'Hladoví', val: -20 });
    else if (this.hunger < 25) out.push({ label: 'Má hlad', val: -8 });
    if (this.energy < 10) out.push({ label: 'Vyčerpání', val: -14 });
    else if (this.energy < 25) out.push({ label: 'Únava', val: -6 });
    if (Weather.rain > 0.3 && !this.sleeping && !World.floor[World.idx(this.tx, this.ty)]) out.push({ label: 'Moknutí v dešti', val: -4 });
    if (World.floor[World.idx(this.tx, this.ty)]) out.push({ label: 'Pěkné prostředí', val: 2 });
    if (TimeSys.daylight() < 0.4 && Game.nearLight(this.tx, this.ty)) out.push({ label: 'Teplo a světlo ohně', val: 3 });
    if (Weather.cur === 'clear' && TimeSys.daylight() > 0.8) out.push({ label: 'Krásný den', val: 2 });
    return out;
  }
  updateMood(hours) {
    const now = TimeSys.minutes;
    this.thoughts = this.thoughts.filter(t => t.until > now);
    this.moodTarget = U.clamp(this.moodFactors().reduce((s, f) => s + f.val, 0), 0, 100);
    const r = 8 * hours;
    this.mood += U.clamp(this.moodTarget - this.mood, -r, r);
    // psychické zhroucení
    if (this.mood < 18 && !this.inBreak() && U.chance(0.3 * hours)) {
      this.breakUntil = now + 60 * 3;
      if (this.job) this.endJob();
      UI.toast(`${this.first} má psychické zhroucení! Na chvíli odmítá pracovat.`, 'warn');
    }
  }

  // ---------- Pohyb ----------
  speed() {
    let s = 0.105 * (this.trait.move || 1);
    if (this.energy < 10) s *= 0.8;
    if (this.hunger < 5) s *= 0.85;
    if (this.carry) s *= 0.92;
    return s;
  }
  pathTo(x, y, mode) {
    const p = Pathfinder.find(this.tx, this.ty, x, y, mode);
    if (!p) { this.path = null; return false; }
    this.path = p; this.pathI = 0; this.dest = { x, y, mode };
    return true;
  }
  followPath() {
    if (!this.path) return 'fail';
    if (this.pathI >= this.path.length) {
      // dosednout do středu políčka
      const cx = this.tx + 0.5, cy = this.ty + 0.5;
      const d = Math.hypot(cx - this.x, cy - this.y);
      if (d > 0.02) {
        const sp = Math.min(d, this.speed());
        this.x += (cx - this.x) / d * sp; this.y += (cy - this.y) / d * sp;
        this.moving = true;
        if (d > sp) return 'moving';
      }
      this.path = null;
      return 'arrived';
    }
    const ni = this.path[this.pathI];
    if (!World.walk[ni]) {
      // cesta se zablokovala – přepočítat
      if (!this.pathTo(this.dest.x, this.dest.y, this.dest.mode)) return 'fail';
      return 'moving';
    }
    const nx = (ni % World.w) + 0.5, ny = Math.floor(ni / World.w) + 0.5;
    const dx = nx - this.x, dy = ny - this.y;
    const d = Math.hypot(dx, dy);
    const ci = World.idx(this.tx, this.ty);
    const sp = this.speed() / ((World.cost[ni] + World.cost[ci]) * 0.5);
    if (d <= sp) { this.x = nx; this.y = ny; this.pathI++; }
    else { this.x += dx / d * sp; this.y += dy / d * sp; }
    if (Math.abs(dx) > Math.abs(dy)) this.dir = dx > 0 ? 'right' : 'left';
    else if (Math.abs(dy) > 0.01) this.dir = dy > 0 ? 'down' : 'up';
    this.moving = true;
    this.animT += sp;
    if (this.pathI >= this.path.length) return this.followPath();
    return 'moving';
  }
  face(x, y) {
    const dx = x + 0.5 - this.x, dy = y + 0.5 - this.y;
    if (Math.abs(dx) > Math.abs(dy)) this.dir = dx > 0 ? 'right' : 'left';
    else if (Math.abs(dy) > 0.01) this.dir = dy > 0 ? 'down' : 'up';
  }

  // ---------- Předměty ----------
  pickup(i, want, type) {
    Game.releaseItemRes(this, i);
    const it = World.items[i];
    if (!it || it.type !== type) return false;
    if (this.carry && this.carry.type !== type) {
      World.dropItem(this.tx, this.ty, this.carry.type, this.carry.n);
      this.carry = null;
    }
    const have = this.carry ? this.carry.n : 0;
    const k = World.takeItem(i, Math.min(want, Config.CARRY - have));
    if (k <= 0) return false;
    if (this.carry) this.carry.n += k; else this.carry = { type, n: k };
    return true;
  }

  // ---------- Úkoly ----------
  startJob(job) {
    this.job = job;
    job.stage = 0; job.progress = 0; job.walkKey = null;
    if (job.key) Game.reserve(job.key, this);
    if (job.type === 'eat') Game.reserveItem(job.i, 1, this);
    if (job.type === 'sleep' && job.bed >= 0) Game.reserve('b' + job.bed, this);
  }
  endJob() {
    Game.releaseAll(this);
    if (this.carry) {
      World.dropItem(this.tx, this.ty, this.carry.type, this.carry.n);
      this.carry = null;
    }
    this.job = null;
    this.path = null;
    this.sleeping = false;
    this.workFrac = -1;
  }

  think() {
    const night = TimeSys.isNight();
    if (this.inBreak()) { this.startJob({ type: 'wander' }); return; }
    if (this.hunger < 30) {
      const f = Jobs.findFood(this);
      if (f >= 0) { this.startJob({ type: 'eat', i: f, key: 'e' + f + '_' + this.id }); return; }
      Game.notifyOnce('nofood', 'Kolonisté nemají co jíst! Sbírejte bobule nebo založte pole.', 'warn', 180);
    }
    if (this.energy < 25 || (night && this.energy < 92)) {
      this.startJob({ type: 'sleep', bed: Jobs.findBed(this) });
      return;
    }
    const job = Jobs.findWork(this);
    if (job) { this.startJob(job); return; }
    this.startJob({ type: 'wander' });
  }

  tick() {
    const h = Config.HOURS_PER_TICK;
    this.moving = false;
    this.working = false;
    this.eating = false;
    // potřeby
    this.hunger = Math.max(0, this.hunger - (100 / 20) * h * (this.trait.hunger || 1) * (this.sleeping ? 0.5 : 1));
    if (!this.sleeping) this.energy = Math.max(0, this.energy - (100 / 21) * h);
    if (++this.tickN >= 30) { this.tickN = 0; this.updateMood(30 * h); }

    // přerušení kvůli naléhavým potřebám
    if (this.job) {
      const t = this.job.type;
      if (t !== 'eat' && t !== 'sleep' && this.hunger < 12 && Jobs.findFood(this) >= 0) this.endJob();
      else if (t !== 'sleep' && this.energy <= 1) {
        this.endJob();
        this.startJob({ type: 'sleep', bed: -1, collapse: true });
        UI.toast(`${this.first} se zhroutil/a vyčerpáním!`, 'warn');
      } else if (t === 'wander' && !this.inBreak() && this.job.stage === 2 && this.job.wait > 20 && --this.thinkCd <= 0) {
        // během odpočinku se občas podívat po práci
        this.thinkCd = 20;
        if (Jobs.findWork(this) || this.hunger < 30 || this.energy < 25 || (TimeSys.isNight() && this.energy < 92)) this.endJob();

    if (!this.job) {
      if (--this.thinkCd <= 0) { this.thinkCd = 6; this.think(); }
    }
    if (this.job) {
      const r = Jobs.drivers[this.job.type](this, this.job);
      if (r === Jobs.DONE) { this.endJob(); this.thinkCd = 1; }
      else if (r === Jobs.FAIL) { this.endJob(); this.thinkCd = 4; }
    }
    if (!this.working && !this.eating) this.workFrac = -1;

}

/** Vytvoří náhodnou startovní skupinu kolonistů. */
function createColonists(start) {
  const out = [];
  const usedFirst = new Set();
  const skillKeys = U.shuffle(Object.keys(SKILLS));
  const traits = U.shuffle(TRAITS.slice());
  const skins = [[241, 200, 160], [224, 172, 128], [198, 140, 98], [150, 100, 66], [245, 214, 180]];
  const hairs = [[60, 40, 26], [30, 24, 20], [164, 104, 50], [214, 178, 96], [120, 70, 40], [190, 80, 40], [90, 90, 96]];
  const shirts = [[180, 60, 56], [58, 108, 170], [70, 140, 80], [196, 150, 52], [130, 80, 160], [60, 150, 150], [200, 110, 60]];
  U.shuffle(shirts);
  const offsets = [[-1, 0], [1, 0], [0, 1], [2, 1]];
  for (let k = 0; k < 4; k++) {
    const gender = k % 2 === 0 ? (U.chance(0.5) ? 'm' : 'f') : (out[k - 1].gender === 'm' ? 'f' : 'm');
    let first;
    do { first = U.pick(NAMES[gender].first); } while (usedFirst.has(first));

    const last = U.pick(NAMES[gender].last);
    const skills = {};

      shirt: shirts[k],
      pants: U.pick([[60, 64, 90], [80, 64, 48], [50, 54, 60], [96, 84, 64]]),
      style: gender === 'f' ? U.pick(['long', 'long', 'bun', 'short']) : U.pick(['short', 'short', 'spiky', 'bald', 'beard']),
    };
    const [ox, oy] = offsets[k];
    const p = World.canWalk(start.x + ox, start.y + oy) ? { x: start.x + ox, y: start.y + oy } : World.nearestWalkable(start.x, start.y);
    out.push(new Colonist(k, p.x, p.y, { gender, first, last, look, skills, trait: traits[k], age: U.int(19, 52) }));
  }
  return out;
}

// ===== js/camera.js =====
'use strict';
/**
 * Camera – pozice (střed ve světových pixelech) a přiblížení.
 */
const Camera = {
  x: 0, y: 0, zoom: Config.ZOOM_DEFAULT,
  vw: 800, vh: 600,
  follow: null,

  resize(w, h) { this.vw = w; this.vh = h; this.clamp(); },
  centerOn(wx, wy) { this.x = wx; this.y = wy; this.clamp(); },
  centerTile(tx, ty) { this.centerOn((tx + 0.5) * Config.TILE, (ty + 0.5) * Config.TILE); },
  screenToWorld(sx, sy) {
    return { x: (sx - this.vw / 2) / this.zoom + this.x, y: (sy - this.vh / 2) / this.zoom + this.y };
  },
  screenToTile(sx, sy) {
    const p = this.screenToWorld(sx, sy);
    return { x: Math.floor(p.x / Config.TILE), y: Math.floor(p.y / Config.TILE) };
  },
  worldToScreen(wx, wy) {
    return { x: (wx - this.x) * this.zoom + this.vw / 2, y: (wy - this.y) * this.zoom + this.vh / 2 };
  },
  pan(dxScreen, dyScreen) {
    this.x -= dxScreen / this.zoom;
    this.y -= dyScreen / this.zoom;
    this.follow = null;
    this.clamp();
  },
  setZoom(z, sx = this.vw / 2, sy = this.vh / 2) {
    const before = this.screenToWorld(sx, sy);
    this.zoom = U.clamp(z, this.minZoom(), Config.ZOOM_MAX);
    const after = this.screenToWorld(sx, sy);
    this.x += before.x - after.x;
    this.y += before.y - after.y;
    this.clamp();
  },
  minZoom() {
    // nedovolit oddálit tak, aby byla mapa menší než obrazovka
    const mw = World.w * Config.TILE, mh = World.h * Config.TILE;
    return Math.max(Config.ZOOM_MIN * 0.6, this.vw / mw, this.vh / mh, 0.5);
  },
  clamp() {
    if (!World.w) return;
    const mw = World.w * Config.TILE, mh = World.h * Config.TILE;
    const hw = this.vw / 2 / this.zoom, hh = this.vh / 2 / this.zoom;
    this.x = hw * 2 >= mw ? mw / 2 : U.clamp(this.x, hw, mw - hw);
    this.y = hh * 2 >= mh ? mh / 2 : U.clamp(this.y, hh - 60 / this.zoom, mh - hh + 140 / this.zoom);
  },
  update() {
    if (this.follow) {
      const c = this.follow;
      const tx = c.x * Config.TILE, ty = c.y * Config.TILE;
      this.x += (tx - this.x) * 0.12;
      this.y += (ty - this.y) * 0.12;
      this.clamp();
    }
  },
};

// ===== js/tools.js =====
'use strict';
/**
 * Tools – nástroje hráče (označování, stavění, zóny) a jejich aplikace na výběr políček.
 */
const Tools = (() => {
  const notBlockedTerrain = (i) => {
    const t = World.terrain[i];
    return t !== T.WATER && t !== T.SHALLOW;
  };

  const defs = {
    select: { name: 'Výběr', mode: 'none', hint: 'Klepni na kolonistu nebo políčko. Tažením posouváš mapu, dvěma prsty přibližuješ.' },
    chop: {
      name: 'Kácet', mode: 'rect', hint: 'Táhni prstem přes les – stromy se označí ke kácení.',
      valid: i => { const o = World.obj[i]; return !!o && o.type === 'tree' && o.des !== 'chop'; },
      apply: i => World.designate(i, 'chop'),
    },
    mine: {
      name: 'Těžit', mode: 'rect', hint: 'Táhni přes skály a železnou rudu – označí se k těžbě.',
      valid: i => { const o = World.obj[i]; return !!o && (o.type === 'rock' || o.type === 'ore') && o.des !== 'mine'; },
      apply: i => World.designate(i, 'mine'),
    },
    harvest: {
      name: 'Sbírat', mode: 'rect', hint: 'Táhni přes keře s bobulemi – kolonisté je budou sklízet.',
      valid: i => { const o = World.obj[i]; return !!o && o.type === 'bush' && o.des !== 'harvest'; },
      apply: i => World.designate(i, 'harvest'),
    },
    decon: {
      name: 'Zbourat', mode: 'rect', hint: 'Táhni přes stavby nebo podlahy, které chceš zbourat (vrátí se část materiálu).',
      valid: i => (World.struct[i] && !World.struct[i].decon) || (!World.struct[i] && World.floor[i] && !World.floor[i].decon),
      apply: i => {
        if (World.struct[i]) World.struct[i].decon = true; else World.floor[i].decon = true;
        World.deconSet.add(i);
      },
    },
    cancel: {
      name: 'Zrušit', mode: 'rect', hint: 'Táhni pro zrušení označení, plánů staveb a bourání.',
      valid: i => !!(World.bp[i] || (World.obj[i] && World.obj[i].des) || World.deconSet.has(i)),
      apply: i => {
        if (World.bp[i]) World.cancelBlueprint(i);
        if (World.obj[i] && World.obj[i].des) World.designate(i, null);
        if (World.deconSet.has(i)) {
          if (World.struct[i]) World.struct[i].decon = false;
          if (World.floor[i]) World.floor[i].decon = false;
          World.deconSet.delete(i);
        }
      },
    },
    zone_stock: {
      name: 'Sklad', mode: 'rect', hint: 'Táhni pro vytvoření skladu. Kolonisté sem nosí suroviny.',
      valid: i => World.zone[i] !== 1 && notBlockedTerrain(i) && !(World.obj[i] && OBJECTS[World.obj[i].type].blocks),
      apply: i => { World.zone[i] = 1; },
      after: () => World.rebuildZones(),
    },
    zone_farm: {
      name: 'Pole', mode: 'rect', hint: 'Táhni přes trávu nebo úrodnou půdu – vznikne pole s bramborami. Stromy na něm se pokácí.',
      valid: i => World.zone[i] !== 2 && TERRAIN[World.terrain[i]].fert > 0 && !World.struct[i] && !World.floor[i] &&
        !(World.obj[i] && (World.obj[i].type === 'rock' || World.obj[i].type === 'ore')),
      apply: i => {
        World.zone[i] = 2;
        const o = World.obj[i];
        if (o && o.type === 'tree') World.designate(i, 'chop');
      },
      after: () => World.rebuildZones(),
    },
    zone_clear: {
      name: 'Smazat zónu', mode: 'rect', hint: 'Táhni pro odstranění skladu nebo pole.',
      valid: i => World.zone[i] !== 0,
      apply: i => { World.zone[i] = 0; },
      after: () => World.rebuildZones(),
    },
  };

  // stavební nástroje z definic BUILD
  for (const k in BUILD) {
    const b = BUILD[k];
    defs[k] = {
      name: b.name, mode: b.mode, hint: b.hint, build: k,
      valid: i => {
        if (!notBlockedTerrain(i) || World.bp[i] || World.crops[i]) return false;
        const o = World.obj[i];
        if (o) return false;
        if (b.layer === 'floor') return !World.floor[i];
        return !World.struct[i];
      },
      apply: i => World.placeBlueprint(i, k),
    };
  }

  /** Seznam políček pro tah od (x0,y0) do (x1,y1) podle režimu nástroje. */
  function tilesFor(tool, x0, y0, x1, y1) {
    const d = defs[tool];
    if (!d || d.mode === 'none') return [];
    const out = [];
    const clampX = v => U.clamp(v, 0, World.w - 1), clampY = v => U.clamp(v, 0, World.h - 1);
    if (d.mode === 'single') {
      if (World.inb(x1, y1)) out.push(World.idx(x1, y1));
      return out;
    }
    let ax = clampX(Math.min(x0, x1)), bx = clampX(Math.max(x0, x1));
    let ay = clampY(Math.min(y0, y1)), by = clampY(Math.max(y0, y1));
    if (d.mode === 'perimeter') {
      if (bx - ax >= 1 && by - ay >= 1) {
        for (let x = ax; x <= bx; x++) { out.push(World.idx(x, ay)); out.push(World.idx(x, by)); }
        for (let y = ay + 1; y < by; y++) { out.push(World.idx(ax, y)); out.push(World.idx(bx, y)); }
        return out;
      }
    }
    for (let y = ay; y <= by; y++) for (let x = ax; x <= bx; x++) out.push(World.idx(x, y));
    return out;
  }

  function apply(tool, tiles) {
    const d = defs[tool];
    if (!d || !d.apply) return 0;
    let n = 0;
    for (const i of tiles) if (d.valid(i)) { d.apply(i); n++; }
    if (d.after) d.after();
    if (n > 0) {
      if (d.build) {
        const cost = BUILD[d.build].cost, have = World.countItems();
        const lack = [];
        for (const m in cost) if (have[m] < cost[m] * n) lack.push(ITEMS[m].name.toLowerCase());
        UI.toast(`Naplánováno: ${d.name} ×${n}` + (lack.length ? ` – chybí ${lack.join(', ')}!` : ''), lack.length ? 'warn' : 'info');
      }
    }
    return n;
  }

  function costText(tool, n = 1) {
    const d = defs[tool];
    if (!d || !d.build) return '';
    const cost = BUILD[d.build].cost;
    return Object.keys(cost).map(m => `${cost[m] * n} ${ITEMS[m].name.toLowerCase()}`).join(', ');
  }

  return { defs, tilesFor, apply, costText };
})();

// ===== js/input.js =====
'use strict';
/**
 * Input – dotykové ovládání a myš:
 *  - 1 prst / levé tlačítko: s nástrojem "Výběr" posun mapy a klepnutí = výběr,
 *                            s jiným nástrojem tažení = výběr oblasti
 *  - 2 prsty: posun + zoom (pinch)
 *  - pravé / prostřední tlačítko: posun, kolečko: zoom
 *  - klávesy: mezerník pauza, 1/2/3 rychlost, WASD/šipky posun, Esc zrušit nástroj
 */
const Input = {
  pointers: new Map(),
  gesture: null,          // {type:'pending'|'pan'|'drag'|'pinch'|'dead', ...}
  drag: null,             // aktuální výběr oblasti {x0,y0,x1,y1}
  hover: null,            // políčko pod kurzorem (myš)
  keys: new Set(),

  init(cv) {
    this.cv = cv;
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.move(e));
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => this.up(e, true));
    cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') this.hover = null; });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      const f = Math.exp(-e.deltaY * 0.0015);
      Camera.setZoom(Camera.zoom * f, e.clientX, e.clientY);
    }, { passive: false });
    cv.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('keydown', e => this.key(e, true));
    window.addEventListener('keyup', e => this.key(e, false));
    // zabránit nativnímu zoomu stránky na iOS
    document.addEventListener('gesturestart', e => e.preventDefault());
  },

  down(e) {
    this.cv.setPointerCapture(e.pointerId);
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
    if (this.pointers.size === 1) {
      const pan = e.pointerType === 'mouse' && (e.button === 1 || e.button === 2);
      this.gesture = { type: pan ? 'pan' : 'pending', sx: e.clientX, sy: e.clientY, t: performance.now() };
    } else if (this.pointers.size === 2) {
      const [a, b] = [...this.pointers.values()];
      this.drag = null;
      this.gesture = {
        type: 'pinch',
        d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
        z0: Camera.zoom,
        mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2,
      };
    }
  },

  move(e) {
    if (e.pointerType === 'mouse') this.hover = Camera.screenToTile(e.clientX, e.clientY);
    const p = this.pointers.get(e.pointerId);
    if (!p) return;
    const px = p.x, py = p.y;
    p.x = e.clientX; p.y = e.clientY;
    const g = this.gesture;
    if (!g) return;
    if (g.type === 'pinch' && this.pointers.size >= 2) {
      const [a, b] = [...this.pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      Camera.pan(mx - g.mx, my - g.my);
      Camera.setZoom(g.z0 * d / g.d0, mx, my);
      g.mx = mx; g.my = my;
      return;
    }
    if (g.type === 'pending') {
      if (Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > 8) {
        if (Game.tool === 'select') g.type = 'pan';
        else {
          g.type = 'drag';
          const t = Camera.screenToTile(g.sx, g.sy);
          this.drag = { x0: t.x, y0: t.y, x1: t.x, y1: t.y };
        }
      }
    }
    if (g.type === 'pan') Camera.pan(e.clientX - px, e.clientY - py);
    if (g.type === 'drag') {
      const t = Camera.screenToTile(e.clientX, e.clientY);
      this.drag.x1 = t.x; this.drag.y1 = t.y;
      this.edgeScroll(e.clientX, e.clientY);
    }
  },

  /** Při tažení výběru u okraje obrazovky posouvat kameru. */
  edgeScroll(x, y) {
    const m = 30, s = 6;
    let dx = 0, dy = 0;
    if (x < m) dx = s; else if (x > Camera.vw - m) dx = -s;
    if (y < m + 40) dy = s; else if (y > Camera.vh - m - 120) dy = -s;
    if (dx || dy) Camera.pan(dx, dy);
  },

  up(e, cancelled) {
    const g = this.gesture;
    this.pointers.delete(e.pointerId);
    if (!g) return;
    if (g.type === 'pinch') {
      // po pinchi ignorovat zbývající prst, dokud se nezvednou všechny
      if (this.pointers.size > 0) { this.gesture = { type: 'dead' }; return; }
    }
    if (this.pointers.size > 0) return;
    if (!cancelled) {
      if (g.type === 'pending') this.tap(e.clientX, e.clientY);
      else if (g.type === 'drag' && this.drag) {
        const d = this.drag;
        const tiles = Tools.tilesFor(Game.tool, d.x0, d.y0, d.x1, d.y1);
        Tools.apply(Game.tool, tiles);
      }
    }
    this.drag = null;
    this.gesture = null;
  },

  tap(sx, sy) {
    const t = Camera.screenToTile(sx, sy);
    if (Game.tool !== 'select') {
      Tools.apply(Game.tool, Tools.tilesFor(Game.tool, t.x, t.y, t.x, t.y));
      return;
    }
    // výběr kolonisty (podle světové pozice, s tolerancí)
    const w = Camera.screenToWorld(sx, sy);
    let best = null, bd = 0.9;
    for (const c of Game.colonists) {
      const d = Math.hypot(w.x / Config.TILE - c.x, w.y / Config.TILE - (c.y - 0.35));
      if (d < bd) { bd = d; best = c; }
    }
    if (best) Game.select({ type: 'colonist', c: best });
    else if (World.inb(t.x, t.y)) Game.select({ type: 'tile', x: t.x, y: t.y });
    else Game.select(null);
  },

  key(e, down) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    const k = e.key.toLowerCase();
    if (down) {
      this.keys.add(k);
      if (k === ' ') { e.preventDefault(); Game.togglePause(); }
      else if (k === '1' || k === '2' || k === '3') Game.setSpeed(+k);
      else if (k === 'escape') { if (Game.tool !== 'select') UI.setTool('select'); else Game.select(null); }
      else if (k === '+' || k === '=') Camera.setZoom(Camera.zoom * 1.2);
      else if (k === '-') Camera.setZoom(Camera.zoom / 1.2);
    } else this.keys.delete(k);
  },

  update(dt) {
    const s = 600 * dt;
    let dx = 0, dy = 0;
    if (this.keys.has('a') || this.keys.has('arrowleft')) dx += s;
    if (this.keys.has('d') || this.keys.has('arrowright')) dx -= s;
    if (this.keys.has('w') || this.keys.has('arrowup')) dy += s;
    if (this.keys.has('s') || this.keys.has('arrowdown')) dy -= s;
    if (dx || dy) Camera.pan(dx, dy);
  },
};

// ===== js/renderer.js =====
'use strict';
/**
 * Renderer – vykreslování mapy, objektů, kolonistů, osvětlení (den/noc) a počasí.
 * Kreslí se v pixelech zařízení se zaokrouhlením na společnou mřížku → bez švů mezi políčky.
 */
const Renderer = {
  init(cv) {
    this.cv = cv;
    this.ctx = cv.getContext('2d');
    this.light = document.createElement('canvas');
    this.lctx = this.light.getContext('2d');
    this.time = 0;
    this.rain = [];
    this.splash = [];
    this.clouds = [];
    for (let k = 0; k < 14; k++) {
      this.clouds.push({ x: U.rand() * World.w * 16, y: U.rand() * World.h * 16, r: U.range(90, 220), s: U.range(0.6, 1.2) });
    }
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    this.cv.width = Math.round(w * this.dpr);
    this.cv.height = Math.round(h * this.dpr);
    this.cv.style.width = w + 'px';
    this.cv.style.height = h + 'px';
    this.light.width = Math.ceil(this.cv.width / 4);
    this.light.height = Math.ceil(this.cv.height / 4);
    Camera.resize(w, h);
  },

  // --- převody světových pixelů na pixely zařízení ---
  X(wx) { return Math.round(this.ox + wx * this.z); },
  Y(wy) { return Math.round(this.oy + wy * this.z); },
  img(im, wx, wy, ww, wh) {
    const x0 = this.X(wx), y0 = this.Y(wy);
    this.ctx.drawImage(im, x0, y0, this.X(wx + ww) - x0, this.Y(wy + wh) - y0);
  },
  rect(wx, wy, ww, wh, col) {
    const x0 = this.X(wx), y0 = this.Y(wy);
    this.ctx.fillStyle = col;
    this.ctx.fillRect(x0, y0, this.X(wx + ww) - x0, this.Y(wy + wh) - y0);
  },

  draw(dt) {
    const ctx = this.ctx, TS = Config.TILE;
    this.time += dt;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, this.cv.width, this.cv.height);

    this.z = Camera.zoom * this.dpr;
    this.ox = Math.round(this.cv.width / 2 - Camera.x * this.z);
    this.oy = Math.round(this.cv.height / 2 - Camera.y * this.z);
    const tz = TS * this.z;
    const tx0 = Math.max(0, Math.floor(-this.ox / tz) - 1);
    const ty0 = Math.max(0, Math.floor(-this.oy / tz) - 1);
    const tx1 = Math.min(World.w - 1, Math.ceil((this.cv.width - this.ox) / tz));
    const ty1 = Math.min(World.h - 1, Math.ceil((this.cv.height - this.oy) / tz));
    this.view = { tx0, ty0, tx1, ty1 };

    // 1) terén
    const sx = tx0 * TS, sy = ty0 * TS, sw = (tx1 - tx0 + 1) * TS, sh = (ty1 - ty0 + 1) * TS;
    const dx0 = this.X(sx), dy0 = this.Y(sy);
    ctx.drawImage(Sprites.terrain, sx, sy, sw, sh, dx0, dy0, this.X(sx + sw) - dx0, this.Y(sy + sh) - dy0);

    this.drawGround(tx0, ty0, tx1, ty1);
    this.drawRows(tx0, ty0, tx1, ty1);
    this.drawOverlays(tx0, ty0, tx1, ty1);
    this.drawClouds();
    this.drawLighting();
    this.drawWeather(dt);
    this.drawLabels();
    this.drawPreview();
  },

  // ---------- Vrstva země: vodní lesk, zóny, podlahy, pole, předměty ----------
  drawGround(tx0, ty0, tx1, ty1) {
    const ctx = this.ctx, TS = Config.TILE, W = World.w, t = this.time;
    const showGrid = Game.tool !== 'select';
    for (let y = ty0; y <= ty1; y++) {
      for (let x = tx0; x <= tx1; x++) {
        const i = y * W + x, wx = x * TS, wy = y * TS;
        const ter = World.terrain[i];
        if ((ter === T.WATER || ter === T.SHALLOW) && Camera.zoom > 1.4) {
          const h = U.hash2(x, y, 3);
          const a = Math.sin(t * 1.6 + h * 12);
          if (a > 0.6) this.rect(wx + 2 + h * 9, wy + 3 + (h * 37 % 9), 4, 1, `rgba(200,230,255,${(a - 0.6) * 0.8})`);
        }
        const z = World.zone[i];
        if (z === 2) {
          if (!World.crops[i]) this.rect(wx, wy, TS, TS, 'rgba(120,200,80,0.16)');
        }
        const fl = World.floor[i];
        if (fl) this.img(Sprites.build[fl.type], wx, wy, TS, TS);
        if (z === 1) this.rect(wx, wy, TS, TS, 'rgba(240,200,90,0.16)');
        const cr = World.crops[i];
        if (cr) {
          this.img(Sprites.tilled, wx, wy, TS, TS);
          const st = cr.g >= 1 ? 3 : cr.g > 0.6 ? 2 : cr.g > 0.25 ? 1 : 0;
          this.img(Sprites.crop[st], wx, wy, TS, TS);
        }
        const bp = World.bp[i];
        if (bp && BUILD[bp.type].layer === 'floor') this.drawBlueprint(bp, wx, wy);
        if (showGrid) {
          this.rect(wx, wy, TS, 0.5 / Camera.zoom * 1.2, 'rgba(255,255,255,0.07)');
          this.rect(wx, wy, 0.5 / Camera.zoom * 1.2, TS, 'rgba(255,255,255,0.07)');
        }
      }
    }
    // okraje zón
    for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
      const i = y * W + x, z = World.zone[i];
      if (!z) continue;
      const col = z === 1 ? 'rgba(250,210,100,0.75)' : 'rgba(140,220,100,0.6)';
      const wx = x * TS, wy = y * TS, th = 1;
      if (y === 0 || World.zone[i - W] !== z) this.rect(wx, wy, TS, th, col);
      if (y === World.h - 1 || World.zone[i + W] !== z) this.rect(wx, wy + TS - th, TS, th, col);
      if (x === 0 || World.zone[i - 1] !== z) this.rect(wx, wy, th, TS, col);
      if (x === World.w - 1 || World.zone[i + 1] !== z) this.rect(wx + TS - th, wy, th, TS, col);
    }
    // předměty
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    const fs = Math.round(U.clamp(5.5 * this.z, 9, 19 * this.dpr));
    ctx.font = `${fs}px VT323, monospace`;
    for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) {
      const it = World.items[y * W + x];
      if (!it) continue;
      const wx = x * TS, wy = y * TS;
      this.img(Sprites.items[it.type], wx + 1, wy, 14, 14);
      if (Camera.zoom >= 1.6) {
        const s = String(it.n);
        const px = this.X(wx + TS - 0.5), py = this.Y(wy + TS + 0.5);
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillText(s, px + 1, py + 1);
        ctx.fillStyle = '#fff';
        ctx.fillText(s, px, py);
      }
    }
  },

  drawBlueprint(bp, wx, wy) {
    const TS = Config.TILE, ctx = this.ctx;
    ctx.globalAlpha = 0.45;
    this.img(Sprites.build[bp.type], wx, wy, TS, TS);
    ctx.globalAlpha = 1;
    this.rect(wx, wy, TS, TS, 'rgba(80,160,255,0.28)');
    const x0 = this.X(wx), y0 = this.Y(wy);
    ctx.strokeStyle = 'rgba(140,200,255,0.9)';
    ctx.lineWidth = Math.max(1, this.z * 0.6);
    ctx.setLineDash([this.z * 2, this.z * 2]);
    ctx.strokeRect(x0 + 1, y0 + 1, this.X(wx + TS) - x0 - 2, this.Y(wy + TS) - y0 - 2);
    ctx.setLineDash([]);
    // dodaný materiál
    const cost = BUILD[bp.type].cost;
    let tot = 0, del = 0;
    for (const m in cost) { tot += cost[m]; del += Math.min(cost[m], bp.del[m] || 0); }
    if (del < tot) {
      this.rect(wx + 2, wy + TS - 3, 12, 2, 'rgba(0,0,0,0.6)');
      this.rect(wx + 2, wy + TS - 3, 12 * del / tot, 2, '#8fd0ff');
    }
  },

  // ---------- Řádkové vykreslení (správné překrývání stromů, zdí, kolonistů) ----------
  drawRows(tx0, ty0, tx1, ty1) {
    const TS = Config.TILE, W = World.w;
    const byRow = new Map();
    for (const c of Game.colonists) {
      const r = Math.floor(c.y);
      if (!byRow.has(r)) byRow.set(r, []);
      byRow.get(r).push(c);
    }
    const yEnd = Math.min(World.h - 1, ty1 + 2);
    for (let y = ty0; y <= yEnd; y++) {
      for (let x = tx0; x <= tx1; x++) {
        const i = y * W + x, wx = x * TS, wy = y * TS;
        const o = World.obj[i];
        if (o) this.drawObj(o, i, x, y, wx, wy);
        const s = World.struct[i];
        if (s) this.drawStruct(s, i, x, y, wx, wy);
        const bp = World.bp[i];
        if (bp && BUILD[bp.type].layer === 'struct') this.drawBlueprint(bp, wx, wy);
      }
      const cs = byRow.get(y);
      if (cs) { cs.sort((a, b) => a.y - b.y); for (const c of cs) this.drawColonist(c); }
    }
  },

  drawObj(o, i, x, y, wx, wy) {
    const TS = Config.TILE, v = World.variant[i];
    if (o.type === 'tree') {
      const spr = Sprites.trees[v % Sprites.trees.length];
      const sc = o.size;
      const w = 20 * sc, h = 28 * sc;
      // lehké pohupování ve větru
      this.img(spr, wx + 8 - w / 2, wy + TS + 2 - h, w, h);
    } else if (o.type === 'bush') {
      this.img(o.berries ? Sprites.bush : Sprites.bushEmpty, wx, wy, TS, TS);
    } else {
      const arr = o.type === 'ore' ? Sprites.ores : Sprites.rocks;
      this.img(arr[v % arr.length], wx, wy, TS, TS);
      const isRock = (xx, yy) => { if (!World.inb(xx, yy)) return true; const q = World.obj[yy * World.w + xx]; return !!q && (q.type === 'rock' || q.type === 'ore'); };
      if (!isRock(x, y - 1)) { this.rect(wx, wy, TS, 2, 'rgba(200,196,188,0.55)'); }
      if (!isRock(x, y + 1)) { this.rect(wx, wy + TS - 4, TS, 4, 'rgba(40,36,34,0.55)'); this.rect(wx, wy + TS, TS, 3, 'rgba(0,0,0,0.25)'); }
      if (!isRock(x - 1, y)) this.rect(wx, wy, 1.5, TS, 'rgba(60,56,52,0.6)');
      if (!isRock(x + 1, y)) this.rect(wx + TS - 1.5, wy, 1.5, TS, 'rgba(40,36,34,0.6)');
    }
  },

  drawStruct(s, i, x, y, wx, wy) {
    const TS = Config.TILE, def = BUILD[s.type];
    if (def.wall) {
      this.img(Sprites.build[s.type], wx, wy, TS, TS);
      const isWall = (xx, yy) => { if (!World.inb(xx, yy)) return false; const q = World.struct[yy * World.w + xx]; return !!q && (BUILD[q.type].wall || BUILD[q.type].door); };
      if (!isWall(x, y + 1)) { this.rect(wx, wy + TS - 4, TS, 4, 'rgba(0,0,0,0.35)'); this.rect(wx, wy + TS, TS, 3, 'rgba(0,0,0,0.22)'); }
      if (!isWall(x, y - 1)) this.rect(wx, wy, TS, 1.5, 'rgba(255,255,255,0.25)');
      if (!isWall(x - 1, y)) this.rect(wx, wy, 1, TS, 'rgba(0,0,0,0.3)');
      if (!isWall(x + 1, y)) this.rect(wx + TS - 1, wy, 1, TS, 'rgba(0,0,0,0.3)');
    } else if (s.type === 'door') {
      const open = Game.colonists.some(c => Math.abs(c.x - (x + 0.5)) < 1 && Math.abs(c.y - (y + 0.5)) < 1);
      this.img(open ? Sprites.build.door_open : Sprites.build.door, wx, wy, TS, TS);
    } else if (s.type === 'campfire') {
      this.img(Sprites.build.campfire, wx, wy, TS, TS);
      this.drawFlame(wx + 8, wy + 9);
    } else {
      this.img(Sprites.build[s.type], wx, wy, TS, TS);
    }
    if (s.decon) this.img(Sprites.des.decon, wx + 4, wy + 4, 8, 8);
  },

  drawFlame(cx, cy) {
    const t = this.time * 9;
    const cols = ['#ff5a1f', '#ff9a2e', '#ffd257', '#fff3b0'];
    for (let k = 0; k < 7; k++) {
      const off = (k - 3) * 1.1;
      const hgt = 3 + Math.abs(Math.sin(t * 0.7 + k * 1.7)) * 4 * (1 - Math.abs(k - 3) / 4.5);
      this.rect(cx + off - 0.5, cy - hgt, 1.2, hgt, cols[0]);
      this.rect(cx + off * 0.7 - 0.5, cy - hgt * 0.7, 1, hgt * 0.7, cols[1]);
      if (Math.abs(k - 3) < 2) this.rect(cx + off * 0.5 - 0.5, cy - hgt * 0.45, 1, hgt * 0.45, cols[2]);
    }
    this.rect(cx - 0.5, cy - 2, 1, 1.5, cols[3]);
    // jiskry
    for (let k = 0; k < 3; k++) {
      const p = (this.time * 0.8 + k / 3) % 1;
      this.rect(cx + Math.sin(k * 5 + this.time * 3) * 3, cy - 6 - p * 12, 0.8, 0.8, `rgba(255,200,90,${1 - p})`);
    }
  },

  drawColonist(c) {
    const TS = Config.TILE, ctx = this.ctx;
    const wx = c.x * TS, wy = c.y * TS;
    const sel = Game.selected && Game.selected.c === c;
    // stín
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(this.X(wx), this.Y(wy + 4), 5 * this.z, 2 * this.z, 0, 0, Math.PI * 2);
    ctx.fill();
    if (sel) {
      ctx.strokeStyle = '#ffe36e';
      ctx.lineWidth = Math.max(1.5, this.z * 0.7);
      ctx.beginPath();
      ctx.ellipse(this.X(wx), this.Y(wy + 4), 7 * this.z, 3.2 * this.z, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (c.sleeping) {
      const x0 = this.X(wx), y0 = this.Y(wy + 1);
      ctx.save();
      ctx.translate(x0, y0);
      ctx.rotate(-Math.PI / 2);
      const s = Math.round(16 * this.z);
      ctx.drawImage(c.sprites.down[0], -s / 2, -s / 2, s, s);
      ctx.restore();
      // blanket na posteli
      const i = World.idx(c.tx, c.ty);
      if (World.struct[i] && World.struct[i].type === 'bed') this.rect(c.tx * TS + 2, c.ty * TS + 7, 12, 8, 'rgba(62,98,168,0.95)');
      const p = (this.time * 0.6) % 1;
      ctx.fillStyle = `rgba(255,255,255,${1 - p})`;
      ctx.font = `${Math.round(5 * this.z)}px VT323, monospace`;
      ctx.textAlign = 'left';
      ctx.fillText('z', this.X(wx + 3 + p * 4), this.Y(wy - 6 - p * 8));
      ctx.fillText('Z', this.X(wx + 6 + p * 5), this.Y(wy - 11 - p * 9));
      return;
    }
    let frame = 0, bob = 0;
    if (c.moving) { frame = 1 + (Math.floor(c.animT * 3.2) % 2); bob = frame === 1 ? -0.5 : 0; }
    const working = c.working && !c.moving;
    if (working) bob = Math.sin(this.time * 14) > 0 ? -0.6 : 0;
    this.img(c.sprites[c.dir][frame], wx - 8, wy - 12 + bob, 16, 16);
    if (working) {
      const sw = Math.sin(this.time * 14);
      const hx = c.dir === 'left' ? wx - 7 : c.dir === 'right' ? wx + 4 : wx + 3;
      this.rect(hx, wy - 5 - sw * 2, 1.2, 4, '#8a5a30');
      this.rect(hx - 1, wy - 6 - sw * 2, 3, 1.5, '#c9ccd4');
    }
    if (c.carry) this.img(Sprites.items[c.carry.type], wx - 4, wy - 17, 8, 8);
    if (c.workFrac >= 0 && (c.working || c.eating)) {
      this.rect(wx - 7, wy - 16 - (c.carry ? 6 : 0), 14, 2.2, 'rgba(0,0,0,0.65)');
      this.rect(wx - 6.5, wy - 15.6 - (c.carry ? 6 : 0), 13 * U.clamp(c.workFrac, 0, 1), 1.4, c.eating ? '#ffb347' : '#7ee07e');
    }
    if (c.inBreak()) {
      ctx.fillStyle = '#ff6060';
      ctx.font = `bold ${Math.round(7 * this.z)}px VT323, monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('!', this.X(wx), this.Y(wy - 15));
    }
  },

  // ---------- Označení, výběr ----------
  drawOverlays(tx0, ty0, tx1, ty1) {
    const TS = Config.TILE;
    for (const i of World.desSet) {
      const x = i % World.w, y = (i / World.w) | 0;
      if (x < tx0 || x > tx1 || y < ty0 || y > ty1) continue;
      const o = World.obj[i];
      if (!o || !o.des) continue;
      const wx = x * TS, wy = y * TS;
      if (o.des === 'harvest' && !o.berries) { this.ctx.globalAlpha = 0.4; }
      this.rect(wx + 4, wy + 4, 8, 8, 'rgba(0,0,0,0.35)');
      this.img(Sprites.des[o.des], wx + 3.5, wy + 3.5, 9, 9);
      this.ctx.globalAlpha = 1;
    }
    for (const i of World.deconSet) {
      const x = i % World.w, y = (i / World.w) | 0;
      if (World.floor[i] && World.floor[i].decon && !World.struct[i]) this.img(Sprites.des.decon, x * TS + 4, y * TS + 4, 8, 8);
    }
    const s = Game.selected;
    if (s && s.type === 'tile') {
      const ctx = this.ctx, x0 = this.X(s.x * TS), y0 = this.Y(s.y * TS);
      ctx.strokeStyle = '#ffe36e';
      ctx.lineWidth = Math.max(2, this.z * 0.8);
      ctx.strokeRect(x0, y0, this.X((s.x + 1) * TS) - x0, this.Y((s.y + 1) * TS) - y0);
    }
  },

  // ---------- Náhled tažení nástroje ----------
  drawPreview() {
    const tool = Game.tool;
    if (tool === 'select') return;
    const d = Tools.defs[tool];
    let tiles = null;
    if (Input.drag) tiles = Tools.tilesFor(tool, Input.drag.x0, Input.drag.y0, Input.drag.x1, Input.drag.y1);
    else if (Input.hover && World.inb(Input.hover.x, Input.hover.y)) tiles = [World.idx(Input.hover.x, Input.hover.y)];
    if (!tiles) return;
    const TS = Config.TILE, ctx = this.ctx;
    let ok = 0;
    for (const i of tiles) {
      const x = i % World.w, y = (i / World.w) | 0, wx = x * TS, wy = y * TS;
      const valid = d.valid(i);
      if (valid) ok++;
      if (d.build && valid) {
        ctx.globalAlpha = 0.6;
        this.img(Sprites.build[d.build], wx, wy, TS, TS);
        ctx.globalAlpha = 1;
      }
      this.rect(wx, wy, TS, TS, valid ? 'rgba(120,230,140,0.30)' : 'rgba(255,80,80,0.25)');
    }
    if (Input.drag) {
      const dr = Input.drag;
      const ax = Math.min(dr.x0, dr.x1), ay = Math.min(dr.y0, dr.y1), bx = Math.max(dr.x0, dr.x1), by = Math.max(dr.y0, dr.y1);
      const x0 = this.X(ax * TS), y0 = this.Y(ay * TS);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x0, y0, this.X((bx + 1) * TS) - x0, this.Y((by + 1) * TS) - y0);
      const label = `${bx - ax + 1}×${by - ay + 1}  ✔ ${ok}` + (d.build ? `  (${Tools.costText(tool, ok)})` : '');
      ctx.font = `${Math.round(18 * this.dpr)}px VT323, monospace`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(20,16,12,0.85)';
      ctx.fillRect(x0, y0 - 22 * this.dpr, tw + 10 * this.dpr, 20 * this.dpr);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, x0 + 5 * this.dpr, y0 - 4 * this.dpr);
    }
  },

  // ---------- Stíny mraků ----------
  drawClouds() {
    const a = Weather.cloud * 0.16;
    if (a < 0.01) return;
    const ctx = this.ctx, mw = World.w * 16, mh = World.h * 16;
    for (const c of this.clouds) {
      c.x += Weather.wind * c.s * 0.25 * Game.speed;
      c.y += 0.05 * c.s * Game.speed;
      if (c.x > mw + c.r) c.x = -c.r; if (c.x < -c.r) c.x = mw + c.r;
      if (c.y > mh + c.r) c.y = -c.r;
      const x = this.X(c.x), y = this.Y(c.y), r = c.r * this.z;
      if (x + r < 0 || y + r < 0 || x - r > this.cv.width || y - r > this.cv.height) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(10,14,30,${a})`);
      g.addColorStop(1, 'rgba(10,14,30,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  },

  // ---------- Den a noc ----------
  lightSources() {
    const out = [];
    for (const i of World.structSet) {
      const s = World.struct[i];
      const def = s && BUILD[s.type];
      if (def && def.light) out.push({ x: (i % World.w) + 0.5, y: ((i / World.w) | 0) + 0.5, r: def.light, fire: s.type === 'campfire' });
    }
    return out;
  },
  drawLighting() {
    const ctx = this.ctx, W = this.cv.width, Hh = this.cv.height;
    const day = TimeSys.daylight();
    const dark = U.clamp((1 - day) * 0.87 + Weather.cloud * 0.1 + Weather.rain * 0.08, 0, 0.88);
    const dusk = TimeSys.dusk();
    if (dusk > 0.01) {
      ctx.fillStyle = `rgba(255,120,40,${0.13 * dusk})`;
      ctx.fillRect(0, 0, W, Hh);
    }
    if (dark < 0.02) return;
    const L = this.lctx, lw = this.light.width, lh = this.light.height, k = lw / W;
    L.globalCompositeOperation = 'source-over';
    L.clearRect(0, 0, lw, lh);
    L.fillStyle = `rgba(6,10,32,${dark})`;
    L.fillRect(0, 0, lw, lh);
    L.globalCompositeOperation = 'destination-out';
    const TS = Config.TILE;
    const lights = this.lightSources();
    for (const l of lights) {
      const flick = l.fire ? 1 + Math.sin(this.time * 7 + l.x) * 0.04 + Math.sin(this.time * 13) * 0.03 : 1;
      const x = this.X(l.x * TS) * k, y = this.Y(l.y * TS) * k, r = l.r * TS * this.z * k * flick;
      const g = L.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.5, 'rgba(0,0,0,0.75)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      L.fillStyle = g;
      L.fillRect(x - r, y - r, r * 2, r * 2);
    }
    for (const c of Game.colonists) {
      const x = this.X(c.x * TS) * k, y = this.Y(c.y * TS) * k, r = 2.2 * TS * this.z * k;
      const g = L.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,0.45)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      L.fillStyle = g;
      L.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.light, 0, 0, W, Hh);
    ctx.imageSmoothingEnabled = false;
    // teplá záře ohně
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lights) {
      const x = this.X(l.x * TS), y = this.Y(l.y * TS), r = l.r * 0.8 * TS * this.z;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const a = (l.fire ? 0.28 : 0.18) * dark;
      g.addColorStop(0, l.fire ? `rgba(255,150,50,${a})` : `rgba(255,220,140,${a})`);
      g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  },

  // ---------- Počasí ----------
  drawWeather(dt) {
    const ctx = this.ctx, W = this.cv.width, Hh = this.cv.height;
    const simDt = dt * Math.max(Game.speed, 0.05);
    const want = Math.floor(Weather.rain * (W * Hh) / (this.dpr * this.dpr) / 2600);
    while (this.rain.length < want) this.rain.push(this.newDrop(true));
    if (this.rain.length > want) this.rain.length = want;
    if (this.rain.length) {
      const wind = Weather.wind * 0.35;
      ctx.strokeStyle = 'rgba(180,200,240,0.5)';
      ctx.lineWidth = Math.max(1, this.dpr);
      ctx.beginPath();
      for (const d of this.rain) {
        d.y += d.v * simDt * this.dpr;
        d.x += d.v * wind * simDt * this.dpr;
        if (d.y > d.end) {
          if (this.splash.length < 200) this.splash.push({ x: d.x, y: d.y, t: 0 });
          Object.assign(d, this.newDrop(false));
        }
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - d.l * wind, d.y - d.l);
      }
      ctx.stroke();
    }
    if (this.splash.length) {
      ctx.fillStyle = 'rgba(200,220,255,0.55)';
      for (const s of this.splash) {
        s.t += simDt * 6;
        const r = s.t * 3 * this.dpr;
        ctx.fillRect(s.x - r, s.y, 1 * this.dpr, 1 * this.dpr);
        ctx.fillRect(s.x + r, s.y, 1 * this.dpr, 1 * this.dpr);
      }
      this.splash = this.splash.filter(s => s.t < 1);
    }
    if (Weather.rain > 0.05) {
      ctx.fillStyle = `rgba(60,70,90,${Weather.rain * 0.12})`;
      ctx.fillRect(0, 0, W, Hh);
    }
    if (Weather.fog > 0.02) {
      ctx.fillStyle = `rgba(200,206,214,${Weather.fog * 0.28})`;
      ctx.fillRect(0, 0, W, Hh);
      for (let k = 0; k < 5; k++) {
        const x = ((this.time * 12 * (k + 1) + k * 400) % (W + 800)) - 400, y = (Hh / 5) * k + Hh / 10;
        const r = 380 * this.dpr;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(220,226,232,${Weather.fog * 0.25})`);
        g.addColorStop(1, 'rgba(220,226,232,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }
    if (Weather.flash > 0) {
      ctx.fillStyle = `rgba(235,240,255,${Weather.flash * 0.55})`;
      ctx.fillRect(0, 0, W, Hh);
    }
  },
  newDrop(anyY) {
    const W = this.cv.width, Hh = this.cv.height;
    const y = anyY ? U.rand() * Hh : -20;
    return { x: U.rand() * (W + 200) - 100, y, v: U.range(700, 1000), l: U.range(8, 14) * this.dpr, end: y + U.range(80, Hh) };
  },

  // ---------- Jmenovky ----------
  drawLabels() {
    const ctx = this.ctx, TS = Config.TILE;
    const show = Camera.zoom >= 1.7;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.font = `${Math.round(15 * this.dpr)}px VT323, monospace`;
    for (const c of Game.colonists) {
      const sel = Game.selected && Game.selected.c === c;
      if (!show && !sel) continue;
      const x = this.X(c.x * TS), y = this.Y(c.y * TS + 5);
      const t = c.first;
      const w = ctx.measureText(t).width + 8 * this.dpr;
      ctx.fillStyle = sel ? 'rgba(80,60,10,0.85)' : 'rgba(15,12,10,0.65)';
      ctx.fillRect(x - w / 2, y, w, 15 * this.dpr);
      ctx.fillStyle = sel ? '#ffe36e' : '#f0e8d8';
      ctx.fillText(t, x, y + 1 * this.dpr);
    }
  },
};

// ===== js/ui.js =====
'use strict';
/**
 * UI – DOM rozhraní: horní lišta (čas, počasí, zásoby, rychlost), panel kolonistů,
 * informační panel, spodní dotykové menu nástrojů, okno priorit a notifikace.
 */
const UI = {
  TABS: [
    { id: 'orders', label: 'Příkazy', icon: 'chop', tools: ['select', 'chop', 'mine', 'harvest', 'decon', 'cancel'] },
    { id: 'build', label: 'Stavba', icon: 'wall_wood', tools: ['wall_wood', 'wall_stone', 'door', 'floor_wood', 'floor_stone', 'bed', 'campfire', 'lamp'] },
    { id: 'zones', label: 'Zóny', icon: 'zone_farm', tools: ['zone_stock', 'zone_farm', 'zone_clear'] },
    { id: 'work', label: 'Práce', icon: 'priorities', action: () => UI.openPriorities() },
    { id: 'menu', label: 'Menu', icon: 'menu', action: () => UI.openMenu() },
  ],
  tab: 'orders',
  icons: {},
  toastQ: [],

  $(id) { return document.getElementById(id); },
  el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  },
  icon(name) {
    if (!this.icons[name]) {
      const src = Sprites.icons[name] || Sprites.items[name] || Sprites.build[name];
      this.icons[name] = src ? Sprites.toURL(src, 3) : '';
    }
    return this.icons[name];
  },
  imgTag(name, cls = 'pix') { return `<img class="${cls}" src="${this.icon(name)}" alt="">`; },

  init() {
    // zásoby
    const res = this.$('resources');
    res.innerHTML = '';
    for (const k of ITEM_ORDER) {
      const chip = this.el('div', 'res', `${this.imgTag(k)}<span id="res-${k}">0</span>`);
      chip.title = ITEMS[k].name;
      res.appendChild(chip);
    }
    // rychlost
    const sp = this.$('speed');
    sp.innerHTML = '';
    [[0, '❚❚'], [1, '▶'], [2, '▶▶'], [3, '▶▶▶']].forEach(([s, l]) => {
      const b = this.el('button', 'spd', l);
      b.dataset.speed = s;
      b.onclick = () => Game.setSpeed(s);
      sp.appendChild(b);
    });
    this.buildColonistBar();
    this.buildTabs();
    this.setTab('orders');
    this.updateSpeed();
    this.$('hintClose').onclick = () => this.setTool('select');
    this.update();
  },

  // ---------- Spodní menu ----------
  buildTabs() {
    const row = this.$('tabRow');
    row.innerHTML = '';
    for (const t of this.TABS) {
      const b = this.el('button', 'tab', `${this.imgTag(t.icon)}<span>${t.label}</span>`);
      b.dataset.tab = t.id;
      b.onclick = () => t.action ? t.action() : this.setTab(t.id);
      row.appendChild(b);
    }
  },
  setTab(id) {
    this.tab = id;
    for (const b of this.$('tabRow').children) b.classList.toggle('active', b.dataset.tab === id);
    const tab = this.TABS.find(t => t.id === id);
    const row = this.$('toolRow');
    row.innerHTML = '';
    for (const tool of tab.tools) {
      const d = Tools.defs[tool];
      const cost = Tools.costText(tool);
      const b = this.el('button', 'tool', `${this.imgTag(tool)}<span class="tname">${d.name}</span>` + (cost ? `<span class="tcost">${cost}</span>` : ''));
      b.dataset.tool = tool;
      b.onclick = () => this.setTool(Game.tool === tool && tool !== 'select' ? 'select' : tool);
      row.appendChild(b);
    }
    this.markTool();
  },
  setTool(tool) {
    Game.tool = tool;
    Input.drag = null;
    this.markTool();
    const hint = this.$('toolHint');
    if (tool === 'select') hint.classList.add('hidden');
    else {
      hint.classList.remove('hidden');
      const d = Tools.defs[tool];
      this.$('hintText').innerHTML = `<b>${d.name}</b> – ${d.hint || ''}` + (d.build ? ` <i>Cena: ${Tools.costText(tool)}</i>` : '');
    }
  },
  markTool() {
    for (const b of this.$('toolRow').children) b.classList.toggle('active', b.dataset.tool === Game.tool);
  },

  updateSpeed() {
    for (const b of this.$('speed').children) b.classList.toggle('active', +b.dataset.speed === Game.speed);
    document.body.classList.toggle('paused', Game.speed === 0);
  },

  // ---------- Kolonisté ----------
  buildColonistBar() {
    const bar = this.$('colonistBar');
    bar.innerHTML = '';
    for (const c of Game.colonists) {
      const card = this.el('div', 'ccard');
      card.innerHTML = `<img class="pix portrait" src="${Sprites.toURL(c.portrait, 4)}" alt="">
        <div class="cinfo"><div class="cname">${c.first}</div>
        <div class="mini"><i class="b-food"></i></div><div class="mini"><i class="b-energy"></i></div><div class="mini"><i class="b-mood"></i></div></div>`;
      card.onclick = () => {
        if (Game.selected && Game.selected.c === c) Camera.follow = Camera.follow === c ? null : c;
        Game.select({ type: 'colonist', c });
        Camera.centerOn(c.x * Config.TILE, c.y * Config.TILE);
      };
      c.card = card;
      bar.appendChild(card);
    }
  },
  updateColonistBar() {
    for (const c of Game.colonists) {
      const card = c.card;
      if (!card) continue;
      card.querySelector('.b-food').style.width = c.hunger + '%';
      card.querySelector('.b-energy').style.width = c.energy + '%';
      const m = card.querySelector('.b-mood');
      m.style.width = c.mood + '%';
      m.style.background = this.moodColor(c.mood);
      card.classList.toggle('sel', !!(Game.selected && Game.selected.c === c));
      card.classList.toggle('alert', c.hunger < 15 || c.energy < 10 || c.inBreak());
      card.title = `${c.name} – ${c.activity}`;
    }
  },
  moodColor(m) { return m < 25 ? '#e5534b' : m < 45 ? '#e3a23b' : m < 70 ? '#cfd65a' : '#6fd36f'; },
  moodLabel(m) { return m < 15 ? 'Na pokraji zhroucení' : m < 30 ? 'Nešťastný/á' : m < 45 ? 'Ve stresu' : m < 60 ? 'V pohodě' : m < 80 ? 'Spokojený/á' : 'Šťastný/á'; },

  // ---------- Informační panel ----------
  updateInfo(force) {
    const p = this.$('infoPanel');
    const s = Game.selected;
    if (!s) { p.classList.add('hidden'); return; }
    p.classList.remove('hidden');
    if (s.type === 'colonist') this.colonistInfo(p, s.c, force);
    else this.tileInfo(p, s.x, s.y);
  },
  bar(label, val, color) {
    return `<div class="stat"><span>${label}</span><div class="bar"><i style="width:${U.clamp(val, 0, 100)}%;background:${color}"></i></div><b>${Math.round(val)}</b></div>`;
  },
  colonistInfo(p, c, force) {
    if (force || p.dataset.kind !== 'c' + c.id) {
      p.dataset.kind = 'c' + c.id;
      p.innerHTML = `<div class="phead"><img class="pix portrait" src="${Sprites.toURL(c.portrait, 4)}" alt="">
        <div><div class="ptitle">${c.name}</div><div class="psub">${c.age} let · ${c.trait.name} <small>(${c.trait.desc})</small></div></div>
        <button class="x" id="infoClose">✕</button></div>
        <div class="pact" id="pAct"></div>
        <div id="pNeeds"></div>
        <div class="psec">Dovednosti</div><div id="pSkills"></div>
        <div class="psec">Nálada – vlivy</div><div id="pThoughts" class="thoughts"></div>
        <div class="pbtns"><button id="pFollow">Sledovat</button><button id="pPrio">Priority práce</button></div>`;
      this.$('infoClose').onclick = () => Game.select(null);
      this.$('pFollow').onclick = () => { Camera.follow = Camera.follow === c ? null : c; };
      this.$('pPrio').onclick = () => this.openPriorities();
    }
    this.$('pAct').textContent = (c.carry ? `[${ITEMS[c.carry.type].name} ×${c.carry.n}] ` : '') + c.activity;
    this.$('pFollow').textContent = Camera.follow === c ? 'Nesledovat' : 'Sledovat';
    this.$('pNeeds').innerHTML =
      this.bar('Sytost', c.hunger, '#e3a23b') +
      this.bar('Energie', c.energy, '#58a6ff') +
      this.bar('Nálada', c.mood, this.moodColor(c.mood)) +
      `<div class="moodl">${this.moodLabel(c.mood)}</div>`;
    let sk = '';
    for (const k in SKILLS) {
      const s = c.skills[k];
      const pct = s.xp / c.xpNeed(s.lvl) * 100;
      sk += `<div class="skill"><span>${SKILLS[k]}</span><div class="sbar"><i style="width:${s.lvl / 20 * 100}%"></i><u style="width:${pct}%"></u></div><b>${s.lvl}</b></div>`;
    }
    this.$('pSkills').innerHTML = sk;
    this.$('pThoughts').innerHTML = c.moodFactors().map(f =>
      `<div class="th ${f.val >= 0 ? 'pos' : 'neg'}"><span>${f.label}</span><b>${f.val > 0 ? '+' : ''}${f.val}</b></div>`).join('');
  },
  tileInfo(p, x, y) {
    p.dataset.kind = 't';
    const i = World.idx(x, y);
    const ter = TERRAIN[World.terrain[i]];
    const rows = [];
    rows.push(['Terén', ter.name]);
    if (ter.fert > 0) rows.push(['Úrodnost', Math.round(ter.fert * 100) + ' %']);
    const o = World.obj[i];
    if (o) {
      let t = OBJECTS[o.type].name;
      if (o.type === 'bush') t += o.berries ? ' (zralé bobule)' : ' (dorůstá)';
      if (o.type === 'tree') t += ` (${Math.round(o.size * 100)} %)`;
      if (o.des) t += ' – ' + { chop: 'ke kácení', mine: 'k těžbě', harvest: 'ke sběru' }[o.des];
      rows.push(['Objekt', t]);
    }
    if (World.struct[i]) rows.push(['Stavba', BUILD[World.struct[i].type].name + (World.struct[i].decon ? ' (k bourání)' : '')]);
    if (World.floor[i]) rows.push(['Podlaha', BUILD[World.floor[i].type].name]);
    const bp = World.bp[i];
    if (bp) {
      const cost = BUILD[bp.type].cost;
      rows.push(['Plán', BUILD[bp.type].name]);
      rows.push(['Materiál', Object.keys(cost).map(m => `${ITEMS[m].name} ${bp.del[m] || 0}/${cost[m]}`).join(', ')]);
    }
    const cr = World.crops[i];
    if (cr) rows.push(['Brambory', cr.g >= 1 ? 'zralé ke sklizni' : `roste ${Math.round(cr.g * 100)} %`]);
    const it = World.items[i];
    if (it) rows.push(['Předmět', `${ITEMS[it.type].name} ×${it.n}`]);
    if (World.zone[i]) rows.push(['Zóna', World.zone[i] === 1 ? 'Sklad' : 'Pole']);
    p.innerHTML = `<div class="phead"><div><div class="ptitle">Políčko ${x}, ${y}</div></div><button class="x" id="infoClose">✕</button></div>
      <table class="ttab">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    this.$('infoClose').onclick = () => Game.select(null);
  },

  // ---------- Okno priorit ----------
  openPriorities() {
    const m = this.$('modal');
    const render = () => {
      let h = `<div class="mbox wide"><div class="mhead"><b>Priority práce</b><button class="x" id="mClose">✕</button></div>
        <p class="mnote">Klepnutím měníš prioritu: <b class="p1">1</b> nejvyšší … <b class="p4">4</b> nejnižší, <b class="p0">–</b> nedělá. Číslo pod prioritou = úroveň dovednosti.</p>
        <div class="ptable"><table><tr><th></th>${WORK_TYPES.map(w => `<th>${w.name}</th>`).join('')}</tr>`;
      for (const c of Game.colonists) {
        h += `<tr><td class="pname"><img class="pix portrait sm" src="${Sprites.toURL(c.portrait, 3)}" alt="">${c.first}</td>`;
        for (const w of WORK_TYPES) {
          const v = c.priorities[w.id];
          const lvl = w.skill ? c.skills[w.skill].lvl : '';
          h += `<td><button class="prio p${v}" data-c="${c.id}" data-w="${w.id}">${v || '–'}</button><small>${lvl}</small></td>`;
        }
        h += '</tr>';
      }
      h += '</table></div></div>';
      m.innerHTML = h;
      m.classList.remove('hidden');
      this.$('mClose').onclick = () => m.classList.add('hidden');
      m.querySelectorAll('.prio').forEach(b => b.onclick = () => {
        const c = Game.colonistById(+b.dataset.c);
        const v = c.priorities[b.dataset.w];
        c.priorities[b.dataset.w] = v === 0 ? 1 : v >= 4 ? 0 : v + 1;
        render();
      });
    };
    m.onclick = (e) => { if (e.target === m) m.classList.add('hidden'); };
    render();
  },

  openMenu() {
    const m = this.$('modal');
    m.innerHTML = `<div class="mbox"><div class="mhead"><b>Menu</b><button class="x" id="mClose">✕</button></div>
      <div class="menu">
        <button id="mHelp">Nápověda a ovládání</button>
        <button id="mNew">Nová kolonie (nová mapa)</button>
        <button id="mBack">Pokračovat</button>
      </div><p class="mnote">Semínko mapy: ${Game.seed}</p></div>`;
    m.classList.remove('hidden');
    const close = () => m.classList.add('hidden');
    this.$('mClose').onclick = close;
    this.$('mBack').onclick = close;
    this.$('mHelp').onclick = () => this.openHelp();
    this.$('mNew').onclick = () => { if (confirm('Opravdu začít novou kolonii? Současný postup bude ztracen.')) location.reload(); };
    m.onclick = (e) => { if (e.target === m) close(); };
  },

  openHelp(first) {
    const m = this.$('modal');
    m.innerHTML = `<div class="mbox help"><div class="mhead"><b>${first ? 'Vítej v kolonii!' : 'Nápověda'}</b><button class="x" id="mClose">✕</button></div>
      <div class="hbody">
      <p>Čtyři kolonisté ztroskotali v divočině. Postarej se, aby měli <b>jídlo</b>, <b>postele</b> a <b>střechu nad hlavou</b>. Kolonisté si práci berou sami podle svých <b>priorit</b> a dovedností – ty jen plánuješ.</p>
      <h4>Ovládání</h4>
      <ul>
        <li><b>Posun mapy:</b> táhni jedním prstem (s nástrojem Výběr) / pravé tlačítko myši / WASD.</li>
        <li><b>Zoom:</b> roztáhni dva prsty / kolečko myši.</li>
        <li><b>Výběr oblasti:</b> zvol nástroj ve spodním menu a táhni prstem přes mapu.</li>
        <li><b>Výběr kolonisty:</b> klepni na něj nebo na jeho kartu nahoře. Druhé klepnutí na kartu = sledování kamerou.</li>
        <li><b>Čas:</b> ❚❚ pauza, ▶ 1×, ▶▶ 2×, ▶▶▶ 3× (klávesy mezerník, 1, 2, 3).</li>
      </ul>
      <h4>Jak začít</h4>
      <ol>
        <li><b>Příkazy → Kácet</b>: označ pár stromů – dřevo je potřeba na všechno.</li>
        <li><b>Stavba → Ohniště</b>: na něm se vaří teplé jídlo (lepší nálada).</li>
        <li><b>Zóny → Pole</b>: na úrodné půdě (tmavá hlína) rostou brambory rychleji.</li>
        <li><b>Stavba → Postel</b> pro každého kolonistu, kolem postav <b>zdi</b> a <b>dveře</b>.</li>
        <li><b>Příkazy → Těžit</b> skálu (kámen) a železnou rudu (oranžové žilky) na lampy.</li>
      </ol>
      <p>Hlídej ukazatele <b>sytosti</b>, <b>energie</b> a <b>nálady</b>. Velmi nešťastný kolonista se může psychicky zhroutit a přestat pracovat.</p>
      </div><div class="menu"><button id="mBack">${first ? 'Začít hrát' : 'Zavřít'}</button></div></div>`;
    m.classList.remove('hidden');
    const close = () => m.classList.add('hidden');
    this.$('mClose').onclick = close;
    this.$('mBack').onclick = close;
    m.onclick = (e) => { if (e.target === m) close(); };
  },

  // ---------- Notifikace ----------
  toast(msg, kind = 'info') {
    const box = this.$('toasts');
    if (!box) return;
    const t = this.el('div', 'toast ' + kind, msg);
    box.appendChild(t);
    while (box.children.length > 4) box.removeChild(box.firstChild);
    setTimeout(() => t.classList.add('out'), 4200);
    setTimeout(() => t.remove(), 4800);
  },

  // ---------- Pravidelná aktualizace ----------
  update() {
    this.$('dayLabel').textContent = `Den ${TimeSys.day}`;
    this.$('timeLabel').textContent = TimeSys.timeStr();
    const d = TimeSys.daylight();
    this.$('sunIcon').textContent = d > 0.5 ? '☀️' : d > 0.05 ? '🌅' : '🌙';
    const wd = Weather.def;
    this.$('weatherLabel').textContent = `${Weather.cur === 'clear' && d < 0.3 ? '✨' : wd.icon} ${wd.name}`;
    const counts = World.countItems();
    for (const k of ITEM_ORDER) this.$('res-' + k).textContent = counts[k];
    this.updateColonistBar();
    if (Game.selected) this.updateInfo(false);
  },
};

// ===== js/game.js =====
'use strict';
/**
 * Game – stav hry, rezervace, herní smyčka s pevným krokem a zrychlením času.
 */
const Game = {
  colonists: [],
  res: new Map(),        // klíč → id kolonisty (rezervace cílů)
  itemRes: new Map(),    // index políčka → rezervovaný počet kusů
  speed: 1,
  lastSpeed: 1,
  tool: 'select',
  selected: null,
  tickCount: 0,
  notified: new Map(),
  acc: 0,

  init(seed) {
    this.seed = seed;
    U.seed(seed);
    TimeSys.reset();
    World.generate(seed);
    Pathfinder.init(World.w, World.h);
    Sprites.buildTerrain();
    this.res.clear(); this.itemRes.clear(); this.notified.clear();
    this.colonists = createColonists(World.start);
    Weather.reset();
    Camera.zoom = Config.ZOOM_DEFAULT;
    Camera.centerTile(World.start.x, World.start.y + 1);
  },

  // ---------- Rezervace ----------
  reserve(key, c) {
    const o = this.res.get(key);
    if (o !== undefined && o !== c.id) return false;
    if (o === undefined) { this.res.set(key, c.id); c.resKeys.push(key); }
    return true;
  },
  isReserved(key, c) {
    const o = this.res.get(key);
    return o !== undefined && (!c || o !== c.id);
  },
  reserveItem(i, n, c) {
    this.itemRes.set(i, (this.itemRes.get(i) || 0) + n);
    c.itemRes.push([i, n]);
  },
  releaseItemRes(c, i) {
    for (let k = c.itemRes.length - 1; k >= 0; k--) {
      const [ii, n] = c.itemRes[k];
      if (ii !== i) continue;
      const v = (this.itemRes.get(ii) || 0) - n;
      if (v <= 0) this.itemRes.delete(ii); else this.itemRes.set(ii, v);
      c.itemRes.splice(k, 1);
    }
  },
  availItem(i) {
    const it = World.items[i];
    if (!it) return 0;
    return it.n - (this.itemRes.get(i) || 0);
  },
  releaseAll(c) {
    for (const k of c.resKeys) if (this.res.get(k) === c.id) this.res.delete(k);
    c.resKeys.length = 0;
    for (const [i, n] of c.itemRes) {
      const v = (this.itemRes.get(i) || 0) - n;
      if (v <= 0) this.itemRes.delete(i); else this.itemRes.set(i, v);
    }
    c.itemRes.length = 0;
  },
  colonistById(id) { return this.colonists.find(c => c.id === id); },

  // ---------- Události ----------
  onTileChanged(x, y) {
    const i = World.idx(x, y);
    if (World.walk[i]) return;
    // kolonisty na nově neprůchodném políčku odsunout
    for (const c of this.colonists) {
      if (c.tx === x && c.ty === y) {
        const p = World.nearestWalkable(x, y);
        c.x = p.x + 0.5; c.y = p.y + 0.5;
        if (c.path) c.path = null;
        if (c.job) c.job.walkKey = null;
      }
    }
  },
  nearLight(x, y) {
    for (const i of World.structSet) {
      const s = World.struct[i];
      if (!s || !BUILD[s.type].light) continue;
      const sx = i % World.w, sy = (i / World.w) | 0;
      if (Math.hypot(sx - x, sy - y) <= BUILD[s.type].light * 0.8) return true;
    }
    return false;
  },
  /** Upozornění nejvýše jednou za `cooldownMin` herních minut. */
  notifyOnce(key, msg, kind, cooldownMin) {
    const last = this.notified.get(key);
    if (last !== undefined && TimeSys.minutes - last < cooldownMin) return;
    this.notified.set(key, TimeSys.minutes);
    UI.toast(msg, kind);
  },

  // ---------- Ovládání ----------
  select(sel) {
    this.selected = sel;
    if (!sel || sel.type !== 'colonist') Camera.follow = null;
    UI.updateInfo(true);
  },
  setSpeed(s) {
    this.speed = s;
    if (s > 0) this.lastSpeed = s;
    UI.updateSpeed();
  },
  togglePause() { this.setSpeed(this.speed === 0 ? this.lastSpeed : 0); },

  // ---------- Simulace ----------
  tick() {
    this.tickCount++;
    TimeSys.tick();
    Weather.tick();
    if (this.tickCount % 30 === 0) World.update(30 * Config.HOURS_PER_TICK);
    for (const c of this.colonists) c.tick();
  },

  start() {
    let last = performance.now();
    let uiT = 0;
    const loop = (now) => {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      this.acc += dt * Config.TPS * this.speed;
      let steps = 0;
      while (this.acc >= 1 && steps < 12) { this.tick(); this.acc -= 1; steps++; }
      if (steps >= 12) this.acc = 0;
      Input.update(dt);
      Camera.update();
      Renderer.draw(dt);
      uiT += dt;
      if (uiT > 0.25) { uiT = 0; UI.update(); }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  },
};

</script>
  <script>
// ===== js/main.js =====
'use strict';
/**
 * main – spuštění hry.
 */
window.addEventListener('DOMContentLoaded', () => {
  const loading = document.getElementById('loading');
  // necháme prohlížeč vykreslit obrazovku načítání, pak generujeme svět
  setTimeout(() => {
    const params = new URLSearchParams(location.search);
    const seed = params.has('seed') ? (parseInt(params.get('seed'), 10) || 1) : (Date.now() % 1000000000);
    Sprites.init();
    Game.init(seed);
    const cv = document.getElementById('game');
    Renderer.init(cv);
    Input.init(cv);
    UI.init();
    Game.start();
    loading.classList.add('hidden');
    if (!params.has('nohelp')) UI.openHelp(true);
    window.__ready = true;
  }, 30);
});

</script>
